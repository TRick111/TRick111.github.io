<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>決算書ツール モック v1 | 数字を取り出す・資料を作る</title>
<style>
:root{--navy:#1f3a5f;--navy2:#2c5282;--bg:#f5f7fa;--line:#dde3ea;--txt:#1d2733;--sub:#5b6878;--ok:#1f7a5a;--amb:#8a6d1f;--warn:#b54708;--card:#fff;--hl:#fff7e0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.55}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.lg{width:24px;height:24px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
header{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
header .tag{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
nav button{border:none;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--sub);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
nav button.on{color:var(--navy);border-bottom-color:var(--navy)}
nav .today{margin-left:auto;align-self:center;font-size:12px;color:var(--sub);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 48px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.note{font-size:12px;color:var(--sub)}
.btn{border:none;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);padding:6px 12px;font-size:13px}
.btn.line{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.6;cursor:default}
.btn.doneb{background:#e3f3ec;color:var(--ok);opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
.btn.line .spin{border-color:rgba(31,58,95,.25);border-top-color:var(--navy)}
@keyframes r{to{transform:rotate(360deg)}}
.back{border:none;background:none;color:var(--navy2);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
/* badges */
.pill{display:inline-block;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.7}
.s0{background:#eef1f5;color:#5f6b7a}.s1{background:#e8eff8;color:#2c5282}.s2{background:#f6efdc;color:#8a6d1f}.s3{background:#e3f3ec;color:#1f7a5a}.s4{background:none;color:#8a94a3;border:1px solid #dde3ea}
.pill.k{background:#eef1f5;color:var(--sub)}.pill.y{background:#fff0c2;color:#8a6d1f}.pill.a{background:#e3f3ec;color:var(--ok)}.pill.b{background:#eef4fb;color:var(--navy2)}
.chipk{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11px;color:var(--sub);font-weight:700;line-height:1.7;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
/* ===== list ===== */
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{display:inline-flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.kpi small{color:var(--sub);font-size:12px;font-weight:700}
.kpi b{font-size:24px;color:var(--navy);font-weight:800;line-height:1}
.kpi span{font-size:12px;color:var(--sub)}
.lhead .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;color:var(--sub);max-width:100%}
.grp{font-size:12px;font-weight:800;color:var(--sub);margin:16px 0 6px;letter-spacing:.04em}
.grp:first-of-type{margin-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) 190px;grid-template-areas:"who next meta";gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid #ccc;border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.row:hover{background:#f7f9fc}
.row.fresh{animation:fl 2.2s ease}
@keyframes fl{from{background:#ffe9a8}to{background:#fff}}
.row .who{grid-area:who;min-width:0}
.row .who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .next{grid-area:next;min-width:0;display:flex;gap:12px;align-items:baseline}
.row .next .d{font-weight:800;font-size:15px;color:var(--navy);white-space:nowrap}
.row .next .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .next .none{color:#a3acb8;font-size:13px}
.row .meta{grid-area:meta;text-align:right;min-width:0}
.row .meta small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.newp{display:inline-block;margin-left:6px;background:#fff0c2;color:#8a6d1f;border-radius:8px;padding:0 6px;font-size:11px;font-weight:700;white-space:nowrap}
.row.done{opacity:.65}
/* ===== calendar ===== */
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chead .lbl{font-size:16px;font-weight:800;color:var(--navy);min-width:0}
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{border:none;background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:13px;padding:5px 14px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.nb{border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-weight:700;font-size:13px;padding:4px 8px;cursor:pointer;color:var(--navy);display:inline-flex;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .dh{font-size:11px;color:var(--sub);text-align:center;font-weight:700;padding:2px 0}
.mgrid .d{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:11px;color:var(--sub);overflow:hidden;min-width:0}
.mgrid .d.out{background:#f3f5f8;color:#b3bbc6}
.mgrid .d.today{border:2px solid var(--navy2);background:#eef4fb}
.mgrid .d.today .dn{background:var(--navy2);color:#fff;border-radius:9px;padding:0 6px;font-weight:800}
.ev{display:block;margin-top:2px;border-radius:3px;padding:0 4px;color:#fff;font-size:10.5px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.past,.we.past{opacity:.5}
.ev.nw{outline:2px solid #f1c24b;outline-offset:-1px}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:260px;padding:6px;min-width:0}
.wd.today{border:2px solid var(--navy2);background:#eef4fb}
.wd .wh{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.wd.today .wh{color:var(--navy2)}
.wd.today .wh::after{content:"今日";font-size:10px;background:var(--navy2);color:#fff;border-radius:8px;padding:0 6px}
.we{border-radius:6px;padding:5px 7px;color:#fff;margin-bottom:5px;font-size:12px;cursor:pointer;min-width:0}
.we b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we small{display:block;font-size:11px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we.nw{outline:2px solid #f1c24b;outline-offset:-2px}
.wd .none{font-size:11px;color:#b3bbc6}
/* ===== detail ===== */
.dh1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dh1 h2{font-size:21px;margin:0;display:flex;align-items:center;min-width:0}
.prog{display:inline-flex;align-items:center;gap:0;margin-left:4px}
.prog i{width:7px;height:7px;border-radius:50%;background:#d5dce5;position:relative;margin-right:9px}
.prog i:not(:last-child)::after{content:"";position:absolute;left:7px;top:3px;width:9px;height:1px;background:#d5dce5}
.prog i.p{background:var(--navy2)}.prog i.p::after{background:var(--navy2)}
.prog i.c{background:#fff;border:2px solid var(--navy);width:9px;height:9px}
.prog i.c::after{left:7px;top:2px}
.pop{animation:pop 1.2s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35);box-shadow:0 0 0 4px #f1c24b}100%{transform:scale(1)}}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.nextrow{display:flex;gap:12px;align-items:stretch;margin-bottom:18px}
.nextc{flex:1;min-width:0;display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:14px 16px}
.nextc .ic{color:var(--navy);margin-top:2px}
.nextc small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.nextc .nd{display:block;font-size:22px;font-weight:800;color:var(--navy);line-height:1.3}
.nextc .nd.none{font-size:16px;color:#a3acb8}
.nextc .nt{font-size:15px;font-weight:700;margin-top:2px}
.nextc .ns{font-size:13px;color:var(--sub)}
.nextc .nm{font-size:12px;color:var(--sub);margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:none;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--sub);padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab span{display:inline-block;background:#eef1f5;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.tab.on span{background:var(--navy);color:#fff}
.pane{display:none}.pane.on{display:block}
details.rec{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
details.rec summary{cursor:pointer;padding:9px 12px;display:flex;gap:12px;align-items:center;list-style:none;font-size:13px}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary .rd{font-weight:800;color:var(--navy);width:42px;flex:none}
details.rec summary .rm{flex:1;min-width:0;display:flex;gap:12px;align-items:baseline}
details.rec summary .rm b{white-space:nowrap}
details.rec summary .rm small{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
details.rec summary .ic{color:var(--sub);transition:transform .2s}
details.rec[open] summary .ic{transform:rotate(90deg)}
details.rec.fresh{border-color:#e7c66a;background:var(--hl)}
.sheet{margin:0;padding:2px 12px 10px 66px;display:grid;grid-template-columns:88px minmax(0,1fr);gap:3px 10px;font-size:12px}
.sheet dt{color:var(--sub);font-weight:600}
.sheet dd{margin:0;white-space:pre-line}
.sl{list-style:none;margin:0;padding:0}
.sl li{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}
.sl li.past{opacity:.5}
.sl .dt{width:66px;flex:none;text-align:center;border-radius:6px;padding:3px 0;font-weight:800;font-size:13px;color:#fff}
.sl .dt small{display:block;font-weight:600;font-size:10px;opacity:.9}
.sl .tx{flex:1;min-width:0}
.sl .tx b{display:block;font-size:14px}
.sl .tx small{color:var(--sub);font-size:12px}
.sl .why{font-size:11px;background:#eef1f5;border-radius:4px;padding:2px 6px;color:var(--sub);flex:none;max-width:200px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--sub);font-size:13px}
.prof{padding:14px 16px}
.prof h3{font-size:13px;margin:0 0 8px;color:var(--sub);display:flex;align-items:center;gap:6px}
.prof dl{margin:0;display:grid;grid-template-columns:80px minmax(0,1fr);gap:6px 10px;font-size:12.5px}
.prof dt{color:var(--sub)}
.prof dd{margin:0;white-space:pre-line}
/* slides */
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;transition:background .4s;min-width:0}
.th.flash{background:var(--hl)}
.th .pv{aspect-ratio:16/9;background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.pv .ttl{font-size:10px;font-weight:800;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv .ln{height:5px;background:#e4e9f0;border-radius:3px}
.pv .bars{display:flex;align-items:flex-end;gap:4px;flex:1}
.pv .bars span{flex:1;background:var(--navy2);border-radius:2px 2px 0 0}
.pv .bars span.g{background:#c4ccd6}
.pv .kp{font-size:15px;font-weight:800;color:var(--ok)}
.pv.cover{background:var(--navy);color:#fff;justify-content:center}
.pv.cover .ttl{color:#fff;border-color:#fff;font-size:11px}
.pv .sm{font-size:9px;opacity:.85}
.th .cap{padding:6px 8px;font-size:12px}
.th .cap b{display:block;font-size:12px}
.th .cap small{color:var(--sub);font-size:11px}
.stock{margin-top:12px;border:1px solid #e7c66a;background:#fffbef;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stock>.ic{color:var(--amb)}
.stock b{font-size:13px}
.stock .val{font-size:17px;font-weight:800;color:var(--navy)}
.stock .btn{margin-left:auto}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
/* ===== input ===== */
.ititle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ititle h2{font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
.ititle h2 .ic{color:var(--navy)}
.ititle span{font-size:14px;color:var(--sub);font-weight:700}
.steps{max-width:960px}
.step{margin-bottom:14px;transition:opacity .4s}
.step.off{opacity:.38;pointer-events:none}
.step h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step h3 .no{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font-size:12px;flex:none}
.step h3 small{font-weight:400;color:var(--sub);font-size:12px}
.step h3 .okm{color:var(--ok);margin-left:auto;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.memo{width:100%;min-height:120px;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;color:var(--txt);resize:vertical}
.only{font-size:12px;color:var(--sub);margin-top:6px}
.hint{display:none;margin-top:8px;font-size:12px;color:var(--warn);background:#fff4ea;border-radius:6px;padding:6px 9px}
.hint.on{display:block}
.sbar{display:flex;justify-content:flex-end;margin-top:12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.fld label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:3px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--txt);transition:background .4s;resize:vertical}
.fld.flash input,.fld.flash textarea{background:var(--hl);border-color:#e7c66a}
.out3{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.out3>div{min-width:0}
.out3 h4{font-size:13px;margin:0 0 6px;color:var(--navy);display:flex;align-items:center;gap:6px}
.out3 h4 small{font-weight:400;color:var(--sub)}
.sl li.prop .dt{background:#d4a72c}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#eef1f5;color:var(--sub);font-weight:700;white-space:nowrap}
.wtab{min-width:720px}
tbody tr[data-cid]{cursor:pointer}
tbody tr[data-cid]:hover td{background:#f4f7fb}
tr.new td{background:var(--hl)}
tr.new.anim td{animation:fl2 2s ease}
@keyframes fl2{from{background:#ffe9a8}to{background:var(--hl)}}
/* ===== week ===== */
.weekhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:13px}
.weekhead .lbl{font-weight:800;color:var(--navy);font-size:15px}
.wnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wsum{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wsum div{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--sub)}
.wsum b{font-size:16px;color:var(--navy);margin-left:4px}
.ylg{display:inline-block;width:12px;height:12px;background:var(--hl);border:1px solid #e7c66a;border-radius:2px;vertical-align:-2px;margin-right:4px}
.res{display:none;margin-top:10px;background:#e3f3ec;border:1px solid #b7dfcd;color:var(--ok);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;align-items:center;gap:6px}
.res.on{display:flex}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ok);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:all .35s;max-width:calc(100vw - 32px);z-index:20;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
a.btn{text-decoration:none}
.btn.ok:hover{background:#196b4e}
.hbtns{margin-left:auto;display:flex;gap:8px;align-items:center}
.hbtn{height:38px;padding:0 14px;font-size:13px}
.hbtn.hocr{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75)}
.hbtn.hocr:hover{background:rgba(255,255,255,.12)}
.sf{display:none}
.dh1 .btn.add{margin-left:auto;height:40px;padding:0 18px;font-size:14px}
.nago{display:inline-block;font-size:11px;font-weight:700;color:var(--navy2);background:#eef4fb;border-radius:8px;padding:0 7px;margin-left:6px;white-space:nowrap;line-height:1.7;vertical-align:2px}
.docbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.caserow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border-left:5px solid var(--navy)}
.caserow .crl{font-size:12px;color:var(--sub);font-weight:700}
.caserow .crn{font-size:16px;font-weight:800;color:var(--navy);display:inline-flex;align-items:center;min-width:0}
.caserow .crs{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:700;min-width:0}
.caserow select{color:var(--txt);font-size:13px;padding:6px 8px;min-width:0}
.caserow .crw{flex-basis:100%;font-size:12px;color:var(--sub)}
.flash2{animation:fl3 1.6s ease}
@keyframes fl3{from{background:#ffe9a8}to{background:#fff}}
.ptab{min-width:800px}
.ptab td{vertical-align:middle}
.ptab tr.offr td:not(.c){opacity:.42}
.ptab td.c,.ptab th.c{text-align:center;width:48px}

 <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 8v5M8 10.5h5"/></symbol>
 <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/></symbol>
 <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
 <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
</svg>
<header>
 <h1>決算書ツール</h1><span class="tag">モック v1</span>
 <span class="hcl" id="hcl"></span>
 <a class="hback" id="hback" href="../index.html#clients"><svg class="ic sm"><use href="#i-back"/></svg>クライアントに戻る</a>
</header>
<div class="wrap" id="app"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true"><div class="in"><div class="lbh"><b id="lbt"></b><button class="xb" id="lbx" aria-label="閉じる"><svg class="ic sm"><use href="#i-x"/></svg></button></div><div id="lbb"></div></div></div>
<div class="toast" id="toast"><svg class="ic sm"><use href="#i-check"/></svg><span id="toastt"></span></div>
<script>
// ===== ダミーデータ（ワーカー④と同じクライアント）=====
const CLIENTS={
 C1:{name:'サンプル株式会社',scale:1,docs:[
  {id:'k18',kind:'決算書',p:18,date:'11/25',done:['bs','pl']},
  {id:'u18',kind:'勘定科目内訳書',p:18,date:'11/25',done:[]},
  {id:'u17',kind:'勘定科目内訳書',p:17,date:'10/02',done:'all'},
  {id:'k17',kind:'決算書',p:17,date:'10/02',done:'all'},
  {id:'k16',kind:'決算書',p:16,date:'10/02',done:'all'}],
  data:{16:'ok',17:'ok',18:'un'}},
 C2:{name:'サンプル精工',scale:.42,docs:[{id:'k17',kind:'決算書',p:17,date:'11/18',done:[]}],data:{}},
 C3:{name:'サンプル商事',scale:.3,docs:[],data:{}},
 C4:{name:'サンプル物産',scale:.65,docs:[{id:'k9',kind:'決算書',p:9,date:'11/22',done:'all'},{id:'k8',kind:'決算書',p:8,date:'11/10',done:'all'}],data:{8:'ok',9:'ok'}},
 C5:{name:'サンプル工業',scale:1.6,docs:[{id:'k24',kind:'決算書',p:24,date:'11/12',done:'all'}],data:{24:'un'}}
};
const LAB={bs:'貸借対照表',pl:'損益計算書',sga:'販管費',mfg:'製造原価',uw:'内訳',oth:'その他'};
const NUMERIC=['bs','pl','sga','mfg','uw'];
const PAGES={'決算書':[['oth','表紙'],['bs','貸借対照表'],['pl','損益計算書'],['sga','販売費及び一般管理費内訳'],['mfg','製造原価報告書'],['oth','株主資本等変動計算書'],['oth','個別注記表']],
 '勘定科目内訳書':[['uw','預貯金等の内訳書'],['uw','売掛金（未収入金）の内訳書'],['uw','買掛金（未払金）の内訳書'],['oth','役員給与等の内訳書']]};
// 千円。C1 基準。他社は scale 倍
const BASE={2:{sales:812400,cogs:563100,sga:201800,nonop:1700,ta:655000,na:241300,ni:32100},
 1:{sales:851900,cogs:590200,sga:209400,nonop:2500,ta:688200,na:277200,ni:35900},
 0:{sales:903600,cogs:627400,sga:218900,nonop:800,ta:721500,na:315600,ni:38400},
 3:{sales:780100,cogs:545200,sga:196500,nonop:1200,ta:631000,na:211400,ni:29400}};
function fin(c,p){const mx=Math.max(...CLIENTS[c].docs.map(d=>d.p),p),b=BASE[Math.min(3,Math.max(0,mx-p))],s=CLIENTS[c].scale,r=v=>Math.round(v*s/100)*100;
 const o={sales:r(b.sales),cogs:r(b.cogs),sga:r(b.sga),ta:r(b.ta),na:r(b.na),ni:r(b.ni),nonop:r(b.nonop)};
 o.gp=o.sales-o.cogs;o.op=o.gp-o.sga;o.ord=o.op+o.nonop;return o}
const ROWS=[['sec','損益計算書'],['sales','売上高','pl'],['cogs','売上原価','pl'],['gp','売上総利益','pl'],['sga','販売費及び一般管理費','pl'],['op','営業利益','pl'],['ord','経常利益','pl'],['ni','当期純利益','pl'],['sec','貸借対照表'],['ta','資産合計','bs'],['na','純資産合計','bs']];
const WARN={C1:{18:'sga'},C2:{17:'ord'},C5:{24:'na'}}; // 読み取りの自信が低いセル（ダミー）

// ===== 状態 =====
const Q=new URLSearchParams(location.search);
const S={c:CLIENTS[Q.get('client')]?Q.get('client'):'C1',mode:Q.get('mode')==='doc'||Q.get('step')==='preview'?'doc':'ocr',view:'',sel:{},all:false,ty:'ds',s6:1,face:null,detour:null,gen:false};
const C=()=>CLIENTS[S.c];
const $=id=>document.getElementById(id);
const fmt=v=>v==null?'':v.toLocaleString('ja-JP');
const ic=(n,cls)=>`<svg class="ic ${cls||''}"><use href="#i-${n}"/></svg>`;
const back=tab=>`../index.html#client=${S.c}&tab=${tab}`;
function isDone(d,i){const k=PAGES[d.kind][i][0];return d.done==='all'||d.done.includes(k)}
function toast(t){$('toastt').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),2200)}

// ===== ページのダミー画像（SVG）=====
function pageSVG(d,i,boxes){
 const [k,title]=PAGES[d.kind][i],c=S.c,f=fin(c,d.p),W=300,H=420;
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${d.kind} 第${d.p}期 p.${i+1} ${title}"><rect x=".5" y=".5" width="${W-1}" height="${H-1}" fill="#fff" stroke="#cfd6df"/>`;
 const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||9}" fill="${o.c||'#222'}" font-weight="${o.b?700:400}" text-anchor="${o.a||'start'}" font-family="Hiragino Mincho ProN,serif">${t}</text>`;
 if(k==='oth'&&title==='表紙'){
  s+=T(150,150,'決 算 報 告 書',{fs:20,a:'middle',b:1})+T(150,190,`第 ${d.p} 期`,{fs:13,a:'middle'})+T(150,212,`自 令和${d.p-11}年4月1日　至 令和${d.p-10}年3月31日`,{fs:9,a:'middle'})+T(150,330,CLIENTS[c].name,{fs:14,a:'middle',b:1});
  return s+'</svg>'}
 s+=T(150,34,title,{fs:13,a:'middle',b:1})+T(150,50,`第${d.p}期　令和${d.p-10}年3月31日現在`,{fs:8,a:'middle',c:'#555'})+T(278,64,'（単位：千円）',{fs:7,a:'end',c:'#555'});
 let rows=[];
 if(k==='bs'){const L=f.ta-f.na;rows=[['資産の部',null,1],['流動資産',f.ta*.55],['　現金及び預金',f.ta*.22],['　売掛金',f.ta*.2],['　棚卸資産',f.ta*.13],['固定資産',f.ta*.45],['　有形固定資産',f.ta*.33],['　投資その他の資産',f.ta*.12],['資産合計',f.ta,1,'ta'],['負債の部',null,1],['流動負債',L*.6],['固定負債',L*.4],['負債合計',L,1],['純資産の部',null,1],['株主資本',f.na*.98],['純資産合計',f.na,1,'na'],['負債純資産合計',f.ta,1]]}
 else if(k==='pl'){rows=[['売上高',f.sales,0,'sales'],['売上原価',f.cogs,0,'cogs'],['売上総利益',f.gp,1,'gp'],['販売費及び一般管理費',f.sga,0,'sga'],['営業利益',f.op,1,'op'],['営業外収益',f.nonop*2.1],['営業外費用',f.nonop*1.1],['経常利益',f.ord,1,'ord'],['特別利益',f.ord*.02],['特別損失',f.ord*.05],['税引前当期純利益',f.ni*1.5],['法人税等',f.ni*.5],['当期純利益',f.ni,1,'ni']]}
 else if(k==='sga'){const g=f.sga;rows=[['役員報酬',g*.14],['給料手当',g*.36],['法定福利費',g*.07],['地代家賃',g*.09],['減価償却費',g*.06],['旅費交通費',g*.05],['通信費',g*.02],['支払手数料',g*.04],['広告宣伝費',g*.05],['その他',g*.12],['販売費及び一般管理費 合計',g,1,'sga']]}
 else if(k==='mfg'){const m=f.cogs*.92;rows=[['材料費',m*.48],['労務費',m*.31],['経費',m*.21],['当期総製造費用',m,1],['期首仕掛品棚卸高',m*.04],['期末仕掛品棚卸高',m*.05],['当期製品製造原価',m*.99,1]]}
 else if(k==='uw'){rows=[['A銀行 本店 普通',f.ta*.08],['A銀行 本店 定期',f.ta*.05],['B信用金庫 駅前 当座',f.ta*.04],['C銀行 支店 普通',f.ta*.03],['その他',f.ta*.02],['合計',f.ta*.22,1]]}
 if(rows.length){let y=78;const rh=k==='bs'?19:k==='pl'?22:24;
  rows.forEach(r=>{const [lb,v,b,key]=r;
   s+=`<line x1="20" y1="${y+6}" x2="280" y2="${y+6}" stroke="#ddd"/>`+T(24,y,lb,{b,fs:8.5});
   if(v!=null){const t=fmt(Math.round(v));s+=T(274,y,t,{a:'end',b,fs:8.5});
    if(boxes&&key)s+=`<rect class="bx${WARN[S.c]&&WARN[S.c][d.p]===key?' warn':''}" data-k="${key}" x="200" y="${y-10}" width="78" height="14" rx="1.5"/>`;}
   y+=rh});
  s+=`<rect x="20" y="66" width="260" height="${y-66-10}" fill="none" stroke="#999"/><line x1="190" y1="66" x2="190" y2="${y-10}" stroke="#bbb"/>`;}
 else{let y=78;for(let j=0;j<20;j++){const w=j%5===4?140:240;s+=`<rect x="24" y="${y}" width="${w}" height="5" rx="2" fill="#e3e7ec"/>`;y+=14}
  if(title==='株主資本等変動計算書'){s='';s=pageGrid(d,title)}}
 return s+'</svg>'}
function pageGrid(d,title){let s=`<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg"><rect x=".5" y=".5" width="299" height="419" fill="#fff" stroke="#cfd6df"/><text x="150" y="34" font-size="13" text-anchor="middle" font-weight="700" font-family="serif">${title}</text>`;
 for(let r=0;r<12;r++)for(let c=0;c<5;c++){s+=`<rect x="${20+c*52}" y="${70+r*22}" width="52" height="22" fill="none" stroke="#ccc"/>`;if(c>0&&r>0)s+=`<rect x="${30+c*52}" y="${78+r*22}" width="34" height="5" rx="2" fill="#e3e7ec"/>`}
 return s}

// ===== 画面の骨組み =====
function stepper(items,now,onClick){
 return `<div class="stp">`+items.map((t,i)=>{const n=i+1,st=n<now?'ok':n===now?'now':'';
  return (i?`<span class="bar2 ${n<=now?'ok':''}"></span>`:'')+`<button class="s ${st} ${onClick&&n<now?'link':''}" data-step="${n}" ${onClick&&n<now?'':'tabindex="-1"'}><span class="n">${n<now?ic('check'):n}</span><span class="t">${t}</span></button>`}).join('')+`</div>`}
const OCR_STEPS=['書類とページを選ぶ','読み取り中','完了'];
const DOC_STEPS=['資料の種類','必要書類','データの状態','生成'];
function head(){
 $('hcl').textContent=C().name;
 $('hback').href=back(S.view==='s5'||S.view.startsWith('s4')?'data':S.view==='s6'&&S.s6===4&&S.gen?'mats':'docs');}
function detourBar(){if(!S.detour)return'';
 return `<div class="detour">${ic('arrow','sm')}資料の作成の途中（${S.detour}）。終わると「データの状態」に戻ります<button class="btn ghost" data-act="todoc">資料の作成に戻る</button></div>`}
function render(){head();const a=$('app');
 if(S.view==='s4sel')a.innerHTML=vSel();else if(S.view==='s4run')a.innerHTML=vRun();else if(S.view==='s4done')a.innerHTML=vDone();else if(S.view==='s5')a.innerHTML=vChk();else a.innerHTML=vDoc();
 bind();window.scrollTo(0,0)}

// ===== S4① =====
function defaults(){S.sel={};C().docs.forEach(d=>PAGES[d.kind].forEach((p,i)=>{if(!isDone(d,i)&&(S.all||NUMERIC.includes(p[0])))S.sel[d.id+':'+i]=1}))}
function selCount(){return Object.keys(S.sel).length}
function pgCard(d,i){const [k,t]=PAGES[d.kind][i],id=d.id+':'+i,dn=isDone(d,i),on=!!S.sel[id];
 return `<div class="pg ${dn?'done':''} ${on?'on':''}" data-pg="${id}"><button class="pgimg" data-zoom="${id}" aria-label="拡大">${pageSVG(d,i)}<span class="zm">${ic('zoom','sm')}拡大</span></button>
 <div class="pgf"><span class="lab ${k}">${LAB[k]}</span><span class="pno">p.${i+1}</span>${dn?`<span class="donem">${ic('check','sm')}済</span>`:`<label class="ck"><input type="checkbox" data-ck="${id}" ${on?'checked':''}>OCR する</label>`}</div></div>`}
function docSec(d){const n=PAGES[d.kind].length,dn=PAGES[d.kind].filter((_,i)=>isDone(d,i)).length;
 return `<div class="dsec"><h3>${ic('doc')}${d.kind} 第${d.p}期<small>${n} 面 ・ 追加 ${d.date}${dn?` ・ 済 ${dn} 面`:''}</small></h3><div class="pgs">${PAGES[d.kind].map((_,i)=>pgCard(d,i)).join('')}</div></div>`}
function vSel(){const docs=C().docs;
 if(!docs.length)return mh()+stepper(OCR_STEPS,1)+`<div class="empty">書類がまだありません。<br><br><a class="btn" href="../index.html#upload=${S.c}">${ic('plus')}書類を追加</a></div>`;
 const todo=docs.filter(d=>PAGES[d.kind].some((_,i)=>!isDone(d,i))),fin_=docs.filter(d=>!todo.includes(d));
 const n=selCount();
 return mh()+detourBar()+stepper(OCR_STEPS,1)+
 `<div class="selbar"><div class="seg" style="margin-left:0"><button class="${S.all?'':'on'}" data-all="0">数値ページだけ</button><button class="${S.all?'on':''}" data-all="1">全部</button></div>
  <span class="cnt">選択<b>${n}</b>面 ・ 目安 約 ${Math.max(1,Math.round(n*8/60*10)/10)} 分</span>
  <button class="btn go" data-act="run" ${n?'':'disabled'}>${ic('scan')}OCR を実行</button></div>`+
 (todo.length?todo.map(docSec).join(''):`<div class="empty">すべてのページが OCR 済みです</div>`)+
 (fin_.length?`<details class="olds"><summary>OCR 済みの書類（${fin_.length} 冊）</summary>${fin_.map(docSec).join('')}</details>`:'')}
function mh(){const doc=S.detour;return `<div class="mh"><h2>${ic(doc?'doc':'scan','lg')}${doc?'資料を作る':'数字を取り出す'}</h2></div>`}

// ===== S4② =====
let runT=null;
function vRun(){const L=S.queue,n=L.length;
 return mh()+detourBar()+stepper(OCR_STEPS,2)+`<div class="card runc"><b style="font-size:15px">読み取り中</b>
 <div class="pbar"><i id="pb"></i></div>
 <div class="runrow"><div class="cur" id="rcur"></div><div><div class="rnum"><span id="rn">0</span><small> ／ ${n} 面</small></div><div class="rnow" id="rnow"></div><div class="rleft" id="rleft"></div></div></div>
 <div class="bar" style="justify-content:flex-start"><button class="btn ghost" data-act="cancel">中止</button><span class="note">閉じても読み取りは続きます</span></div></div>`}
function startRun(){S.queue=Object.keys(S.sel);S.view='s4run';render();const n=S.queue.length;let i=0;const step=Math.max(300,Math.round(3000/n));
 const tick=()=>{const [did,pi]=S.queue[Math.min(i,n-1)].split(':'),d=C().docs.find(x=>x.id===did),idx=+pi;
  $('rn').textContent=Math.min(i+1,n);$('pb').style.width=(Math.min(i+1,n)/n*100)+'%';
  $('rnow').textContent=`いま: ${d.kind} 第${d.p}期 p.${idx+1} ${LAB[PAGES[d.kind][idx][0]]}`;
  $('rleft').textContent=`残り 約 ${Math.max(0,(n-i-1)*8)} 秒`;$('rcur').innerHTML=pageSVG(d,idx);
  i++;if(i<n)runT=setTimeout(tick,step);else runT=setTimeout(finishRun,step)};
 tick()}
function finishRun(){S.queue.forEach(id=>{const [did,pi]=id.split(':'),d=C().docs.find(x=>x.id===did);
  if(d.done!=='all'){d.done=d.done.concat([PAGES[d.kind][+pi][0]]);if(PAGES[d.kind].every((_,i)=>isDone(d,i)))d.done='all'}
  if(d.kind==='決算書'&&(!C().data[d.p]||C().data[d.p]==='no'))C().data[d.p]='un'});
 S.view='s4done';render()}

// ===== S4③ =====
function vDone(){const n=S.queue.length;
 return mh()+detourBar()+stepper(OCR_STEPS,3)+`<div class="card runc"><b style="font-size:15px;display:inline-flex;align-items:center;gap:6px;color:var(--ok)">${ic('check')}読み取りが終わりました</b>
 <div class="kp3"><div><small>読んだ面</small><b>${n}</b><span>面</span></div><div><small>取り出した値</small><b>${n*27}</b><span>個</span></div><div><small>要確認</small><b class="w">${WARN[S.c]?1:0}</b><span>個</span></div></div>
 <div class="endbar"><button class="btn big" data-act="tocheck">読み取り結果を確認${ic('arrow')}</button><a class="btn line" href="${back('data')}">あとで確認する</a></div></div>`}

// ===== S5 =====
function periods(){return Object.keys(C().data).filter(p=>C().data[p]!=='no').map(Number).sort()}
function vChk(){const ps=periods();
 if(!ps.length)return `<div class="mh"><h2>${ic('check','lg')}読み取り確認</h2></div><div class="empty">確認できる読み取り結果がありません。<br><br><button class="btn" data-act="toocr">${ic('scan')}OCR する</button></div>`;
 if(!S.face)S.face={p:ps[ps.length-1],st:'pl'};
 const kd=C().docs.find(d=>d.kind==='決算書'&&d.p===S.face.p),pi=S.face.st==='bs'?1:2;
 const un=ps.filter(p=>C().data[p]==='un');
 const fs=ps.map(p=>fin(S.c,p));
 let tb='';ROWS.forEach(r=>{if(r[0]==='sec'){tb+=`<tr><td class="sec2" colspan="${ps.length+1}">${r[1]}</td></tr>`;return}
  tb+=`<tr><td class="k">${r[1]}</td>`+ps.map((p,j)=>{const w=WARN[S.c]&&WARN[S.c][p]===r[0]&&C().data[p]==='un';return `<td class="num"><span class="v ${w?'w':''}" data-p="${p}" data-k="${r[0]}" data-st="${r[2]}">${fmt(fs[j][r[0]])}</span></td>`}).join('')+`</tr>`});
 return `<div class="mh"><h2>${ic('check','lg')}読み取り確認</h2><div class="mtools"><a class="btn ghost" href="https://kessan-yomitori-demo.vercel.app" target="_blank" rel="noopener">${ic('ext','sm')}本物の確認画面を開く（既存モック）</a><button class="btn ok" data-act="confirm">${ic('check')}確認済みにする</button></div></div>`+detourBar()+
 `<div class="chk"><div class="card"><div class="faceh"><b>原本　第${S.face.p}期 ${LAB[S.face.st]}</b><div class="seg2">${ps.map(p=>`<button class="${p===S.face.p?'on':''}" data-fp="${p}">${p}期</button>`).join('')}</div><div class="seg2"><button class="${S.face.st==='pl'?'on':''}" data-fs="pl">PL</button><button class="${S.face.st==='bs'?'on':''}" data-fs="bs">BS</button></div></div>
 <div class="facew" id="face">${kd?pageSVG(kd,pi,true):''}</div></div>
 <div class="card"><div class="faceh"><b>読み取った数字</b><span class="note">（単位：千円）</span></div><div class="tw"><table class="vt"><thead><tr><th>科目</th>${ps.map(p=>`<th class="num">第${p}期<span class="pill ${C().data[p]==='ok'?'a':'y'}">${C().data[p]==='ok'?'確認済':'未確認'}</span></th>`).join('')}</tr></thead><tbody>${tb}</tbody></table></div>
 <div class="legend2"><span><i style="background:#fff1c7;border:1px solid #e2c770"></i>乗せると原本の枠が光る</span>${WARN[S.c]?`<span><i style="background:#fff4d6;border:1px solid #d4a72c"></i>読み取りの自信が低い</span>`:''}<span>未確認 ${un.length} 期</span></div></div></div>`}
function hl(k,on){document.querySelectorAll('#face .bx').forEach(b=>b.classList.toggle('hl',on&&b.dataset.k===k))}

// ===== S6 =====
const TYPES=[{id:'ds',t:'ディスカッションシート',s:'提案の場で使う 1 枚',need:'決算書 3 期',mini:'gr'},{id:'sum',t:'決算分析サマリー',s:'3 期の推移と所見',need:'決算書 3 期',mini:'bars'},{id:'stk',t:'自社株評価の下準備',s:'評価に使う数字の一覧',need:'決算書 3 期＋勘定科目内訳書',mini:'gr'}];
function last3(){const ps=C().docs.map(d=>d.p);const mx=ps.length?Math.max(...ps):18;return [mx-2,mx-1,mx]}
function reqRows(){const p3=last3(),has=(k,p)=>C().docs.some(d=>d.kind===k&&d.p===p);
 const r=p3.map(p=>({t:`決算書 第${p}期`,ok:has('決算書',p),must:true}));
 r.push({t:`勘定科目内訳書 第${p3[2]}期`,ok:has('勘定科目内訳書',p3[2]),must:S.ty==='stk'});return r}
function perState(p){const s=C().data[p];const hasDoc=C().docs.some(d=>d.kind==='決算書'&&d.p===p);return s==='ok'?'ok':s==='un'?'un':hasDoc?'no':'nd'}
function vDoc(){let body='',nextOk=true,why='';
 if(S.s6===1){body=`<div class="types">${TYPES.map(t=>`<button class="ty ${S.ty===t.id?'on':''}" data-ty="${t.id}"><span class="tp"><b>${t.t}</b><span class="rd"></span></span><span class="mini"><span class="tl"></span><span class="ln"></span>${t.mini==='gr'?'<span class="gr">'+'<i></i>'.repeat(12)+'</span>':'<span class="bars"><i style="height:45%"></i><i style="height:62%"></i><i style="height:80%"></i></span>'}</span><small>${t.s}</small><span class="need">必要: <b>${t.need}</b></span></button>`).join('')}</div>`}
 else if(S.s6===2){const rs=reqRows();nextOk=rs.every(r=>r.ok||!r.must);if(!nextOk)why='必須の書類が足りません';
  body=`<div class="tw"><table class="rq"><thead><tr><th>書類</th><th>区分</th><th>状態</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${r.t}</b></td><td>${r.must?'必須':'<span class="opt">あると良い</span>'}</td><td class="st">${r.ok?`<span class="okb">${ic('check','sm')}ある</span>`:`<span class="ngb">${ic('warn','sm')}足りない</span>`}</td><td class="act">${r.ok?'':`<a class="btn ghost" href="../index.html#upload=${S.c}">${ic('plus','sm')}書類を追加</a>`}</td></tr>`).join('')}</tbody></table></div>`}
 else if(S.s6===3){const p3=last3();const st=p3.map(perState);nextOk=st.every(s=>s==='ok');if(!nextOk)why='すべての期が「確認済」になると生成できます';
  const M={ok:['確認済','値 27 個'],un:['未確認','読み取り済み・確認待ち'],no:['未 OCR','書類はあります'],nd:['書類なし','決算書が未登録']};
  body=`<div class="pers">${p3.map((p,j)=>{const s=st[j];return `<div class="per ${s}"><span class="ph">第${p}期</span><span class="ps">${M[s][0]}</span><span class="pm">${M[s][1]}</span>${s==='un'?`<button class="btn" data-act="gochk" data-p="${p}">${ic('check')}確認する</button>`:s==='no'?`<button class="btn" data-act="goocr" data-p="${p}">${ic('scan')}OCR する</button>`:s==='nd'?`<a class="btn ghost" href="../index.html#upload=${S.c}">${ic('plus','sm')}書類を追加</a>`:''}</div>`}).join('')}</div>`}
 else{body=S.gen?vPrev():`<div class="card gen"><span class="spin"></span><p>${TYPES.find(t=>t.id===S.ty).t}を作っています</p></div>`}
 const nb=S.s6<4?`<div class="nbar">${S.s6>1?`<button class="btn line" data-act="prev">${ic('back')}戻る</button>`:''}${why?`<span class="why">${why}</span>`:''}<button class="btn go" data-act="next" ${nextOk?'':'disabled'}>${S.s6===3?'資料を生成':'次へ'}${ic('arrow')}</button></div>`:'';
 return `<div class="mh"><h2>${ic('doc','lg')}資料を作る</h2></div>`+stepper(DOC_STEPS,S.gen&&S.s6===4?5:S.s6,true)+body+nb}
function vPrev(){const p3=last3(),fs=p3.map(p=>fin(S.c,p)),t=TYPES.find(x=>x.id===S.ty).t;
 const rr=[['売上高','sales'],['売上総利益','gp'],['営業利益','op'],['経常利益','ord'],['当期純利益','ni'],['純資産','na']];
 const g=(a,b)=>b?((a/b-1)*100).toFixed(1):0;
 return `<div class="prev"><div class="ph2"><b>${t}</b><small>${C().name} ・ 第${p3[0]}〜${p3[2]}期 ・ 作成 11/26</small></div><div class="pb"><div><h4>3 期の推移（千円）</h4><div class="tw"><table class="vt"><thead><tr><th>科目</th>${p3.map(p=>`<th class="num">第${p}期</th>`).join('')}</tr></thead><tbody>${rr.map(r=>`<tr><td class="k">${r[0]}</td>${fs.map((f,j)=>`<td class="num">${fmt(f[r[1]])}${j?`<span class="up">${g(f[r[1]],fs[j-1][r[1]])>0?'+':''}${g(f[r[1]],fs[j-1][r[1]])}%</span>`:''}</td>`).join('')}</tr>`).join('')}<tr><td class="k">自己資本比率</td>${fs.map(f=>`<td class="num">${(f.na/f.ta*100).toFixed(1)}%</td>`).join('')}</tr></tbody></table></div></div>
 <div class="obs"><h4>所見</h4><ul><li>売上高は 3 期連続で増加（第${p3[2]}期 ${g(fs[2].sales,fs[0].sales)}%／2 期）</li><li>営業利益率 ${(fs[2].op/fs[2].sales*100).toFixed(1)}%、販管費の伸びは売上より緩やか</li><li>純資産が積み上がり、自己資本比率は ${(fs[2].na/fs[2].ta*100).toFixed(1)}%</li></ul></div></div></div>
 <div class="prevbar"><a class="btn ghost" href="https://kessan-yomitori-demo.vercel.app" target="_blank" rel="noopener">${ic('ext','sm')}本物のプレビュー（既存モック②）</a><div class="r"><button class="btn line" data-act="pdf">${ic('dl')}PDF</button><a class="btn" href="${back('mats')}">クライアントの資料タブへ${ic('arrow')}</a></div></div>`}
function startGen(){S.s6=4;S.gen=false;render();setTimeout(()=>{S.gen=true;render();toast('資料を作りました')},2000)}

// ===== 操作 =====
function bind(){const a=$('app');
 a.querySelectorAll('[data-ck]').forEach(x=>x.onchange=()=>{const id=x.dataset.ck;if(x.checked)S.sel[id]=1;else delete S.sel[id];render2()});
 a.querySelectorAll('[data-all]').forEach(x=>x.onclick=()=>{S.all=x.dataset.all==='1';defaults();render()});
 a.querySelectorAll('[data-zoom]').forEach(x=>x.onclick=()=>{const [did,pi]=x.dataset.zoom.split(':'),d=C().docs.find(y=>y.id===did);$('lbt').textContent=`${d.kind} 第${d.p}期 p.${+pi+1} ${LAB[PAGES[d.kind][+pi][0]]}`;$('lbb').innerHTML=pageSVG(d,+pi);$('lb').classList.add('on')});
 a.querySelectorAll('[data-fp]').forEach(x=>x.onclick=()=>{S.face.p=+x.dataset.fp;render()});
 a.querySelectorAll('[data-fs]').forEach(x=>x.onclick=()=>{S.face.st=x.dataset.fs;render()});
 a.querySelectorAll('span.v').forEach(x=>{x.onmouseenter=()=>{const p=+x.dataset.p,st=x.dataset.st;if(S.face.p!==p||S.face.st!==st){S.face={p,st};const kd=C().docs.find(d=>d.kind==='決算書'&&d.p===p);$('face').innerHTML=kd?pageSVG(kd,st==='bs'?1:2,true):'';
    const h=a.querySelector('.faceh b');if(h)h.textContent=`原本　第${p}期 ${LAB[st]}`;a.querySelectorAll('[data-fp]').forEach(b=>b.classList.toggle('on',+b.dataset.fp===p));a.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('on',b.dataset.fs===st))}
   hl(x.dataset.k,true)};x.onmouseleave=()=>hl(x.dataset.k,false);x.onclick=()=>x.onmouseenter()});
 a.querySelectorAll('[data-ty]').forEach(x=>x.onclick=()=>{S.ty=x.dataset.ty;render()});
 a.querySelectorAll('.stp .s.link').forEach(x=>x.onclick=()=>{S.s6=+x.dataset.step;S.gen=false;render()});
 a.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>act(x.dataset.act,x))}
function render2(){const n=selCount();document.querySelectorAll('[data-pg]').forEach(e=>e.classList.toggle('on',!!S.sel[e.dataset.pg]));
 const c=document.querySelector('.selbar .cnt');if(c)c.innerHTML=`選択<b>${n}</b>面 ・ 目安 約 ${Math.max(1,Math.round(n*8/60*10)/10)} 分`;const g=document.querySelector('[data-act=run]');if(g)g.disabled=!n}
function act(k,x){
 if(k==='run')startRun();
 else if(k==='cancel'){clearTimeout(runT);S.view='s4sel';render()}
 else if(k==='tocheck'){S.face=null;S.view='s5';render()}
 else if(k==='toocr'){S.view='s4sel';defaults();render()}
 else if(k==='confirm'){periods().forEach(p=>C().data[p]='ok');
  if(S.detour){toast('確認済みにしました');S.detour=null;S.view='s6';S.s6=3;render()}
  else{toast('確認済みにしました');setTimeout(()=>location.href=back('data'),900)}}
 else if(k==='todoc'){clearTimeout(runT);S.detour=null;S.view='s6';S.s6=3;render()}
 else if(k==='next'){if(S.s6===3)startGen();else{S.s6++;render()}}
 else if(k==='prev'){S.s6--;render()}
 else if(k==='gochk'){S.detour=`第${x.dataset.p}期の確認`;S.face={p:+x.dataset.p,st:'pl'};S.view='s5';render()}
 else if(k==='goocr'){S.detour=`第${x.dataset.p}期の OCR`;S.all=false;defaults();S.view='s4sel';render()}
 else if(k==='pdf')toast('PDF を書き出しました（ダミー）')}
$('lbx').onclick=()=>$('lb').classList.remove('on');
$('lb').onclick=e=>{if(e.target.id==='lb')$('lb').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').classList.remove('on')});

// ===== 入口 =====
(function(){const st=Q.get('step');
 if(st==='check'){S.view='s5'}
 else if(st==='preview'){S.view='s6';S.s6=4;S.gen=true}
 else if(S.mode==='doc'){S.view='s6'}
 else{S.view='s4sel';defaults()}
 render()})();
</script>
</body>
</html>
