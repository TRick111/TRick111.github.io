<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>保険営業 AI 活用モック</title>
<style>
:root{--navy:#1f3a5f;--ink:#1d2430;--muted:#66717f;--line:#e3e8ef;--bg:#f6f8fb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:20px 16px}header h1{margin:0;font-size:20px}header p{margin:6px 0 0;font-size:13px;opacity:.85}
main{max-width:960px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.card{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:inherit;transition:box-shadow .15s}
a.card:hover{box-shadow:0 4px 16px rgba(31,58,95,.12)}
.num{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;font-size:12px;padding:2px 10px;margin-bottom:8px}
.card h2{margin:0 0 6px;font-size:16px}.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.soon{opacity:.55;pointer-events:none}.soon .num{background:#9aa5b1}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px}
</style>
</head>
<body>
<header><h1>保険営業 AI 活用モック</h1><p>打合せで出た 3 つの悩みに「AI でこう変わる」を画面で示すサンプルです（すべてダミーデータ）</p></header>
<main>
<div class="grid">
  <a class="card" id="c-kessan" href="kessan/"><span class="num">①</span><h2>決算書 → 自社株評価 → Excel</h2><p>決算書を読み込んで数値を抽出し、自社株評価と必要保障額の目安を出して Excel に落とす</p></a>
  <a class="card" id="c-shiryo" href="shiryo/"><span class="num">②</span><h2>素材 → 顧客向け営業資料</h2><p>ヒアリングメモと提案したい保障から構成案とスライドを作り、PowerPoint に出す</p></a>
  <a class="card" id="c-jirei" href="jirei/"><span class="num">③</span><h2>管理部門の AI 活用事例</h2><p>総務・人事・財務・営業管理の「今の作業／AI でどう変わる／効果」を事例カードで見る</p></a>
</div>
</main>
<footer>追加の画面は順次ここに増えます</footer>
</body>
</html>
