<html lang="ja">
<head>
<meta charset="utf-8">

<title>管理部門 AI 活用事例カタログ（サンプル）</title>
<style>
:root{--navy:#1f3a5f;--navy2:#2d5486;--ink:#1d2430;--sub:#5d6878;--line:#dfe4ea;--bg:#f4f6f9;--card:#fff;--green:#1f7a5a;--greenbg:#e5f4ed;--amber:#b7791f;--amberbg:#fdf3e1;--red:#b4443c;--redbg:#fbeceb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;line-height:1.55}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700}
header .tag{font-size:11px;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:10px}
main{max-width:1280px;margin:0 auto;padding:18px 24px 40px}
.top{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.box h3{margin:0 0 6px;font-size:12px;color:var(--sub);font-weight:600}
.kpi{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.kpi .n{font-size:34px;font-weight:800;color:var(--navy);line-height:1.1}
.kpi .n small{font-size:14px;font-weight:600;margin-left:2px}
.kpi .l{font-size:12px;color:var(--sub)}
.note{font-size:11px;color:var(--sub);margin-top:6px}
.bars .row{display:grid;grid-template-columns:64px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:12px;cursor:pointer}
.bars .track{background:#edf0f4;border-radius:4px;height:14px;overflow:hidden}
.bars .fill{height:100%;background:var(--navy2);border-radius:4px;transition:width .6s}
.bars .row.on .fill{background:var(--green)}
.bars .v{text-align:right;font-weight:700}
.today{background:var(--greenbg);border-color:#bfe3d2}
.today .t{font-size:17px;font-weight:800;color:var(--green);margin:2px 0}
.today button{margin-top:8px}
.tabs{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.tab b{font-size:11px;color:var(--sub);margin-left:4px;font-weight:600}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.on b{color:#cfe0f5}
.wrap{display:grid;grid-template-columns:1fr 440px;gap:16px;align-items:start}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;transition:box-shadow .15s,border-color .15s;min-width:0}
.card:hover{box-shadow:0 2px 10px rgba(31,58,95,.12)}
.card.on{border-color:var(--navy2);box-shadow:0 0 0 2px rgba(45,84,134,.25)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.card .ttl{font-weight:700;font-size:15px}
.card .co{font-size:11px;color:var(--sub)}
.badge{font-size:11px;font-weight:700;color:var(--green);background:var(--greenbg);border:1px solid #bfe3d2;padding:1px 7px;border-radius:10px;white-space:nowrap}
.card dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:3px 8px;font-size:12.5px}
.card dt{color:var(--sub)}
.card dd{margin:0;min-width:0}
.card dd.ai{color:var(--navy);font-weight:600}
.card dd.eff{color:var(--green);font-weight:700}
.detail{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:12px;min-width:0}
.detail h2{margin:0;font-size:17px}
.detail .meta{font-size:12px;color:var(--sub);margin:2px 0 12px}
.sec{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 6px;letter-spacing:.04em}
.flow{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr;align-items:stretch;gap:2px}
.flow .k{border-radius:8px;padding:8px;font-size:12px;min-width:0}
.flow .k b{display:block;font-size:11px;margin-bottom:2px}
.flow .arr{display:flex;align-items:center;justify-content:center;color:#9aa6b5;font-size:14px}
.before .k{background:var(--redbg);color:#6d2b26}
.after .k{background:var(--greenbg);color:#164f3b}
.lbl{font-size:11px;font-weight:700;margin:6px 0 3px}
.lbl.b{color:var(--red)} .lbl.a{color:var(--green)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.cmp .x{font-size:20px;font-weight:800}
.cmp .s{font-size:11px;color:var(--sub)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:8px;margin:5px 0;font-size:13px}
ol.steps li:before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.g{background:var(--green)}
.btn:disabled{opacity:.6;cursor:default}
.demo{margin-top:10px;border:1px dashed #b9c4d2;border-radius:8px;padding:10px;font-size:12.5px;background:#fafbfd;min-height:44px}
.demo .in{color:var(--sub);font-size:11.5px;margin-bottom:6px}
.demo pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #c7d2df;border-top-color:var(--navy);border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
footer{max-width:1280px;margin:0 auto;padding:0 24px 24px;font-size:11px;color:var(--sub)}
@media (max-width:1000px){.top{grid-template-columns:1fr 1fr}.today{grid-column:1/-1}.wrap{grid-template-columns:1fr}.detail{position:static}}
@media (max-width:600px){main{padding:12px}header{padding:12px}.top{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.kpi .n{font-size:28px}.flow{grid-template-columns:1fr;gap:4px}.flow .arr{transform:rotate(90deg);height:14px}.tab{padding:7px 12px;font-size:13px}footer{padding:0 12px 20px}}
</style>
</head>

  s:["週報を共通フォームにする","集計したい数字を 5 つ決める","まず 1 チームで 2 週試す"],
  di:"入力：営業 3 チーム 18 名の週報",dout:"■ 今週の数字（前週比）\n面談 142 件（+12）／提案 38 件（+5）／成約 9 件（±0）\n■ 要点\n・法人向けの問い合わせ増（第 2 チーム）\n・提案→成約の期間が長期化（平均 21 日）"},
 {d:"eigyo",t:"活動量の可視化",co:"損保 B 社",now:"訪問・電話の件数を月末に手で集計",ai:"日々の記録から活動量と成約の関係を自動でグラフ化",h:18,acc:"フォロー漏れ 5 割減",tool:"活動記録＋ダッシュボード",
  b:["月末に記録を集める","件数を手で集計","会議で口頭報告"],a:["日々の記録を自動集計","グラフで見える化","止まっている案件を通知"],
  bx:"月末に判明",ax:"毎日わかる",
  s:["記録する項目を 4 つに絞る","チームリーダーだけ先に見る","週次会議で画面を使う"],
  di:"対象：第 1 チーム 6 名（11 月）",dout:"活動量 上位：営業 A（仮）面談 32 件\n⚠ 14 日以上動きのない案件：7 件\n→ 担当者へフォロー依頼を自動送信"},
 {d:"eigyo",t:"顧客対応記録の要約",co:"信託 C 社",now:"面談メモを清書してシステムに入力",ai:"音声メモから要約と次の対応を自動で記録",h:24,acc:"入力率 95%",tool:"文字起こし＋生成 AI",
  b:["面談後にメモ","帰社して清書","システムに入力"],a:["移動中に音声でメモ","AI が要約・次の対応を作成","確認してワンタップ登録"],
  bx:"20 分/件",ax:"3 分/件",
  s:["要約の型（要望・懸念・次の対応）を決める","5 名で 2 週間試す","登録率を週次で確認"],
  di:"入力：面談後の音声メモ 2 分",dout:"要望：子どもの教育資金を 10 年で準備したい\n懸念：月々の負担額\n次の対応：11/18 までに 2 プランの試算を送付"}
];
C.forEach((c,i)=>c.i=i);
let dept="soumu",sel=0;
const $=id=>document.getElementById(id);
const sum=d=>C.filter(c=>!d||c.d===d).reduce((a,c)=>a+c.h,0);
const total=sum();
// count-up
(function(){let v=0;const step=()=>{v=Math.min(total,v+Math.ceil(total/30));$("kHours").innerHTML=v+"<small>時間/月</small>";if(v<total)requestAnimationFrame(step)};step()})();
const max=Math.max(...DEPTS.map(d=>sum(d.id)));
function renderBars(){
 $("bars").innerHTML=DEPTS.map(d=>`<div class="row ${d.id===dept?"on":""}" data-d="${d.id}"><span>${d.name}</span><div class="track"><div class="fill" style="width:0" data-w="${sum(d.id)/max*100}"></div></div><span class="v">${sum(d.id)}h</span></div>`).join("");
 requestAnimationFrame(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"));
 document.querySelectorAll(".bars .row").forEach(r=>r.onclick=()=>setDept(r.dataset.d));
}
function renderTabs(){
 $("tabs").innerHTML=DEPTS.map(d=>`<button class="tab ${d.id===dept?"on":""}" data-d="${d.id}">${d.name}<b>${C.filter(c=>c.d===d.id).length}件・${sum(d.id)}h</b></button>`).join("");
 document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setDept(t.dataset.d));
}
function renderCards(){
 $("cards").innerHTML=C.filter(c=>c.d===dept).map(c=>`<div class="card ${c.i===sel?"on":""}" data-i="${c.i}">
  <div class="hd"><div><div class="ttl">${c.t}</div><div class="co">${c.co} の型</div></div>${c.today?'<span class="badge">★ 今日から</span>':""}</div>
  <dl><dt>今の作業</dt><dd>${c.now}</dd><dt>AI で</dt><dd class="ai">${c.ai}</dd><dt>効果</dt><dd class="eff">▲${c.h} 時間/月・${c.acc}</dd><dt>使うもの</dt><dd>${c.tool}</dd></dl></div>`).join("");
 document.querySelectorAll(".card").forEach(el=>el.onclick=()=>{sel=+el.dataset.i;renderCards();renderDetail();if(innerWidth<1000)$("detail").scrollIntoView({behavior:"smooth"})});
}
const flow=(arr,cls)=>`<div class="flow ${cls}">${arr.map((x,j)=>`<div class="k"><b>${j+1}</b>${x}</div>`).join('<div class="arr">▶</div>')}</div>`;
function renderDetail(){
 const c=C[sel];
 $("detail").innerHTML=`<h2>${c.t}${c.today?' <span class="badge">★ 今日から</span>':""}</h2>
 <div class="meta">${c.co} の型 ／ ${DEPTS.find(d=>d.id===c.d).name} ／ 使うもの：${c.tool}</div>
 <div class="sec">BEFORE → AFTER</div>
 <div class="lbl b">今</div>${flow(c.b,"before")}
 <div class="lbl a">AI 導入後</div>${flow(c.a,"after")}
 <div class="cmp"><div><div class="s">今</div><div class="x" style="color:var(--red)">${c.bx}</div></div><div><div class="s">AI 導入後</div><div class="x" style="color:var(--green)">${c.ax}</div></div></div>
 <div class="cmp"><div><div class="s">削減時間</div><div class="x" style="color:var(--navy)">▲${c.h}h<span style="font-size:12px">/月</span></div></div><div><div class="s">精度・品質</div><div class="x" style="color:var(--navy);font-size:16px;padding-top:4px">${c.acc}</div></div></div>
 <div class="sec">始め方 3 ステップ</div>
 <ol class="steps">${c.s.map(x=>`<li>${x}</li>`).join("")}</ol>
 <div class="sec">AI の出力を見てみる（ダミー）</div>
 <button class="btn" id="run">▶ AI で実行してみる</button>
 <div class="demo" id="demo"><div class="in">${c.di}</div><span style="color:var(--sub)">ボタンを押すと結果が出ます</span></div>`;
 $("run").onclick=()=>{
  const b=$("run");b.disabled=true;
  $("demo").innerHTML=`<div class="in">${c.di}</div><span class="spin"></span>AI が処理中…`;
  setTimeout(()=>{$("demo").innerHTML=`<div class="in">${c.di}</div><pre>${c.dout}</pre><div class="note">処理時間 1.2 秒（ダミー）</div>`;b.disabled=false;b.textContent="▶ もう一度実行"},1100);
 };
}
function setDept(d){dept=d;sel=C.find(c=>c.d===d).i;renderTabs();renderBars();renderCards();renderDetail()}
const T=C[0];
$("tTitle").textContent="★ "+T.t;
$("tDesc").innerHTML=`録音するだけ。<b>1 会議 60 分 → 10 分</b>、部門で <b>▲${T.h} 時間/月</b>`;
$("tBtn").onclick=()=>{setDept("soumu");sel=0;renderCards();renderDetail();$("run").click();$("detail").scrollIntoView({behavior:"smooth",block:"nearest"})};
setDept("soumu");
</script>
</body>
</html>
