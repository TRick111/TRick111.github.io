<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Achieve English Gym 管理画面 — 画面モック（v6・2026-09-20）</title>
<style>
:root{
  /* v4 テーマ: 既存サイト（レモンイエロー＋黒の極太ゴシック）に合わせる */
  --brand:#FBF36A; --brand-deep:#F5C400; --brand-soft:#FDEFC9;
  --bg:#FFFBEA; --card:#FFFFFF; --ink:#222222; --text:#222222; --muted:#6B6B6B;
  --border:#EADFB0; --line:#E7E0C8;
  --pink:#F78DA7; --pink-soft:#FFE0E8; --pink-ink:#B03A5B;
  --orange:#FF6A00; --orange-soft:#FFE8D2; --orange-ink:#A34500;
  --danger:#CF2D2D; --danger-soft:#FBC9C9; --danger-ink:#A81F1F;
  --success:#3C8A2E; --success-soft:#E9FBC4; --success-ink:#2E6B22;
  --sky:#5B8DD6; --sky-soft:#BCD5F3; --sky-ink:#2E5FA3;
  --purple:#9B51E0; --purple-soft:#F0E2FB; --purple-ink:#6A2FA0;
  --type-online:#5B8DD6; --type-onsite:#3C8A2E; --type-private:#9B51E0;
  --link:#0B5CD5; --radius:14px; --slot-h:32px;
  /* ===== v6 S-05-3 級カラー（8区分）。student.html と同じ ===== */
  --lv-5:#3F8FC4;   --lv-5-soft:#DCEEF8;
  --lv-4:#3C8A2E;   --lv-4-soft:#E3F4DA;
  --lv-3:#D98A1F;   --lv-3-soft:#FBEDD4;
  --lv-j2:#E0562B;  --lv-j2-soft:#FBE1D7;
  --lv-j2p:#BE3A73; --lv-j2p-soft:#FADBE8;
  --lv-2:#7647BE;   --lv-2-soft:#EADFF8;
  --lv-p1:#2B569B;  --lv-p1-soft:#DBE5F6;
  --lv-ot:#6F6F6F;  --lv-ot-soft:#E7E7E7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%;
}
img{max-width:100%}
h1,h2,h3,h4{margin:0 0 8px; line-height:1.35; word-break:break-word; color:var(--ink)}
h1{font-size:20px; font-weight:900; letter-spacing:-.01em} h2{font-size:18px; font-weight:800}
h3{font-size:15px; font-weight:800} h4{font-size:14px; font-weight:800}
p{margin:0 0 8px; word-break:break-word}
a{color:var(--link)}
button{font-family:inherit; font-size:14px}
input,select,textarea{
  font-family:inherit; font-size:14px; width:100%; max-width:100%;
  padding:10px 12px; border:1px solid var(--border); border-radius:10px;
  background:#fff; color:var(--text); min-height:44px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-deep); outline-offset:1px}
textarea{min-height:96px; resize:vertical}
label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:700}
.field{margin-bottom:12px; min-width:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:44px; padding:9px 16px; border-radius:999px; border:2px solid var(--ink);
  background:#fff; color:var(--ink); cursor:pointer; font-weight:800; text-align:center;
  word-break:break-word;
}
.btn:hover{background:var(--brand-soft)}
.btn-primary{background:var(--brand); border-color:var(--ink); color:var(--ink); font-weight:900}
.btn-primary:hover,.btn-primary:active{background:var(--brand-deep)}
.btn-accent{background:var(--orange); border-color:var(--ink); color:#fff}
.btn-accent:hover{filter:brightness(.94)}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff}
.btn-danger:hover{background:#A81F1F; border-color:#A81F1F}
/* 一覧の行内など小さい危険ボタンは枠線タイプ（赤の面が並びすぎないように） */
.btn-danger.btn-sm{background:#fff; border-color:var(--danger); color:var(--danger)}
.btn-danger.btn-sm:hover{background:var(--danger-soft); border-color:var(--danger); color:var(--danger-ink)}
.btn-sm{min-height:34px; padding:5px 12px; font-size:12.5px; border-width:1.5px}
.btn-block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-row{display:flex; flex-wrap:wrap; gap:8px}

/* ---------- layout ---------- */
.app{display:none}
.app.on{display:block}
.topbar{
  position:sticky; top:0; z-index:30; background:var(--brand); border-bottom:3px solid var(--brand-deep);
  display:flex; align-items:center; gap:10px; padding:10px 14px; min-width:0;
}
.topbar .brand{font-weight:900; font-size:16px; letter-spacing:-.02em; color:var(--ink); min-width:0; word-break:break-word; line-height:1.2}
.topbar .brand small{display:block; font-weight:700; font-size:11px; letter-spacing:0; color:var(--ink); opacity:.72}
.topbar .spacer{flex:1 1 auto; min-width:0}
.who{display:flex; align-items:center; gap:8px; flex-shrink:0}
.who .chip{background:#fff; color:var(--ink); border:1.5px solid var(--ink); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:800; white-space:nowrap}
.mock-note{background:var(--brand-soft); color:var(--ink); border-bottom:1px solid var(--border); padding:6px 14px; font-size:12px}
.layout{display:flex; align-items:flex-start; gap:16px; padding:16px; min-width:0}
.sidebar{width:220px; flex:0 0 220px; background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:10px; position:sticky; top:70px}
.sidebar .navtitle{font-size:11px; color:var(--muted); font-weight:800; padding:6px 8px}
.navbtn{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:0; background:transparent;
  padding:11px 10px; border-radius:10px; cursor:pointer; color:var(--ink); font-weight:700; min-height:44px;
}
.navbtn:hover{background:var(--brand-soft)}
.navbtn.active{background:var(--brand-soft); color:var(--ink); font-weight:900; box-shadow:inset 3px 0 0 var(--brand-deep)}
.main{flex:1 1 auto; min-width:0; max-width:100%}
.hamburger{display:none}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; min-width:0}
.card h3{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.grid{display:grid; gap:14px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.screen{display:none}
.screen.on{display:block}
.screen-head{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.screen-head .sub{color:var(--muted); font-size:12.5px}

/* ---------- badges / chips ---------- */
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:800; white-space:nowrap}
.b-regular{background:var(--sky-soft); color:var(--sky-ink)}
.b-oneoff{background:var(--success-soft); color:var(--success-ink)}
.b-mono{background:var(--purple-soft); color:var(--purple-ink)}
.b-warn{background:var(--orange-soft); color:var(--orange-ink)}
.b-wait{background:var(--pink-soft); color:var(--pink-ink)}
.b-danger{background:var(--danger-soft); color:var(--danger-ink)}
.b-ok{background:var(--success-soft); color:var(--success-ink)}
.b-muted{background:#EEEEEE; color:#666666}
.b-closed{background:#EEEEEE; color:#777777}
.b-brand{background:var(--brand); color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.strong{font-weight:800}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; border:1px solid var(--border); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; white-space:nowrap}
th{background:var(--brand-soft); color:var(--ink); font-size:11.5px; font-weight:800; position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#FFFCEC}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--link)}
td.wrap,th.wrap{white-space:normal; min-width:140px}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.tile{background:var(--brand-soft); border:1px solid var(--border); border-radius:10px; padding:10px}
.tile .n{font-size:28px; font-weight:900; line-height:1.15; font-variant-numeric:tabular-nums; color:var(--ink)}
.tile .l{font-size:11.5px; color:var(--muted); font-weight:800}
.tile.warn .n{color:var(--orange-ink)} .tile.danger .n{color:var(--danger)} .tile.ok .n{color:var(--success-ink)}

/* ---------- list rows ---------- */
.rowitem{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 0; border-bottom:1px dashed var(--border); min-width:0}
.rowitem:last-child{border-bottom:0}
.rowitem .grow{flex:1 1 160px; min-width:0; word-break:break-word}

/* ---------- calendar (共通) ---------- */
.calbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:#fff}
.seg button{border:0; background:#fff; padding:9px 14px; min-height:44px; cursor:pointer; font-weight:800; color:#555}
.seg button.active{background:var(--brand); color:var(--ink); font-weight:900}
.seg button:hover{background:var(--brand-soft)}
.cal-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}
.week{display:grid; grid-template-columns:repeat(7,minmax(132px,1fr)); gap:8px; min-width:0}
.daycol{background:#fff; border:1px solid var(--border); border-radius:10px; padding:8px; min-width:0}
.daycol.today{border-color:var(--brand-deep); box-shadow:0 0 0 2px var(--brand) inset}
.dayhead{font-size:12px; font-weight:800; margin-bottom:6px; color:var(--muted); word-break:break-word}
.dayhead .dnum{font-size:15px; color:var(--ink)}
.lesson-card{
  display:block; width:100%; text-align:left; border:1px solid var(--border); border-radius:9px;
  background:#fff; padding:8px; margin-bottom:7px; cursor:pointer; min-width:0; border-left:4px solid #C9C9C9;
}
.lesson-card:hover{background:#FFFCEC}
.lc-time{font-size:11.5px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums}
.lc-name{font-weight:800; font-size:13px; word-break:break-word; color:var(--ink)}
.lc-meta{font-size:11.5px; color:var(--muted); word-break:break-word}
.lc-open{background:var(--success-soft); border-left-color:var(--success)}
.lc-partial{background:var(--sky-soft); border-left-color:var(--sky)}
.lc-full{background:#EEEEEE; border-left-color:#9A9A9A}
.lc-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; min-width:0}
.closed-chip{background:var(--danger-soft); border:1px dashed var(--danger); border-radius:8px; padding:8px; text-align:center; color:var(--danger-ink); font-size:12px; font-weight:800}
.capbar{height:4px; border-radius:999px; background:#fff; border:1px solid var(--border); margin-top:6px; overflow:hidden}
.capbar i{display:block; height:100%; border-radius:999px; background:var(--sky)}
.capbar.full i{background:#9A9A9A}
.callegend{display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; font-size:11.5px; font-weight:800; color:var(--muted); min-width:0}
.callegend em{display:inline-flex; align-items:center; gap:5px; font-style:normal; white-space:nowrap}
.lgd{display:inline-block; width:11px; height:11px; border-radius:3px; flex:0 0 auto}
.lgd.free{background:var(--success-soft); border:1px solid var(--success)}
.lgd.part{background:var(--sky-soft); border:1px solid var(--sky)}
.lgd.full{background:#EEEEEE; border:1px solid #9A9A9A}
.lgd.empty{background:#fff; border:1px dashed var(--border)}
.daysum{
  display:flex; align-items:center; gap:5px; flex-wrap:wrap; font-size:11.5px; font-weight:800;
  background:var(--brand-soft); border:1px solid var(--border); border-radius:7px; padding:3px 7px; margin-bottom:6px; min-width:0;
}
.daysum .b{color:var(--sky-ink)} .daysum .f{color:var(--success-ink)} .daysum .f.zero{color:var(--muted)}
.daysum .sep{color:#C9BE95; font-weight:700}
.month{display:grid; grid-template-columns:repeat(7,minmax(44px,1fr)); gap:5px}
.mcell{background:#fff; border:1px solid var(--border); border-radius:8px; padding:6px 4px; min-height:62px; cursor:pointer; font-size:11.5px; min-width:0; overflow:hidden}
.mcell:hover{border-color:var(--brand-deep); background:#FFFCEC}
.mcell.out{opacity:.4}
.mcell.today{border-color:var(--brand-deep); background:var(--brand-soft)}
.mcell .d{font-weight:900; color:var(--ink)}
.mdot{display:inline-block; width:6px; height:6px; border-radius:50%; margin:1px 1px 0 0}
.mc-line{display:block; font-size:10.5px; font-weight:800; line-height:1.4; white-space:nowrap; font-variant-numeric:tabular-nums}
.mc-b{color:var(--sky-ink)} .mc-b.zero{color:#A8A08A}
.mc-f{color:var(--success-ink)} .mc-f.zero{color:#A8A08A}
.ltiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin-bottom:12px}
.ltiles .tile{padding:8px 6px; text-align:center}
.ltiles .tile .n{font-size:22px}
.ltiles .tile .l{font-size:11px}

/* ---------- v4: 時間帯グリッド（週・日） ---------- */
.weeksum{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px;
  background:var(--brand); border:2px solid var(--ink); border-radius:999px; padding:5px 12px;
  font-size:12.5px; font-weight:800; color:var(--ink); min-width:0;
}
.weeksum b{font-size:16px; font-weight:900; font-variant-numeric:tabular-nums}
.weeksum .sep{opacity:.45}
.weeksum .helpbtn{width:26px; height:26px; font-size:12px; margin-left:2px; border-color:var(--ink); background:#fff}
.tg-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; background:var(--card); border:1px solid var(--border); border-radius:var(--radius)}
.tg{display:grid; grid-template-columns:52px repeat(var(--n,7),minmax(128px,1fr)); min-width:0}
.tg-corner{position:sticky; left:0; z-index:5; background:var(--brand-soft); border-right:1px solid var(--border); border-bottom:2px solid var(--border)}
.tg-head{
  background:var(--brand-soft); border-bottom:2px solid var(--border); border-left:1px solid var(--line);
  padding:6px 7px 5px; min-width:0;
}
.tg-head.today{background:var(--brand); box-shadow:inset 0 -3px 0 var(--brand-deep)}
.tg-head .d{font-size:12.5px; font-weight:900; color:var(--ink); white-space:nowrap}
.tg-head .daysum{margin-bottom:0; margin-top:4px; background:#fff}
.tg-axis{position:sticky; left:0; z-index:4; background:var(--card); border-right:1px solid var(--border)}
.tg-hour{height:calc(var(--slot-h)*2); border-bottom:1px solid var(--line); font-size:10.5px; font-weight:800; color:var(--muted); text-align:right; padding:1px 6px 0 0; font-variant-numeric:tabular-nums}
.tg-col{position:relative; border-left:1px solid var(--line); min-width:0}
.tg-slot{height:var(--slot-h); border-bottom:1px dashed #F1E9CE; position:relative; cursor:pointer}
.tg-slot.hr{border-bottom:1px solid var(--line)}
.tg-slot:hover{background:#FFF8D9}
.tg-blocks{position:absolute; inset:0; pointer-events:none}
.tg-block{
  position:absolute; pointer-events:auto; display:block; text-align:left; font:inherit; color:var(--ink);
  background:#fff; border:1px solid var(--border); border-left:4px solid #C9C9C9; border-radius:8px;
  padding:1px 6px; overflow:hidden; cursor:pointer; min-width:0;
}
.tg-block:hover{box-shadow:0 0 0 2px var(--brand-deep)}
.tgb-open{background:var(--success-soft); border-left-color:var(--success)}
.tgb-partial{background:var(--sky-soft); border-left-color:var(--sky)}
.tgb-full{background:#EEEEEE; border-left-color:#9A9A9A}
.tgb-closed{background:var(--danger-soft); border-left-color:var(--danger); text-decoration:line-through; color:var(--danger-ink)}
.tgb-dim{opacity:.25}
.tgb-t{font-size:10.5px; line-height:1.3; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tgb-n{font-size:12px; line-height:1.3; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tgb-c{display:flex; gap:3px; flex-wrap:wrap; margin-top:1px; overflow:hidden}
.tgb-c .badge{font-size:10.5px; line-height:1.25; padding:1px 6px}
.tgb-row{display:flex; align-items:center; gap:7px; overflow:hidden; white-space:nowrap; line-height:1.5}
.tgb-row .tgb-c{margin-top:0; flex-wrap:nowrap; flex:0 0 auto}
.tgb-row .tgb-n{flex:0 1 auto}
.tgb-row .tgb-t{flex:0 0 auto}
.tg-block.sm{padding:1px 6px}
.tg-names{font-size:11px; color:#3B3B3B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
@media (min-width:901px){
  .tg-slot:hover::after{
    content:'＋'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#8A6A00; font-weight:900; font-size:16px; line-height:1;
  }
}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:12px}
.tabs button{
  border:2px solid var(--ink); background:#fff; border-radius:999px; padding:8px 14px;
  min-height:42px; cursor:pointer; font-weight:800; white-space:nowrap; color:var(--ink);
}
.tabs button.active{background:var(--brand); color:var(--ink); font-weight:900}

/* ---------- login ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.login-card{background:#fff; border:2px solid var(--ink); border-radius:var(--radius); padding:22px; width:100%; max-width:400px}
.login-hero{background:var(--brand); border:2px solid var(--ink); border-radius:10px; padding:12px 10px; text-align:center; margin-bottom:16px}
.login-hero h1{font-weight:900; letter-spacing:-.02em; margin-bottom:2px}
.login-logo{font-size:26px}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(34,34,34,.5); display:none; z-index:60;
  align-items:flex-end; justify-content:center; padding:0;
}
.overlay.on{display:flex}
.modal{
  background:#fff; border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:640px; max-height:92vh;
  overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px;
}
.modal-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px}
.modal-head h3{flex:1 1 auto; min-width:0}
.xbtn{border:1.5px solid var(--ink); background:#fff; border-radius:999px; width:36px; height:36px; cursor:pointer; font-size:16px; flex:0 0 auto}
.modal-foot{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
@media (min-width:640px){
  .overlay{align-items:center; padding:20px}
  .modal{border-radius:var(--radius)}
}

/* ---------- toast ---------- */
.toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:90; width:calc(100% - 32px); max-width:420px; pointer-events:none}
.toast{
  background:#2B2B2B; color:#fff; border-radius:10px; padding:11px 14px; margin-top:8px;
  font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.2); word-break:break-word;
}
.toast.ok{background:#2E6B22} .toast.warn{background:#A34500} .toast.err{background:#A81F1F}

.note{background:var(--brand-soft); border:1px solid var(--border); border-left:3px solid var(--brand-deep); border-radius:8px; padding:9px 11px; font-size:12.5px; color:var(--ink); margin:10px 0}
.note.warn{border-left-color:var(--orange); background:var(--orange-soft); color:var(--orange-ink)}
.divider{height:1px; background:var(--border); margin:12px 0}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:7px 18px}
.kv > div{min-width:0; display:grid; grid-template-columns:92px minmax(0,1fr); gap:8px; align-items:baseline; border-bottom:1px dashed var(--border); padding-bottom:5px}
.kv .k{font-size:11.5px; color:var(--muted); font-weight:800}
.kv .v{font-size:13.5px; word-break:break-word; font-weight:700}
.ticket-big{font-size:40px; font-weight:900; line-height:1; color:var(--ink)}
.filters{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:12px}

/* ---------- help / punch card / chips / rows ---------- */
.helpbtn{
  width:32px; height:32px; border-radius:50%; border:1.5px solid var(--ink); background:#fff;
  color:var(--ink); font-weight:900; font-size:14px; cursor:pointer; flex:0 0 auto; line-height:1;
}
.helpbtn:hover{background:var(--brand)}
.helplist{margin:0; padding-left:20px}

/* 詳細データを持たない生徒に、チケット履歴・受講履歴・今後の予約を自動生成 */
/* v5: 自動生成の基準日は「最終受講日」。lastAttended を過去にずらしても履歴と矛盾しない */
function seedBase(st){ return /^\d{4}-\d{2}-\d{2}$/.test(st.lastAttended) ? st.lastAttended : '2026-08-28'; }
(function seedStudents(){
  state.students.forEach(function(st){
    if (st.ticketHistory.length === 0) {
      var hist = [];
      var bal = 0, need = 0, d;
      var adds = Math.max(1, Math.ceil((st.tickets + st.stats.total + st.stats.absent + st.stats.lateCancel) / 10));
      for (var a = 0; a < adds; a++) {
        hist.push({ date: addDaysStr('2026-05-01', a * 45), delta: 10, reason: '入金確認（' + (a % 2 === 0 ? 'バーツ振込' : '日本円振込') + '）' });
        bal += 10;
      }
      need = bal - st.tickets;
      d = seedBase(st);
      for (var i = 0; i < need; i++) {
        hist.push({ date: addDaysStr(d, -7 * i), delta: -1, reason: (i === 0 && st.stats.absent > 0) ? '欠席' : '定期レッスン受講' });
      }
      hist.sort(function(a2, b2){ return a2.date < b2.date ? -1 : 1; });
      st.ticketHistory = hist;
    }
    if (st.past.length === 0) {
      var past = [], base = seedBase(st), k = 0, n = Math.min(st.stats.total, 8);
      for (var j = 0; j < n; j++) { past.push({ date: addDaysStr(base, -7 * k++), title: className(st.classId), type:'regular', status:'attended', comment:'', score:'' }); }
      if (st.stats.absent > 0) past.push({ date: addDaysStr(base, -7 * k++), title: className(st.classId), type:'regular', status:'absent', comment:'', score:'' });
      if (st.stats.lateCancel > 0) past.push({ date: addDaysStr(base, -7 * k++), title: className(st.classId), type:'regular', status:'cancel_over', at: addDaysStr(base, -7 * (k-1)) + ' 09:30', comment:'', score:'' });
      past.sort(function(a3, b3){ return a3.date < b3.date ? 1 : -1; });
      st.past = past;
    }
    if (st.upcoming.length === 0 && st.active) {
      var up = [], cls = recurringById(st.classId), cnt = 0;
      for (var dd = 1; dd <= 28 && cnt < 3; dd++) {
        var ds = addDaysStr(TODAY, dd);
        if (cls && dowOf(ds) === cls.dow && !isClosed(ds)) {
          up.push({ uid: st.id + '-r' + dd, date: ds, start: cls.start, title: cls.name + '（オンライン）', type:'regular', ref:null });
          cnt++;
        }
      }
      state.oneoff.forEach(function(o){
        if (o.book.indexOf(st.id) >= 0) up.push({ uid: st.id + '-' + o.id, date:o.date, start:o.start, title:'対面クラス', type:'oneoff', ref:o.id });
      });
      state.mono.forEach(function(m){
        if (m.sid === st.id) up.push({ uid: st.id + '-' + m.id, date:m.date, start:m.start, title:'マンツーマン' + (m.kind ? ' ' + kindLabel(m.kind) : ''), type:'mono', ref:m.id });
      });
      up.sort(function(a4, b4){ return (a4.date + a4.start) < (b4.date + b4.start) ? -1 : 1; });
      st.upcoming = up;
    }
  });
})();

/* =========================================================

function $(sel, root){ return (root || document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function parseD(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtD(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDaysStr(s, n){ var d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function dowOf(s){ return parseD(s).getDay(); }
var DOW_JA = ['日','月','火','水','木','金','土'];
function jaDate(s){ var d = parseD(s); return (d.getMonth()+1) + '/' + d.getDate() + '（' + DOW_JA[d.getDay()] + '）'; }
function jaFull(s){ var d = parseD(s); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + '（' + DOW_JA[d.getDay()] + '）'; }
function studentById(id){ for (var i=0;i<state.students.length;i++) if (state.students[i].id === id) return state.students[i]; return null; }
function nameOf(id){ var s = studentById(id); return s ? s.name : '(不明)'; }
function recurringById(id){ for (var i=0;i<state.recurring.length;i++) if (state.recurring[i].id === id) return state.recurring[i]; return null; }
function className(id){ var r = recurringById(id); return r ? r.name : '—'; }
function isClosed(ds){ for (var i=0;i<state.closedDays.length;i++) if (state.closedDays[i].date === ds) return state.closedDays[i]; return null; }
function kindLabel(k){ return k === 'W' ? 'ライティング' : 'スピーキング'; }
/* A-11-1: 種別ラベルは「オンライン」「対面」「マンツーマン」 */
function typeLabel(t){ return t === 'regular' ? 'オンライン' : (t === 'oneoff' ? '対面' : 'マンツーマン'); }
/* v2: 種別は固定アイコンで統一（💻 オンライン / 🏫 対面 / 👤 マンツーマン） */
function typeIcon(t){ return t === 'regular' ? '💻' : (t === 'oneoff' ? '🏫' : (t === 'mono' ? '👤' : '🚫')); }
function typeShort(t){ return t === 'regular' ? 'オンライン' : (t === 'oneoff' ? '対面' : 'マンツーマン'); }
function typeBadge(t){
  return '<span class="badge ' + (t === 'regular' ? 'b-regular' : t === 'oneoff' ? 'b-oneoff' : 'b-mono') + '">' + typeIcon(t) + ' ' + typeShort(t) + '</span>';
}
/* 状態チップ */
function chip(cls, text){ return '<span class="badge ' + cls + '">' + text + '</span>'; }
function seatChip(book, cap){
  var free = cap - book;
  return free > 0 ? chip('b-ok', '空き ' + free) : chip('b-muted', '満席');
}

/* ---------------- 10回券パンチカード ---------------- */
function ticketState(n){ return n <= 1 ? 'danger' : (n <= 3 ? 'warn' : 'ok'); }
function punchHtml(st){
  var n = st.tickets, planned = plannedCost(st);
  var usable = Math.max(0, n - planned);
  var stt = ticketState(n), dots = '';
  for (var i = 0; i < 10; i++) {
    var cls = i < Math.min(usable, 10) ? 'fill' : (i < Math.min(n, 10) ? 'plan' : 'empty');
    dots += '<span class="p ' + cls + '"></span>';
  }
  return '<div class="punch ' + stt + '" title="残 ' + n + ' 回（使える ' + usable + ' / 予約済み ' + Math.min(planned, n) + '）">' + dots + '</div>';
}
function punchCard(st){
  var n = st.tickets, planned = plannedCost(st), usable = Math.max(0, n - planned), stt = ticketState(n);
  return '<div class="punch-wrap">' +
    '<div><div class="punch-n ' + stt + '">' + n + (n > 10 ? '<span class="plusbadge">+' + (n - 10) + '</span>' : '') + '</div>' +
    '<div class="punch-l">🎟 残り</div></div>' +
    '<div class="punch-col">' + punchHtml(st) +
      '<div class="tiny muted" style="margin-top:6px">使える ' + usable + ' ・ 予約済み ' + planned + '</div>' +
    '</div>' +
    (st.notice ? '<div>' + chip('b-danger', '🔔 振込案内中') + '</div>' : '') +
    '</div>';
}
function miniPunch(st){
  var n = st.tickets, planned = plannedCost(st), usable = Math.max(0, n - planned);
  var stt = ticketState(n), dots = '';
  for (var i = 0; i < 10; i++) {
    var c = i < Math.min(usable, 10) ? 'on' : (i < Math.min(n, 10) ? 'pl' : '');
    dots += '<i class="' + c + '"></i>';
  }
  return '<span class="mpunch ' + stt + '" title="残 ' + n + ' 回">' + dots + '</span>' +
    '<span class="mnum ' + stt + '">' + n + '</span>' + (n > 10 ? '<span class="plusbadge">+' + (n - 10) + '</span>' : '');
}

function cost(t){ return state.settings[t].ticketCost; }
/* 予約時点ではチケットを消費しない。今後の予約分の「消費予定」を集計する */
function plannedCost(st){
  var sum = 0;
  st.upcoming.forEach(function(u){ sum += cost(u.type); });
  return sum;
}
function availableTickets(st){ return st.tickets - plannedCost(st); }

/* キャンセル期限 */
function deadlineOf(dateStr, type){
  var s = state.settings[type];
  var d = parseD(dateStr);
  d.setDate(d.getDate() - s.deadlineDays);
  var hm = s.deadlineTime.split(':');
  var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hm[0], +hm[1]);
  return { dt: dt, text: fmtD(d) + ' ' + s.deadlineTime };
}
function isOverdue(dateStr, type){ return NOW.getTime() > deadlineOf(dateStr, type).dt.getTime(); }

/* トースト */
function toast(msg, kind){
  var box = $('#toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
}

var modalActions = {};

  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  var foot = $('#modalFoot');

  (actions || []).forEach(function(a, i){

    b.setAttribute('data-act', 'a' + i);

/* =========================================================
   レッスンインスタンス
   ========================================================= */
function lessonsOn(ds){
  var out = [];
  var cd = isClosed(ds);
  state.recurring.forEach(function(r){
    if (dowOf(ds) !== r.dow) return;
    if (cd) { out.push({ key:'closed|' + r.id + '|' + ds, type:'closed', title:r.name, date:ds, start:r.start, end:r.end, reason:cd.reason }); return; }
    out.push({ key:'reg|' + r.id + '|' + ds, type:'regular', rid:r.id, title:r.name, date:ds, start:r.start, end:r.end, url:r.url, book:regBook(r.id, ds) });
  });
  state.oneoff.forEach(function(o){
    if (o.date !== ds) return;
    out.push({ key:'one|' + o.id, type:'oneoff', oid:o.id, title:'対面クラス', date:ds, start:o.start, end:o.end,
      place:o.place, cap:o.cap, note:o.note, book:o.book, wait:o.wait,
      openAt:o.openAt || null, eligibleOnly: !!o.eligibleOnly });
  });
  state.mono.forEach(function(m){
    if (m.date !== ds) return;
    /* A-06-1 / A-13-3: 枠の見出しに種別は出さない。予約が入っていればその種別を添える */
    out.push({ key:'mono|' + m.id, type:'mono', mid:m.id, title:'マンツーマン', kind:m.kind || null,
      date:ds, start:m.start, end:m.end, url:m.url, mid2:m.mid, pw:m.pw,
      book: m.sid ? [m.sid] : [], openAt:m.openAt || null, eligibleOnly: !!m.eligibleOnly });
  });
  out.sort(function(a, b){ return a.start < b.start ? -1 : 1; });
  return out;
}
function regBook(rid, ds){
  var k = rid + '|' + ds;
  if (!state.regBook[k]) state.regBook[k] = (state.defaultRoster[rid] || []).slice();
  return state.regBook[k];
}
function getLesson(key){
  var p = key.split('|');
  if (p[0] === 'reg') { var arr = lessonsOn(p[2]); for (var i=0;i<arr.length;i++) if (arr[i].key === key) return arr[i]; return null; }
  if (p[0] === 'one') { var o = null; state.oneoff.forEach(function(x){ if (x.id === p[1]) o = x; }); if (!o) return null; var l = lessonsOn(o.date); for (var j=0;j<l.length;j++) if (l[j].key === key) return l[j]; return null; }
  if (p[0] === 'mono') { var m = null; state.mono.forEach(function(x){ if (x.id === p[1]) m = x; }); if (!m) return null; var l2 = lessonsOn(m.date); for (var k2=0;k2<l2.length;k2++) if (l2[k2].key === key) return l2[k2]; return null; }
  return null;
}

/* チケット操作 */
function addTicketHistory(st, delta, reason, dateStr){
  st.ticketHistory.push({ date: dateStr || TODAY, delta: delta, reason: reason });
  st.tickets += delta;
  if (st.tickets > 1) st.notice = false;
  if (st.tickets <= 1) st.notice = true;
}

/* =========================================================
   ダッシュボード
   ========================================================= */
/* A-01-2: 今後1週間は「今日起点」ではなく「月曜起点」。◀▶ で週単位に動かす */
function mondayOf(ds){ var d = parseD(ds); return addDaysStr(ds, -((d.getDay() + 6) % 7)); }
var dashWeekStart = null;
function shiftDashWeek(n){ dashWeekStart = addDaysStr(dashWeekStart || mondayOf(TODAY), n * 7); renderDashboard(); }
function renderDashboard(){
  /* ---- 1週間（月曜〜日曜）の予定 ---- */
  var WEEK_DAYS = 7;
  if (!dashWeekStart) dashWeekStart = mondayOf(TODAY);
  var weekStartD = dashWeekStart;
  var weekEnd = addDaysStr(weekStartD, WEEK_DAYS - 1);
  var weekRange = jaDate(weekStartD) + '〜' + jaDate(weekEnd);
  var openCount = 0;
  /* v5.2: 日付を横に7列並べ、その下にその日の予定を縦へ詰める */
  var weekCols = '';
  for (var wd = 0; wd < WEEK_DAYS; wd++) {
    var ds = addDaysStr(weekStartD, wd);
    var dayLessons = lessonsOn(ds);
    openCount += dayLessons.filter(function(l){ return l.type !== 'closed'; }).length;
    var cdd = isClosed(ds);
    var items = dayLessons.map(function(l){
      if (l.type === 'closed') {
        return '<div class="item no-click" title="' + esc(l.start + ' ' + l.title) + '">' +
          '<div class="l1"><span class="t">' + l.start + '</span>' +
          '<span class="ic">' + typeIcon(l.type) + '</span>' +
          '<span class="nm">' + esc(l.title) + '</span></div>' +
          '<div class="l2">' + chip('b-closed', '🚫 休校') + '</div></div>';
      }
      var c = l.type === 'oneoff' ? seatChip(l.book.length, l.cap)
            : (l.type === 'mono' ? (l.book.length ? chip('b-mono', '✅ 予約済み') : chip('b-ok', '空き 1'))
            : chip('b-regular', '予約 ' + l.book.length));
      return '<div class="item" data-open-lesson="' + l.key + '" title="' + esc(l.start + ' ' + l.title) + '">' +
        '<div class="l1"><span class="t">' + l.start + '</span>' +
        '<span class="ic">' + typeIcon(l.type) + '</span>' +
        '<span class="nm">' + esc(l.title) + '</span></div>' +
        '<div class="l2">' + c + '</div></div>';
    }).join('') || '<div class="none">予定なし</div>';
    weekCols += '<div class="day' + (ds === TODAY ? ' is-today' : '') + (cdd ? ' is-closed' : '') + '">' +
      '<div class="dh">' + jaDate(ds) +
      (ds === TODAY ? ' ' + chip('b-brand', '今日') : '') +
      (cdd ? ' ' + chip('b-closed', '休校') : '') + '</div>' +
      items + '</div>';
  }
  var weekHtml = '<div class="wk7">' + weekCols + '</div>';

  /* チケット残り1回以下 */
  var low = state.students.filter(function(s){ return s.active && s.tickets <= 1; });
  var lowChips = low.map(function(s){
    return '<span class="pchip" data-goto-student="' + s.id + '">' + esc(s.name) + ' ' +
      '<span class="mnum ' + ticketState(s.tickets) + '">' + s.tickets + '</span>' +
      '<button class="miniadd" data-quick-add="' + s.id + '">＋10</button></span>';
  }).join('') || '<span class="muted small">なし</span>';

  /* キャンセル待ち */
  var waitLessons = state.oneoff.filter(function(o){ return o.wait.length > 0; });
  var waitTotal = waitLessons.reduce(function(a, o){ return a + o.wait.length; }, 0);
  var waitChips = waitLessons.map(function(o){
    return '<span class="pchip" data-open-lesson="one|' + o.id + '">🏫 ' + jaDate(o.date) + ' ' + o.start + ' ' +
      '<span class="mnum warn">' + o.wait.length + '</span></span>';
  }).join('') || '<span class="muted small">なし</span>';

  /* ---- 最近来ていない生徒（最終受講日から21日以上） ---- */
  var STALE_DAYS = 21, STALE_MAX = 8;
  var stale = state.students.map(function(s){
    var has = /^\d{4}-\d{2}-\d{2}$/.test(s.lastAttended);
    var days = has ? Math.round((parseD(TODAY) - parseD(s.lastAttended)) / 86400000) : null;
    return { st:s, has:has, days:days };
  }).filter(function(x){ return !x.has || x.days >= STALE_DAYS; })
    .sort(function(a, b){
      if (a.has !== b.has) return a.has ? 1 : -1;   /* 受講記録なしを先頭に */
      return b.days - a.days;                        /* 経過日数が長い順 */
    }).slice(0, STALE_MAX);

  var staleHtml = stale.map(function(x){
    var s = x.st;
    return '<div class="lrow lrow-wrap" data-goto-student="' + s.id + '">' +
      '<span class="nm">' + esc(s.name) + '</span>' +
      chip('b-muted', esc(s.grade)) +
      '<span class="tiny muted">' + (x.has ? '最終 ' + jaDate(s.lastAttended) : '受講記録なし') + '</span>' +
      '<span class="bignum">' + (x.has ? x.days : '—') + '</span>' +
      '<span class="tiny muted">' + (x.has ? '日' : '') + '</span>' +
      (s.active ? '' : ' ' + chip('b-muted', '休会')) +
      (s.upcoming.length ? '' : ' ' + chip('b-danger', '予約なし')) + '</div>';
  }).join('') || '<p class="muted small">21日以上あいている生徒はいません</p>';

  /* 今期 0 回（v4 から継続） */
  var zero = state.students.filter(function(s){ return s.stats.term === 0; });
  var zeroChips = zero.map(function(s){
    return '<span class="pchip" data-goto-student="' + s.id + '">' + esc(s.name) +
      (s.active ? '' : ' ' + chip('b-muted', '休会')) +
      (s.upcoming.length ? '' : ' ' + chip('b-danger', '予約なし')) + '</span>';
  }).join('') || '<span class="muted small">なし</span>';

  /* ---- A-01-1: 級別の受講中生徒（今後の予約がある生徒を級ごとに並べる） ---- */
  var byGrade = {};
  GRADES.forEach(function(g){ byGrade[g] = []; });
  state.students.forEach(function(st){
    if (!st.active || !st.upcoming.length) return;
    gradesOf(st).forEach(function(g){
      if (!byGrade[g]) byGrade[g] = [];
      if (byGrade[g].indexOf(st) < 0) byGrade[g].push(st);
    });
  });
  var gradeCards = GRADES.filter(function(g){ return byGrade[g] && byGrade[g].length; }).map(function(g){
    var names = byGrade[g].map(function(st){
      return '<span class="pchip" data-goto-student="' + st.id + '">' + esc(st.name) + '</span>';
    }).join('');
    return '<div class="gcard"><div class="gh">' + lvChip(g) +
      '<span class="gn">' + byGrade[g].length + '<span class="tiny muted"> 人</span></span></div>' +
      '<div class="gl">' + names + '</div></div>';
  }).join('') || '<p class="muted small">今後の予約がある生徒はいません</p>';

  $('#screen-dashboard').innerHTML =
    headHtml('ダッシュボード', '9/1（火）', 'dashboard') +
    '<div class="card"><h3>🎓 級別の受講中生徒 <span class="tiny muted">今後の予約がある生徒</span></h3>' +
      '<div class="gcards">' + gradeCards + '</div></div>' +
    '<div class="grid grid-3">' +
      '<div class="kpi"><div class="l">📌 この週の開講数</div><div class="n ok">' + openCount + '</div>' +
        '<div class="tiny muted" style="margin-top:4px">' + weekRange + '</div></div>' +
      '<div class="kpi"><div class="l">🎟 残り1回以下</div><div class="n danger">' + low.length + '</div>' +
        '<div class="pchips">' + lowChips + '</div></div>' +
      '<div class="kpi"><div class="l">⏳ キャンセル待ち</div><div class="n warn">' + waitTotal + '</div>' +
        '<div class="pchips">' + waitChips + '</div></div>' +
    '</div>' +
    '<div class="card"><div class="calbar" style="margin-bottom:6px">' +
      '<h3 style="margin:0;flex:1">📅 1週間の予定</h3>' +
      '<button class="btn btn-sm" data-dashweek="-1">◀ 前の週</button>' +
      '<button class="btn btn-sm" data-dashweek="1">次の週 ▶</button>' +
      '<span class="small muted">' + weekRange + '（月曜始まり・タイ時間）</span></div>' + weekHtml + '</div>' +
    '<div class="grid grid-2">' +
      '<div class="card"><h3>🔔 最近来ていない生徒 <span class="tiny muted">21日以上</span></h3>' + staleHtml +
        '<div class="divider"></div>' +
        '<h4>今期 0 回 <span class="badge b-warn">' + zero.length + '</span></h4>' +
        '<div class="pchips">' + zeroChips + '</div>' +
      '</div>' +
      '<div class="card"><h3>📈 直近1週間</h3>' +
        '<div class="tiles">' +
          '<div class="tile ok"><div class="n">' + state.weekSummary.booked + '</div><div class="l">予約</div></div>' +

/* =========================================================
   予約カレンダー
   ========================================================= */
var calView = 'week';
var weekStart = '2026-08-31';
var dayDate = TODAY;
var monthAnchor = '2026-09-01';
var calFilter = 'all'; // all | free | booked
/* v4: 時間割（時間帯グリッド）／リスト の切替。PC は時間割、スマホはリストが既定 */
var calMode = (typeof window !== 'undefined' && window.innerWidth <= 900) ? 'list' : 'grid';

/* 枠の 予約 / 定員 / 空き / 待ち を1か所で算出 */
function lessonCounts(l){
  if (!l || l.type === 'closed') return { booked:0, cap:0, free:0, wait:0, unlimited:false, closed:true };
  var booked = (l.book || []).length;
  if (l.type === 'regular') return { booked:booked, cap:0, free:0, wait:0, unlimited:true, closed:false };
  if (l.type === 'oneoff') return { booked:booked, cap:l.cap, free:Math.max(0, l.cap - booked), wait:(l.wait || []).length, unlimited:false, closed:false };
  return { booked:booked, cap:1, free:booked ? 0 : 1, wait:0, unlimited:false, closed:false }; // mono
}
/* 空きあり=緑 / 一部予約=青 / 満席・予約済=灰 / 休校=薄赤 */
function lessonStateKey(l){
  var c = lessonCounts(l);
  if (c.closed) return 'closed';
  if (c.unlimited) return 'open';
  if (c.free <= 0) return 'full';
  if (c.booked > 0) return 'partial';
  return 'open';
}
function lessonStateClass(l){ var k = lessonStateKey(l); return k === 'closed' ? '' : 'lc-' + k; }
function passCalFilter(l){
  if (calFilter === 'all') return true;
  var c = lessonCounts(l);
  if (c.closed) return false;
  if (calFilter === 'free') return c.unlimited || c.free > 0;
  return c.booked > 0;
}
function lessonsShown(ds){ return lessonsOn(ds).filter(passCalFilter); }
/* 空き人数の表記（定員なしの定期があれば「+」／定員あり枠が無ければ「∞」） */
function freeLabel(free, inf){ return inf ? (free > 0 ? free + '+' : '∞') : String(free); }
/* その日の 予約合計・空き合計（定期は定員なしなので合計に含めず「+」を付ける） */
function tally(list){
  var t = { booked:0, free:0, inf:false, open:0 };
  list.forEach(function(l){
    var c = lessonCounts(l);
    if (c.closed) return;
    t.open++;
    t.booked += c.booked;
    if (c.unlimited) t.inf = true; else t.free += c.free;
  });
  t.hasFree = t.free > 0 || t.inf;
  t.freeText = freeLabel(t.free, t.inf);
  return t;
}
function daySummary(ds){ return tally(lessonsOn(ds)); }
function daySummaryHtml(ds){
  var s = daySummary(ds);
  if (!s.open) return '';
  return '<div class="daysum"><span class="b">👥 ' + s.booked + '</span><span class="sep">・</span>' +
    '<span class="f' + (s.hasFree ? '' : ' zero') + '">空き ' + s.freeText + '</span></div>';
}
/* 週の合計（枠 / 予約 / 空き） */
function weekTotals(){
  var t = { slots:0, booked:0, free:0, inf:false };
  for (var i = 0; i < 7; i++) {
    lessonsOn(addDaysStr(weekStart, i)).forEach(function(l){
      var c = lessonCounts(l);
      if (c.closed) return;
      t.slots++; t.booked += c.booked;
      if (c.unlimited) t.inf = true; else t.free += c.free;
    });
  }
  t.freeText = freeLabel(t.free, false);
  return t;
}

function renderCalendar(){

  var body;

  else if (calView === 'week') body = (isGrid ? weekSumHtml() + weekGridHtml() : weekListHtml());

  $('#screen-calendar').innerHTML = head + body;

function calRangeLabel(){
  if (calView === 'week') return jaFull(weekStart) + ' 〜 ' + jaFull(addDaysStr(weekStart, 6));
  if (calView === 'day') return jaFull(dayDate);
  var d = parseD(monthAnchor); return d.getFullYear() + '年' + (d.getMonth()+1) + '月';
}
function weekSumHtml(){
  var t = weekTotals();
  return '<div class="weeksum">今週: 枠 <b>' + t.slots + '</b><span class="sep">・</span>予約 <b>' + t.booked + '</b>' +
    '<span class="sep">・</span>空き <b>' + t.freeText + '</b>' +
    '<button class="helpbtn" data-help="weekcount" aria-label="数え方">?</button></div>';

/* ---------------- 枠のチップ（時間割・リスト共通） ---------------- */
function lessonChips(l){
  var c = lessonCounts(l);
  if (l.type === 'regular') {
    return chip(c.booked ? 'b-regular' : 'b-muted', '👥 ' + c.booked) + chip('b-muted', '定員なし');
  }
  if (l.type === 'oneoff') {
    return chip(c.booked ? 'b-regular' : 'b-muted', '👥 ' + c.booked + '/' + c.cap) +
      (c.free > 0 ? chip('b-ok', '空き ' + c.free) : chip('b-muted', '満席')) +
      (c.wait ? chip('b-wait', '⏳ ' + c.wait) : '');
  }
  return c.booked ? chip('b-mono', '✅ ' + esc(nameOf(l.book[0]))) : chip('b-ok', '空き 1');
}
/* リスト表示のカード: 時間・名前・種別アイコン・2チップ */
function lessonCardHtml(l){
  if (l.type === 'closed') {
    return '<div class="closed-chip"><s>🚫 休校</s><br><span class="tiny"><s>' + esc(l.title) + '</s></span></div>';
  }
  var c = lessonCounts(l), bar = '';
  if (l.type === 'oneoff') {
    bar = '<div class="capbar' + (c.free > 0 ? '' : ' full') + '"><i style="width:' +
      Math.round(Math.min(1, c.cap ? c.booked / c.cap : 0) * 100) + '%"></i></div>';
  }
  return '<button class="lesson-card ' + lessonStateClass(l) + '" data-open-lesson="' + l.key + '">' +
    '<div class="lc-time">' + l.start + '–' + l.end + '</div>' +
    '<div class="lc-name">' + typeIcon(l.type) + ' ' + esc(l.title) + '</div>' +
    '<div class="lc-chips">' + lessonChips(l) + '</div>' + bar + '</button>';
}
function emptyCellHtml(cls){
  return '<div class="' + cls + '">' + (calFilter === 'all' ? '予定なし' : '該当なし') + '</div>';
}

/* =========================================================
   v4: 時間帯グリッド（9:00〜21:00 / 30分 = 1マス）
   ========================================================= */
var TG_FROM = 9 * 60, TG_TO = 21 * 60, TG_SLOT = 32, TG_ROWS = (TG_TO - TG_FROM) / 30;
function hm2min(hm){ var p = String(hm || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function min2hm(m){ return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function tgClamp(m){ return Math.max(TG_FROM, Math.min(TG_TO, m)); }
function tgTop(m){ return (tgClamp(m) - TG_FROM) / 30 * TG_SLOT; }

/* 重なる枠を横に並べるためのレイアウト計算 */
function tgLayout(list){
  var items = list.map(function(l){
    return { l:l, s:hm2min(l.start), e:Math.max(hm2min(l.start) + 30, hm2min(l.end || l.start)), col:0, n:1 };
  }).sort(function(a, b){ return a.s - b.s || a.e - b.e; });
  var group = [], groupEnd = -1;
  function flush(){
    if (!group.length) return;
    group.forEach(function(g){ g.n = group.length; });
    group = [];
  }
  items.forEach(function(it){
    if (group.length && it.s >= groupEnd) flush();
    it.col = group.length;
    group.push(it);
    groupEnd = Math.max(groupEnd, it.e);
  });
  flush();
  return items;
}
/* 枠1つ分のミニチップ（30分など高さの足りないブロック用） */
function lessonMiniChip(l){
  var c = lessonCounts(l);
  if (l.type === 'regular') return chip(c.booked ? 'b-regular' : 'b-muted', '👥 ' + c.booked);
  if (l.type === 'oneoff') return c.free > 0 ? chip('b-ok', '空き ' + c.free) : chip('b-muted', '満席');
  return c.booked ? chip('b-muted', '✅ 予約済') : chip('b-ok', '空き 1');
}
function tgBlockHtml(it, dayMode){
  var l = it.l, top = tgTop(it.s), h = Math.max(TG_SLOT - 3, tgTop(it.e) - top - 3);
  var w = 100 / it.n, left = it.col * w;
  var pos = 'top:' + top + 'px; height:' + h + 'px; left:calc(' + left + '% + 2px); width:calc(' + w + '% - 4px);';
  var dim = passCalFilter(l) ? '' : ' tgb-dim';
  var time = l.start + '–' + l.end;
  if (l.type === 'closed') {
    return '<div class="tg-block tgb-closed' + dim + '" style="' + pos + '">' +
      '<div class="tgb-row"><span class="tgb-t">🚫 ' + l.start + '</span>' +
      '<span class="tgb-n">' + esc(l.title) + ' 休校</span></div></div>';
  }
  var cls = 'tg-block tgb-' + lessonStateKey(l) + dim;
  var head = '<span class="tgb-t">' + time + '</span>' +
    '<span class="tgb-n">' + typeIcon(l.type) + ' ' + esc(l.title) + '</span>';
  /* 日表示: 幅いっぱいなので1行目に 時間・名前・チップ、2行目に予約者名 */
  if (dayMode) {
    var names = '';
    if (h >= 42 && l.book && l.book.length) {
      var ns = l.book.slice(0, 3).map(function(id){ return esc(nameOf(id)); }).join('、');
      if (l.book.length > 3) ns += ' 他' + (l.book.length - 3) + '名';
      names = '<div class="tg-names">' + ns + '</div>';
    }
    return '<button class="' + cls + '" data-open-lesson="' + l.key + '" style="' + pos + '">' +
      '<div class="tgb-row">' + head + '<span class="tgb-c">' + lessonChips(l) + '</span></div>' + names + '</button>';
  }
  /* 週表示: 高さが足りない枠（30分）は1行に圧縮 */
  if (h < 40) {
    return '<button class="' + cls + ' sm" data-open-lesson="' + l.key + '" style="' + pos + '">' +
      '<div class="tgb-row"><span class="tgb-t">' + typeIcon(l.type) + ' ' + l.start + '</span>' +
      '<span class="tgb-c">' + lessonMiniChip(l) + '</span></div></button>';
  }
  return '<button class="' + cls + '" data-open-lesson="' + l.key + '" style="' + pos + '">' +
    '<div class="tgb-t">' + time + '</div>' +
    '<div class="tgb-n">' + typeIcon(l.type) + ' ' + esc(l.title) + '</div>' +
    (h >= 46 ? '<div class="tgb-c">' + lessonChips(l) + '</div>' : '') + '</button>';
}
function tgColHtml(ds, dayMode){
  var slots = '';
  for (var i = 0; i < TG_ROWS; i++) {
    var hm = min2hm(TG_FROM + i * 30);
    slots += '<div class="tg-slot' + (i % 2 ? ' hr' : '') + '" data-newslot="' + ds + '|' + hm + '" title="' + hm + ' に枠を作成"></div>';
  }
  var blocks = tgLayout(lessonsOn(ds)).map(function(it){ return tgBlockHtml(it, dayMode); }).join('');
  return '<div class="tg-col" style="height:' + (TG_ROWS * TG_SLOT) + 'px">' + slots +
    '<div class="tg-blocks">' + blocks + '</div></div>';
}
function tgAxisHtml(){
  var rows = '';
  for (var m = TG_FROM; m < TG_TO; m += 60) rows += '<div class="tg-hour">' + Math.floor(m / 60) + ':00</div>';
  return '<div class="tg-axis">' + rows + '</div>';
}
function tgHeadHtml(ds){
  var cd = isClosed(ds);
  return '<div class="tg-head' + (ds === TODAY ? ' today' : '') + '">' +
    '<div class="d">' + DOW_JA[dowOf(ds)] + ' ' + (parseD(ds).getMonth()+1) + '/' + parseD(ds).getDate() +
    (ds === TODAY ? ' <span class="badge b-brand">今日</span>' : '') +
    (cd ? ' <span class="badge b-closed">🚫</span>' : '') + '</div>' +
    daySummaryHtml(ds) + '</div>';
}
function weekGridHtml(){
  var heads = '', cols = '';
  for (var i = 0; i < 7; i++) {
    var ds = addDaysStr(weekStart, i);
    heads += tgHeadHtml(ds);
    cols += tgColHtml(ds, false);
  }
  return '<div class="tg-wrap"><div class="tg" style="--n:7">' +
    '<div class="tg-corner"></div>' + heads + tgAxisHtml() + cols + '</div></div>' +
    '<p class="tiny muted" style="margin-top:8px">色の付いた帯＝レッスン枠、白い格子＝空いている時間（クリックで枠を作成）</p>';
}
function dayGridHtml(){
  return '<div class="tg-wrap"><div class="tg" style="--n:1">' +
    '<div class="tg-corner"></div>' + tgHeadHtml(dayDate) + tgAxisHtml() + tgColHtml(dayDate, true) + '</div></div>' +
    '<p class="tiny muted" style="margin-top:8px">色の付いた帯＝レッスン枠、白い格子＝空いている時間（クリックで枠を作成）</p>';
}

/* ---------------- リスト表示（v3 の縦積みカード） ---------------- */
function weekListHtml(){
  var cols = '';
  for (var i = 0; i < 7; i++) {
    var ds = addDaysStr(weekStart, i);
    var ls = lessonsShown(ds);
    var cd = isClosed(ds);

      '<div class="dayhead">' + DOW_JA[dowOf(ds)] + '<br><span class="dnum">' + (parseD(ds).getMonth()+1) + '/' + parseD(ds).getDate() + '</span>' +

function dayListHtml(){
  var ls = lessonsShown(dayDate);

function monthHtml(){
  var d = parseD(monthAnchor);
  var first = new Date(d.getFullYear(), d.getMonth(), 1);
  var offset = (first.getDay() + 6) % 7; // 月曜始まり
  var start = new Date(first.getFullYear(), first.getMonth(), 1 - offset);
  var cells = '<div class="month">' + ['月','火','水','木','金','土','日'].map(function(w){ return '<div class="tiny muted strong" style="text-align:center">' + w + '</div>'; }).join('');
  for (var i = 0; i < 42; i++) {
    var cur = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var ds = fmtD(cur);
    var out = cur.getMonth() !== d.getMonth();
    var t = tally(lessonsShown(ds));
    /* A-02-1: 週表示と同じ 3 状態（空きあり／一部予約／満席（空きなし）） */
    var dotColor = !t.open ? '' : (!t.hasFree ? '#9A9A9A' : (t.booked > 0 ? 'var(--sky)' : 'var(--success)'));
    var dot = t.open ? '<span class="mdot" style="background:' + dotColor + '"></span>' : '';
    cells += '<div class="mcell' + (out ? ' out' : '') + (ds === TODAY ? ' today' : '') + '" data-daypick="' + ds + '">' +
      '<div class="d">' + cur.getDate() + ' ' + dot + (isClosed(ds) ? ' <span class="tiny muted">🚫</span>' : '') + '</div>' +

          '<span class="mc-line mc-f' + (t.hasFree ? '' : ' zero') + '">空き ' + t.freeText + '</span>'
        : '') +
      '</div>';
  }
  cells += '</div>';
  return '<div class="card">' + cells +
    '<p class="tiny muted" style="margin-top:8px">' +
    '<span class="mdot" style="background:var(--success)"></span> 空きあり　' +
    '<span class="mdot" style="background:var(--sky)"></span> 一部予約　' +
    '<span class="mdot" style="background:#9A9A9A"></span> 満席（空きなし）　' +
    '👥 予約人数　空き 受け入れ人数（∞ = 定員なしのオンラインのみ）</p></div>';
}

function createSlot(){
  var t = $('#nsType').value, d = $('#nsDate').value, s = $('#nsStart').value, e = $('#nsEnd').value;
  if (!d || !s || !e) { toast('日付と時刻を入力してください', 'warn'); return; }
  if (hm2min(e) <= hm2min(s)) { toast('終了は開始より後にしてください', 'warn'); return; }
  var openAt = ($('#nsOpenAt') && $('#nsOpenAt').value || '').trim() || null;
  var eligible = !!($('#nsEligible') && $('#nsEligible').value);
  if (t === 'oneoff') {
    state.oneoff.push({ id:'o' + Date.now(), date:d, start:s, end:e, place:$('#nsPlace').value,
      cap:+$('#nsCap').value || 1, note:$('#nsNote').value, book:[], wait:[],
      openAt:openAt, eligibleOnly:eligible });
    state.oneoff.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  } else if (t === 'mono') {
    state.mono.push({ id:'m' + Date.now(), date:d, start:s, end:e, sid:null, kind:null,
      url:$('#nsMUrl').value, mid:$('#nsMMid').value, pw:$('#nsMPw').value,
      openAt:openAt, eligibleOnly:eligible });
    state.mono.sort(function(a, b){ return (a.date + a.start) < (b.date + b.start) ? -1 : 1; });
  } else {
    var nm = ($('#nsName').value || '').trim() || ($('#nsGrade').value + 'クラス');
    var nid = 'r' + Date.now();
    state.recurring.push({ id:nid, name:nm, grade:$('#nsGrade').value, dow:dowOf(d), start:s, end:e,
      url:$('#nsRUrl').value || 'https://zoom.example.com/j/new',
      mid:$('#nsRMid').value, pw:$('#nsRPw').value });
    state.defaultRoster[nid] = [];
  }
  closeModal();
  if (calView === 'day') dayDate = d;
  renderCalendar();
  toast(jaDate(d) + ' ' + s + ' に枠を作成しました', 'ok');
}

function proxyAdd(key){
  var sel = $('#proxySel');
  if (!sel || !sel.value) { toast('生徒を選択してください', 'warn'); return; }
  var l = getLesson(key), sid = sel.value, st = studentById(sid), s = state.settings[l.type];
  /* A-08-1（要相談・案B）: チケットが足りなくても通す。−MINUS_ALLOW を超えるときだけ止める */
  var avail = availableTickets(st);
  var after = avail - s.ticketCost;
  if (after < -MINUS_ALLOW) { toast('🎟 マイナスが ' + MINUS_ALLOW + ' 回を超えるため予約できません', 'err'); return; }
  /* A-06-1: マンツーマンの種別はここで決める */
  var kind = null;
  if (l.type === 'mono') { var ks = $('#proxyKind'); kind = ks ? ks.value : 'W'; }
  var wasFull = (l.type === 'oneoff') && (l.book.length >= l.cap);
  if (l.type === 'regular') { regBook(l.rid, l.date).push(sid); }
  if (l.type === 'oneoff') { state.oneoff.forEach(function(o){ if (o.id === l.oid) o.book.push(sid); }); }
  if (l.type === 'mono') { state.mono.forEach(function(m){ if (m.id === l.mid) { m.sid = sid; m.kind = kind; } }); }
  st.upcoming.push({ uid: 'p' + Date.now(), date:l.date, start:l.start,
    title: l.title + (kind ? ' ' + kindLabel(kind) : ''), type:l.type, ref: l.oid || l.mid || null });
  st.upcoming.sort(function(a,b){ return (a.date+a.start) < (b.date+b.start) ? -1 : 1; });
  if (after < 0) toast(st.name + ' を代理予約しました（未入金 ' + (-after) + ' 回）', 'warn');
  else if (wasFull) toast(st.name + ' を定員を超えて予約しました（空席通知は出ません）', 'warn');
  else toast(st.name + ' を代理予約しました（予約完了メール送信）', 'ok');
  openLessonModal(key);
  renderCalendar();
}
function proxyCancel(payload){
  var p = payload.split('::'), key = p[0], sid = p[1];
  var l = getLesson(key), st = studentById(sid), s = state.settings[l.type];
  var over = isOverdue(l.date, l.type);
  var msg = '<p><span class="strong">' + esc(st.name) + '</span>　' + typeIcon(l.type) + ' ' + jaDate(l.date) + ' ' + l.start + ' ' + esc(l.title) + '</p>' +
    (over
      ? '<p>' + chip('b-danger', '⚠ 期限超過（' + deadlineOf(l.date, l.type).text + '）') + ' ' + chip('b-danger', '🎟 −' + s.ticketCost) + '</p>'
      : '<p>' + chip('b-ok', '✓ 🎟 消費なし') + '</p>');
  confirmModal('予約をキャンセル', msg, 'キャンセルする', function(){
    if (l.type === 'regular') { var arr = regBook(l.rid, l.date); var i = arr.indexOf(sid); if (i >= 0) arr.splice(i, 1); }
    if (l.type === 'oneoff') { state.oneoff.forEach(function(o){ if (o.id === l.oid) { var j = o.book.indexOf(sid); if (j >= 0) o.book.splice(j, 1); } }); }
    if (l.type === 'mono') { state.mono.forEach(function(m){ if (m.id === l.mid) m.sid = null; }); }
    st.upcoming = st.upcoming.filter(function(u){ return !(u.date === l.date && u.start === l.start); });
    if (over) {
      addTicketHistory(st, -s.ticketCost, 'キャンセル期限超過によるキャンセル');
      st.stats.lateCancel++;
      st.past.unshift({ date:l.date, title:l.title, type:l.type, status:'cancel_over', at: TODAY + ' 21:05', comment:'管理者による代理キャンセル', score:'' });
      toast(st.name + ' をキャンセル（🎟 −' + s.ticketCost + '）', 'warn');
    } else {
      st.past.unshift({ date:l.date, title:l.title, type:l.type, status:'cancel_in', at: TODAY + ' 21:05', comment:'管理者による代理キャンセル', score:'' });
      toast(st.name + ' をキャンセル（🎟 消費なし）', 'ok');
    }
    if (l.type === 'oneoff') {
      var o2 = null; state.oneoff.forEach(function(x){ if (x.id === l.oid) o2 = x; });
      if (o2 && o2.wait.length) toast('空席通知メールを ' + o2.wait.length + ' 名へ送信', 'ok');
    }
    renderCalendar();
    if (currentScreen === 'screen-student-detail') renderStudentDetail(currentStudentId);
  }, over);
}

        state.mono.forEach(function(m2){ if (m2.id === l.mid) {
          m2.date = $('#edDate').value; m2.start = $('#edStart').value; m2.end = $('#edEnd').value;

  ]);
}
function deleteLesson(key){

var listFilter = { q:'', grade:'', status:'' };
var listSort = { col:'name', dir:1 };
function renderStudents(){
  var rows = state.students.filter(function(s){
    if (listFilter.q && (s.no + s.name + s.kana + s.romaji + s.parent).toLowerCase().indexOf(listFilter.q.toLowerCase()) < 0) return false;
    /* A-09-3: 級は複数持てるので、どれか 1 つが一致すれば通す */
    if (listFilter.grade && gradesOf(s).indexOf(listFilter.grade) < 0) return false;
    if (listFilter.status === 'active' && !s.active) return false;
    if (listFilter.status === 'inactive' && s.active) return false;
    return true;
  });
  rows.sort(function(a, b){
    var av, bv;
    switch (listSort.col) {
      case 'tickets': av = a.tickets; bv = b.tickets; break;
      case 'term': av = a.stats.term; bv = b.stats.term; break;
      case 'total': av = a.stats.total; bv = b.stats.total; break;
      case 'last': av = a.lastAttended; bv = b.lastAttended; break;
      case 'grade': av = GRADES.indexOf(gradesOf(a)[0]); bv = GRADES.indexOf(gradesOf(b)[0]); break;
      case 'no': av = a.no; bv = b.no; break;
      /* A-09-1: ローマ字の姓・名でアルファベット順に並べ替える */
      case 'rlast': av = romanLast(a) + romanFirst(a); bv = romanLast(b) + romanFirst(b); break;
      case 'rfirst': av = romanFirst(a) + romanLast(a); bv = romanFirst(b) + romanLast(b); break;
      default: av = romanLast(a) + romanFirst(a); bv = romanLast(b) + romanFirst(b);
    }
    if (av < bv) return -1 * listSort.dir;
    if (av > bv) return 1 * listSort.dir;
    return 0;
  });
  function arrow(col){ return listSort.col === col ? (listSort.dir === 1 ? ' ▲' : ' ▼') : ''; }

  var tbody = rows.map(function(s){
    var age = ageOf(s.birth);
    return '<tr class="clickable" data-goto-student="' + s.id + '">' +

      '<td class="wrap"><span class="strong">' + esc(s.name) + '</span><div class="tiny muted">' + esc(romanFull(s)) + '</div></td>' +
      /* A-09-2: 級を名前のすぐ右に置く。A-09-3: 複数並べる。A-09-4: 年齢を横に出す */
      '<td class="wrap">' + gradeChips(s, 'sm') +
        '<div class="tiny muted">' + (age === null ? '' : age + '歳 ・ ') + esc(gradeText(s)) + '</div>' +
        '<div class="tiny muted">' + typeIcon('regular') + ' ' + esc(className(s.classId)) + '</div></td>' +
      '<td>' + miniPunch(s) + (s.notice ? ' 🔔' : '') + '</td>' +
      '<td><span class="strong">' + s.stats.term + '</span> <span class="tiny muted">/ ' + s.stats.total + '</span></td>' +
      '<td>' + (s.active ? chip('b-ok', '受講中') : chip('b-muted', '休会')) + '</td>' +
      '<td class="wrap">' + esc(s.parent) + '<div class="tiny muted">' + esc(s.phone) + '</div></td>' +
      '<td>' + esc(s.lastAttended || '—') + '</td></tr>';
  }).join('') || '<tr><td colspan="8" class="muted">該当なし</td></tr>';

  $('#screen-students').innerHTML =
    headHtml('生徒一覧', state.students.length + ' 名中 ' + rows.length + ' 名', 'students') +
    '<div class="card">' +
      '<div class="filters">' +
        '<div><label for="fq">検索</label><input id="fq" placeholder="生徒・保護者・ローマ字" value="' + esc(listFilter.q) + '"></div>' +
        '<div><label for="fg">級</label><select id="fg"><option value="">すべて</option>' +
          GRADES.map(function(g){ return '<option value="' + g + '"' + (listFilter.grade === g ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></div>' +
        '<div><label for="fs">状態</label><select id="fs">' +
          '<option value="">すべて</option>' +
          '<option value="active"' + (listFilter.status==='active'?' selected':'') + '>受講中</option>' +
          '<option value="inactive"' + (listFilter.status==='inactive'?' selected':'') + '>休会</option></select></div>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr>' +
        '<th class="sortable" data-sort="no">No.' + arrow('no') + '</th>' +
        /* A-09-1: 見出しのクリックで ローマ字の姓／名 を切り替える */
        '<th class="wrap">生徒 <span class="sortlink" data-sort="rlast">ローマ字 姓' + arrow('rlast') + '</span> / ' +
          '<span class="sortlink" data-sort="rfirst">名' + arrow('rfirst') + '</span></th>' +
        '<th class="sortable wrap" data-sort="grade">級' + arrow('grade') + '</th>' +
        '<th class="sortable" data-sort="tickets">🎟' + arrow('tickets') + '</th>' +

function detailCancel(uid){
  var s = studentById(currentStudentId);
  var u = null; s.upcoming.forEach(function(x){ if (x.uid === uid) u = x; });
  if (!u) return;
  var over = isOverdue(u.date, u.type), c = cost(u.type);
  var msg = '<p><span class="strong">' + esc(s.name) + '</span>　' + typeIcon(u.type) + ' ' + jaDate(u.date) + ' ' + u.start + ' ' + esc(u.title) + '</p>' +
    (over ? '<p>' + chip('b-danger', '⚠ 期限超過（' + deadlineOf(u.date, u.type).text + '）') + ' ' + chip('b-danger', '🎟 −' + c) + '</p>'
          : '<p>' + chip('b-ok', '✓ 🎟 消費なし') + '</p>');
  confirmModal('代理キャンセル', msg, 'キャンセルする', function(){
    s.upcoming = s.upcoming.filter(function(x){ return x.uid !== uid; });
    if (u.type === 'oneoff' && u.ref) state.oneoff.forEach(function(o){ if (o.id === u.ref) { var i = o.book.indexOf(s.id); if (i >= 0) o.book.splice(i, 1); } });
    if (u.type === 'mono' && u.ref) state.mono.forEach(function(m){ if (m.id === u.ref) m.sid = null; });
    if (u.type === 'regular') { var r = null; state.recurring.forEach(function(x){ if (x.dow === dowOf(u.date) && x.start === u.start) r = x; }); if (r) { var arr = regBook(r.id, u.date); var j = arr.indexOf(s.id); if (j >= 0) arr.splice(j, 1); } }
    if (over) { addTicketHistory(s, -c, 'キャンセル期限超過によるキャンセル'); s.stats.lateCancel++; }
    s.past.unshift({ date:u.date, title:u.title, type:u.type, status: over ? 'cancel_over' : 'cancel_in', at: TODAY + ' 21:10', comment:'管理者による代理キャンセル', score:'' });
    toast(over ? 'キャンセルしました（🎟 −' + c + '）' : 'キャンセルしました（🎟 消費なし）', over ? 'warn' : 'ok');
    renderStudentDetail(s.id);
  }, over);
}

var resultLessonKey = '';
var resultDraft = {};
/* A-15-1: 「月で絞る」「日付の範囲で絞る」で過去 1 週間より前も選べるようにする */
var resultFilter = { mode:'month', month:'2026-08', from:'2026-08-01', to:'2026-09-01' };
function resultRange(){
  if (resultFilter.mode === 'month') {
    var p = resultFilter.month.split('-'), y = +p[0], m = +p[1];
    var last = new Date(y, m, 0).getDate();
    return { from: resultFilter.month + '-01', to: resultFilter.month + '-' + pad(last) };
  }
  return { from: resultFilter.from, to: resultFilter.to };
}
function resultCandidates(){
  var r = resultRange(), out = [];
  var d = parseD(r.from), end = parseD(r.to), guard = 0;
  while (d.getTime() <= end.getTime() && guard++ < 400) {
    var ds = fmtD(d);
    lessonsOn(ds).forEach(function(l){ if (l.type !== 'closed' && l.book.length) out.push(l); });
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function resultMonths(){
  var out = [];
  for (var i = 0; i < 12; i++) {
    var d = parseD(TODAY); d.setMonth(d.getMonth() - i);
    out.push(d.getFullYear() + '-' + pad(d.getMonth() + 1));
  }
  return out;
}
function renderResults(){
  var list = resultCandidates();
  if (!resultLessonKey && list.length) resultLessonKey = list[0].key;
  var l = resultLessonKey ? getLesson(resultLessonKey) : null;

  var options = list.map(function(x){
    return '<option value="' + x.key + '"' + (x.key === resultLessonKey ? ' selected' : '') + '>' +
      jaFull(x.date) + ' ' + x.start + ' ' + x.title + '（' + x.book.length + '名）</option>';
  }).join('');

  var rows = '';

          '<button data-rst="' + id + '::absent" class="' + (d.status === 'absent' ? 'active' : '') + '">✗ 欠席</button>' +
        '</div><div style="margin-top:4px">' + chip(d.status === 'absent' ? 'b-danger' : 'b-muted', '🎟 −' + cost(l.type)) +
          (d.saved ? ' ' + chip('b-ok', '保存済') : '') + '</div></td>' +
        '<td class="wrap">' + didHtml + '</td>' +
        /* A-14-1: 点数の欄は置かない */
        '<td class="wrap"><input data-rcm="' + id + '" value="' + esc(d.comment) + '" placeholder="講師コメント（保護者へのひとこと）"></td></tr>';
    }).join('');
  }

  $('#screen-results').innerHTML =
    headHtml('レッスン結果入力', '', 'results') +
    '<div class="card">' +
      /* A-15-1: 月で絞る／日付の範囲で絞る */
      '<div class="filters">' +
        '<div><label for="resMode">絞り込み</label><select id="resMode">' +
          '<option value="month"' + (resultFilter.mode==='month'?' selected':'') + '>月で絞る</option>' +
          '<option value="range"' + (resultFilter.mode==='range'?' selected':'') + '>日付の範囲で絞る</option></select></div>' +
        (resultFilter.mode === 'month'
          ? '<div><label for="resMonth">月</label><select id="resMonth">' +
              resultMonths().map(function(m){ var p=m.split('-');
                return '<option value="' + m + '"' + (m===resultFilter.month?' selected':'') + '>' + p[0] + '年' + (+p[1]) + '月</option>'; }).join('') +

            '<div><label for="resTo">終了日</label><input id="resTo" type="date" value="' + resultFilter.to + '"></div>') +

      '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" data-saveresults="1">保存する</button></div></div>' : '');
}
function saveResults(){
  var l = getLesson(resultLessonKey);
  if (!l) return;
  var absent = 0, attended = 0;
  l.book.forEach(function(id){
    var st = studentById(id);
    var key = resultLessonKey + '::' + id;
    var d = resultDraft[key] || { status:'attended', comment:'', did:[], didOther:'', saved:false };
    var cm = $('[data-rcm="' + id + '"]');
    d.comment = cm ? cm.value : d.comment;
    /* A-14-2: 取り組んだ内容を拾う */
    var picked = $all('[data-rdid^="' + id + '::"]').filter(function(x){ return x.checked; })
      .map(function(x){ return x.getAttribute('data-rdid').split('::')[1]; });
    if (picked.length) d.did = picked;
    var doi = $('[data-rdo="' + id + '"]');
    if (doi) d.didOther = doi.value;
    var didOut = (d.did || []).map(function(x){ return (x === 'その他' && d.didOther) ? 'その他（' + d.didOther + '）' : x; });
    resultDraft[key] = d;
    st.past = st.past.filter(function(p){ return !(p.date === l.date && p.title === l.title); });
    st.past.unshift({ date:l.date, title:l.title, type:l.type, status:d.status, comment:d.comment, did:didOut, score:'' });
    st.past.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    if (!d.saved) {
      if (d.status === 'absent') {
        absent++;
        addTicketHistory(st, -cost(l.type), '欠席', l.date);
        st.stats.absent++;
      } else {
        attended++;
        addTicketHistory(st, -cost(l.type), 'レッスン受講（' + l.title + '）', l.date);
        st.stats.term++; st.stats.total++;
        st.lastAttended = l.date;
      }
      // 確定した回は「今後の予約」から外す
      st.upcoming = st.upcoming.filter(function(u){ return !(u.date === l.date && u.start === l.start); });
      d.saved = true;
    }
  });
  renderResults();
  toast('保存しました（✅ ' + attended + ' ・ ✗ ' + absent + '）', absent ? 'warn' : 'ok');
}

  if ((el = t.closest('[data-copymono]'))) {
    var mid2 = el.getAttribute('data-copymono'), sm = null;
    state.mono.forEach(function(x){ if (x.id === mid2) sm = x; });
    var nmid = 'm' + Date.now();
    state.mono.push({ id:nmid, date:sm.date, start:sm.start, end:sm.end, sid:null, kind:null,
      url:sm.url, mid:sm.mid, pw:sm.pw, openAt:sm.openAt || null, eligibleOnly: !!sm.eligibleOnly });
    state.mono.sort(function(a,b){ return (a.date + a.start) < (b.date + b.start) ? -1 : 1; });
    renderLessons(); toast('マンツーマン枠をコピーしました。内容を編集してください', 'ok');
    editLessonModal('mono|' + nmid); return;
  }
  /* A-16-2: CSV 書き出し */
  if ((el = t.closest('[data-eikencsv]'))) { exportEikenCsv(); return; }

  if ((el = t.closest('[data-cal]'))) { calView = el.getAttribute('data-cal'); renderCalendar(); return; }
  if ((el = t.closest('[data-calmode]'))) { calMode = el.getAttribute('data-calmode'); renderCalendar(); return; }
  if ((el = t.closest('[data-newslot]'))) {
    var ns = el.getAttribute('data-newslot').split('|');
    newSlotModal(ns[0], ns[1]); return;
  }
  if ((el = t.closest('[data-calfilter]'))) { calFilter = el.getAttribute('data-calfilter'); renderCalendar(); return; }
  if ((el = t.closest('[data-week]'))) { weekStart = addDaysStr(weekStart, 7 * +el.getAttribute('data-week')); renderCalendar(); return; }
  if ((el = t.closest('[data-day]'))) { dayDate = addDaysStr(dayDate, +el.getAttribute('data-day')); renderCalendar(); return; }
  if ((el = t.closest('[data-month]'))) {
    var d = parseD(monthAnchor); d.setMonth(d.getMonth() + (+el.getAttribute('data-month'))); monthAnchor = fmtD(new Date(d.getFullYear(), d.getMonth(), 1)); renderCalendar(); return;
  }
  if ((el = t.closest('[data-daypick]'))) { dayDate = el.getAttribute('data-daypick'); calView = 'day'; renderCalendar(); return; }

  if ((el = t.closest('[data-sort]'))) {
    var col = el.getAttribute('data-sort');
    if (listSort.col === col) listSort.dir *= -1; else { listSort.col = col; listSort.dir = 1; }
    renderStudents(); return;
  }
  if ((el = t.closest('[data-ltab]'))) { lessonTab = el.getAttribute('data-ltab'); renderLessons(); return; }
  if ((el = t.closest('[data-togglewait]'))) {
    var row = $('#wait-' + el.getAttribute('data-togglewait'));
    if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    return;
  }
  if ((el = t.closest('[data-addreg]'))) {
    var nm = $('#nrName').value.trim();
    if (!nm) { toast('クラス名を入力してください', 'warn'); return; }
    var nid = 'r' + Date.now();
    state.recurring.push({ id:nid, name:nm, grade:$('#nrGrade').value, dow:+$('#nrDow').value,
      start:$('#nrStart').value, end:$('#nrEnd').value,
      url:$('#nrUrl').value || 'https://zoom.example.com/j/new',
      mid:$('#nrMid').value, pw:$('#nrPw').value });
    state.defaultRoster[nid] = [];
    renderLessons(); toast('オンラインレッスンを登録しました', 'ok'); return;
  }
  if ((el = t.closest('[data-editreg]'))) { openLessonModalForRecurring(el.getAttribute('data-editreg')); return; }
  if ((el = t.closest('[data-delreg]'))) {
    var rid = el.getAttribute('data-delreg'), r0 = recurringById(rid);
    confirmModal('定期クラスを削除', '<p>💻 ' + esc(r0.name) + '</p><p>' + chip('b-danger', '今後の開催がすべてなくなります') + '</p>', '削除する', function(){
      state.recurring = state.recurring.filter(function(x){ return x.id !== rid; });
      renderLessons(); toast('定期クラスを削除しました', 'warn');
    }, true); return;
  }
  if ((el = t.closest('[data-addclosed]'))) {
    var cd = $('#ncDate').value;
    if (!cd) { toast('日付を選んでください', 'warn'); return; }
    if (isClosed(cd)) { toast('すでに休校日として登録されています', 'warn'); return; }
    state.closedDays.push({ date: cd, reason: $('#ncReason').value.trim() || '休校' });
    renderLessons(); toast(jaFull(cd) + ' を休校日に設定しました', 'ok'); return;
  }
  if ((el = t.closest('[data-delclosed]'))) {
    var dd = el.getAttribute('data-delclosed');
    state.closedDays = state.closedDays.filter(function(c){ return c.date !== dd; });
    renderLessons(); toast('休校日を削除しました', 'ok'); return;
  }
  if ((el = t.closest('[data-addoneoff]'))) {
    var od = $('#noDate').value;
    if (!od) { toast('日付を選んでください', 'warn'); return; }
    state.oneoff.push({ id:'o' + Date.now(), date:od, start:$('#noStart').value, end:$('#noEnd').value,
      place:$('#noPlace').value, cap:+$('#noCap').value || 1, note:$('#noNote').value, book:[], wait:[],
      openAt: ($('#noOpenAt').value || '').trim() || null, eligibleOnly: !!$('#noEligible').value });
    state.oneoff.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    renderLessons(); toast('対面クラスを作成しました', 'ok'); return;
  }
  if ((el = t.closest('[data-deloneoff]'))) {
    var oid = el.getAttribute('data-deloneoff');
    confirmModal('単発レッスンを削除', '<p>🏫 この単発レッスンを削除</p><p>' + chip('b-warn', '予約者へ通知メール') + '</p>', '削除する', function(){
      state.oneoff = state.oneoff.filter(function(o){ return o.id !== oid; });
      renderLessons(); toast('単発レッスンを削除しました', 'warn');
    }, true); return;
  }
  if ((el = t.closest('[data-addmono]'))) {
    var md = $('#nmDate').value;
    if (!md) { toast('日付を選んでください', 'warn'); return; }
    state.mono.push({ id:'m' + Date.now(), date:md, start:$('#nmStart').value, end:$('#nmEnd').value,
      sid:null, kind:null,
      url:$('#nmUrl').value, mid:$('#nmMid').value, pw:$('#nmPw').value,
      openAt: ($('#nmOpenAt').value || '').trim() || null, eligibleOnly: !!$('#nmEligible').value });
    state.mono.sort(function(a,b){ return (a.date + a.start) < (b.date + b.start) ? -1 : 1; });
    renderLessons(); toast('マンツーマン枠を作成しました', 'ok'); return;
  }
  if ((el = t.closest('[data-delmono]'))) {
    var mid = el.getAttribute('data-delmono');
    confirmModal('マンツーマン枠を削除', '<p>👤 この枠を削除</p>', '削除する', function(){
      state.mono = state.mono.filter(function(m){ return m.id !== mid; });
      renderLessons(); toast('マンツーマン枠を削除しました', 'warn');
    }, true); return;
  }
  if ((el = t.closest('[data-savesettings]'))) { saveSettings(); return; }
  if ((el = t.closest('[data-rst]'))) {
    var pp = el.getAttribute('data-rst').split('::');
    var k2 = resultLessonKey + '::' + pp[0];
    var cm2 = $('[data-rcm="' + pp[0] + '"]'), sc2 = $('[data-rsc="' + pp[0] + '"]');
    var prev = resultDraft[k2] || {};
    resultDraft[k2] = { status: pp[1], comment: cm2 ? cm2.value : '', score: sc2 ? sc2.value : '', saved: !!prev.saved };
    renderResults(); return;
  }
  if ((el = t.closest('[data-saveresults]'))) { saveResults(); return; }
});

/* 定期クラスの編集（レッスン枠管理タブから） */
function openLessonModalForRecurring(rid){
  var r = recurringById(rid);
  openModal('定期クラスを編集',
    '<div class="field"><label>クラス名</label><input id="erName" value="' + esc(r.name) + '"></div>' +
    '<div class="field"><label>級</label><select id="erGrade">' + GRADES.map(function(g){ return '<option' + (g === r.grade ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>曜日</label><select id="erDow">' + [1,2,3,4,5,6,0].map(function(d){ return '<option value="' + d + '"' + (d === r.dow ? ' selected' : '') + '>' + DOW_JA[d] + '曜</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>開始時刻</label><input id="erStart" value="' + r.start + '"></div>' +
    '<div class="field"><label>終了時刻</label><input id="erEnd" value="' + r.end + '"></div>' +
    '<div class="field"><label>オンラインURL</label><input id="erUrl" value="' + esc(r.url) + '"></div>',
    [
      { label:'やめる', fn: closeModal },
      { label:'保存', cls:'btn-primary', fn: function(){
        r.name = $('#erName').value; r.grade = $('#erGrade').value; r.dow = +$('#erDow').value;
        r.start = $('#erStart').value; r.end = $('#erEnd').value; r.url = $('#erUrl').value;
        closeModal(); renderLessons(); toast('定期クラスを更新しました', 'ok');
      } }
    ]);
}

/* input / select 変更 */
document.addEventListener('input', function(e){
  if (e.target.id === 'fq') { listFilter.q = e.target.value; var pos = e.target.selectionStart; renderStudents(); var f = $('#fq'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'fg') { listFilter.grade = e.target.value; renderStudents(); }
  if (e.target.id === 'fs') { listFilter.status = e.target.value; renderStudents(); }
  if (e.target.id === 'resSel') { resultLessonKey = e.target.value; renderResults(); }
  if (e.target.id === 'nsType') { updateNewSlotFields(); }
  /* A-15-1: 対象レッスンの絞り込み */
  if (e.target.id === 'resMode')  { resultFilter.mode = e.target.value; resultLessonKey = ''; renderResults(); }
  if (e.target.id === 'resMonth') { resultFilter.month = e.target.value; resultLessonKey = ''; renderResults(); }
  if (e.target.id === 'resFrom')  { resultFilter.from = e.target.value; resultLessonKey = ''; renderResults(); }
  if (e.target.id === 'resTo')    { resultFilter.to = e.target.value; resultLessonKey = ''; renderResults(); }
  /* A-16-2: 英検一覧の期間 */
  if (e.target.id === 'ekFrom') { eikenListFilter.from = e.target.value; renderEiken($('#ekS') ? $('#ekS').value : null); }
  if (e.target.id === 'ekTo')   { eikenListFilter.to = e.target.value; renderEiken($('#ekS') ? $('#ekS').value : null); }
  /* A-14-2: 「その他」を選んだときだけ自由入力を出す */
  if (e.target.getAttribute && e.target.getAttribute('data-rdid')) {
    var pr = e.target.getAttribute('data-rdid').split('::');
    var key2 = resultLessonKey + '::' + pr[0];
    var dd2 = resultDraft[key2] || { status:'attended', comment:'', did:[], didOther:'', saved:false };
    var cmEl = $('[data-rcm="' + pr[0] + '"]'); if (cmEl) dd2.comment = cmEl.value;
    dd2.did = $all('[data-rdid^="' + pr[0] + '::"]').filter(function(x){ return x.checked; })
      .map(function(x){ return x.getAttribute('data-rdid').split('::')[1]; });
    resultDraft[key2] = dd2;
    renderResults();
  }
});

/* ログイン / ログアウト / メニュー */
$('#btnLogin').addEventListener('click', function(){
  $('#screen-login').classList.remove('on');
  $('#app').classList.add('on');
  showScreen('screen-dashboard');
});
$('#btnLogout').addEventListener('click', function(){
  confirmModal('ログアウト', '<p>管理画面からログアウトします</p>', 'ログアウト', function(){
    $('#app').classList.remove('on');
    $('#screen-login').classList.add('on');
    toast('ログアウトしました');
  });
});
$('#btnMenu').addEventListener('click', function(){ $('#sidebar').classList.toggle('open'); });

buildNav();
