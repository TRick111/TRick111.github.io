<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Achieve English Gym 予約システム（生徒・保護者側モック v6・2026-09-20）</title>
<style>
:root{
  /* ===== v4 テーマトークン（既存サイト voicehobbyclub の黄色トーンに準拠） ===== */
  --brand:#FBF36A;        /* ヒーロー黄 */
  --brand-deep:#F5C400;   /* 黄の濃い側 */
  --brand-soft:#FDEFC9;   /* セクション背景 */
  --bg:#FFFBEA; --card:#FFFFFF;
  --ink:#222222; --text:#222222; --muted:#6B6B6B; --border:#EADFB0;
  --pink:#F78DA7; --pink-soft:#FFE0E8; --pink-ink:#B03A5B;
  --orange:#FF6A00; --orange-soft:#FFF1E0; --orange-ink:#A83E00;
  --danger:#CF2D2D; --danger-soft:#FBC9C9;
  --success:#3C8A2E; --success-soft:#E9FBC4;
  --sky:#5B8DD6; --sky-soft:#BCD5F3; --sky-ink:#2F5FA8;
  --type-online:#5B8DD6; --type-onsite:#3C8A2E; --type-private:#9B51E0;
  --purple:#9B51E0; --purple-soft:#F0E4FB; --purple-ink:#6E2FA8;
  --neutral-soft:#EEEEEE; --neutral-ink:#666666;
  --line:#E7E0C6;
  /* ===== v6 S-05-3 級カラー（8区分） ===== */
  --lv-5:#3F8FC4;   --lv-5-soft:#DCEEF8;
  --lv-4:#3C8A2E;   --lv-4-soft:#E3F4DA;
  --lv-3:#D98A1F;   --lv-3-soft:#FBEDD4;
  --lv-j2:#E0562B;  --lv-j2-soft:#FBE1D7;
  --lv-j2p:#BE3A73; --lv-j2p-soft:#FADBE8;
  --lv-2:#7647BE;   --lv-2-soft:#EADFF8;
  --lv-p1:#2B569B;  --lv-p1-soft:#DBE5F6;
  --lv-ot:#6F6F6F;  --lv-ot-soft:#E7E7E7;
  --radius:14px;
  /* 旧トークン互換（インライン参照用） */
  --primary:#222222; --primary-soft:#FDEFC9; --accent:#FF6A00;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  word-break:break-word; overflow-wrap:anywhere;
}
img,svg{max-width:100%;height:auto;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:16px;}

.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:84px;position:relative;}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--ink);padding:9px 12px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--brand-deep);}
.hd .brand{flex:1;min-width:0;}
.hd .brand b{display:block;font-size:16px;font-weight:900;line-height:1.15;letter-spacing:-.02em;color:var(--ink);}
.hd .mock{display:inline-block;margin-top:3px;background:rgba(34,34,34,.10);border:1px solid var(--ink);border-radius:999px;padding:0 7px;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--ink);}
.hd .who{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;white-space:nowrap;min-height:36px;}
.hd .out{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:999px;width:36px;height:36px;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}
.hd .out[hidden]{display:none;}

main{padding:12px 12px 8px;}
.screen{display:none;}
.screen.active{display:block;}

/* ---------- typography ---------- */
.hrow{display:flex;align-items:center;gap:8px;margin:2px 0 12px;}
h2.title{font-size:21px;font-weight:900;letter-spacing:-.01em;margin:0;flex:1;color:var(--ink);}
h3.sub{font-size:13px;margin:16px 0 8px;color:var(--ink);font-weight:800;letter-spacing:.01em;}
.subrow{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px;}
.subrow h3.sub{margin:0;flex:1;}
.muted{color:var(--muted);}
.tiny{font-size:11.5px;}
.small{font-size:12.5px;}
.mt6{margin-top:6px;} .mt10{margin-top:10px;} .mt14{margin-top:14px;}
.help{width:32px;height:32px;flex:none;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:900;font-size:14px;line-height:1;}
.more{background:none;border:0;color:var(--ink);font-weight:800;font-size:12.5px;padding:4px 2px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--brand-deep);}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.card.tight{padding:11px 12px;}
.card.tkt{background:var(--brand-soft);border-color:var(--brand-deep);}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.hr{height:1px;background:var(--border);margin:12px 0;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;}
.btn.pri{background:var(--brand);border-color:var(--ink);color:var(--ink);font-weight:900;}
.btn.pri:hover,.btn.pri:active{background:var(--brand-deep);}
.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:900;}
.btn.dgr{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn.dgrf{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn.block{display:flex;width:100%;}
.btn.sm{min-height:36px;padding:5px 11px;font-size:12.5px;}
.btn.xs{min-height:32px;padding:4px 10px;font-size:12px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.linkbtn{background:none;border:0;color:var(--ink);font-weight:800;padding:8px 4px;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--brand-deep);}

/* ---------- segmented ---------- */
.seg{display:flex;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px;gap:3px;}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px;padding:6px 2px;white-space:nowrap;}
.seg button.on{background:var(--brand);color:var(--ink);font-weight:900;box-shadow:inset 0 0 0 1.5px var(--ink);}
.seg.sm button{min-height:32px;font-size:12px;}

/* ---------- child avatar chips ---------- */
.avrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.av{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px 6px 4px;min-height:40px;color:var(--muted);font-weight:700;font-size:13.5px;}
.av .ini{width:11px;height:11px;border-radius:999px;background:#D9D2B4;flex:none;margin-left:7px;}
.av .lv{font-size:11px;font-weight:700;opacity:.75;}
.av.on{border-color:var(--ink);background:var(--brand);color:var(--ink);font-weight:900;}
.av.on .ini{background:var(--ink);}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap;}
.c-ok{background:var(--neutral-soft);color:var(--neutral-ink);}
.c-wait{background:var(--pink-soft);color:var(--pink-ink);}
.c-off{background:var(--neutral-soft);color:var(--neutral-ink);}
.c-free{background:var(--success-soft);color:#2E6B23;}
.c-dgr{background:var(--danger-soft);color:var(--danger);}
.c-w{background:var(--purple-soft);color:var(--purple-ink);}
.c-s{background:var(--pink-soft);color:var(--pink-ink);}

/* ---------- punch card ---------- */
.pcard{display:flex;align-items:center;gap:8px;}
.punch{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;flex:1;min-width:0;--pc:var(--ink);}
.punch[data-s="mid"]{--pc:var(--orange);}
.punch[data-s="low"]{--pc:var(--danger);}
.pu{height:26px;border-radius:7px;border:1.5px dashed var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;line-height:1;}
.pu.on{border:1.5px solid var(--pc);background:var(--brand);}
.pu.on::after{content:'\1F39F';opacity:.8;}
.pu.hold{border:1.5px solid var(--pc);background:repeating-linear-gradient(45deg,var(--brand),var(--brand) 3px,#fff 3px,#fff 6px);}
.pnum{font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);}
.pnum[data-s="mid"]{color:var(--orange);} .pnum[data-s="low"]{color:var(--danger);}
.punit{font-size:12px;font-weight:800;color:var(--muted);margin-left:2px;}
.plus{background:var(--brand);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:900;}

/* ---------- banner ---------- */
.banner{display:flex;align-items:center;gap:8px;background:var(--orange-soft);border:2px solid var(--orange);border-radius:12px;padding:9px 10px;margin-bottom:12px;}
.banner .bt{flex:1;min-width:0;font-size:13px;font-weight:800;color:var(--orange-ink);}
.banner.warn{background:var(--brand-soft);border-color:var(--brand-deep);}
.banner.warn .bt{color:var(--ink);}

/* ---------- date block + rows ---------- */
.dbk{width:40px;flex:none;text-align:center;border-radius:9px;background:var(--brand-soft);padding:3px 0 4px;}
.dbk .wd{font-size:10px;font-weight:800;color:#5A5A5A;line-height:1.2;}
.dbk .dd{font-size:19px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink);}
.dbk.sat .wd{color:var(--sky-ink);} .dbk.sun .wd{color:var(--danger);}
.dbk.lg{width:48px;} .dbk.lg .dd{font-size:24px;}

.lrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px 10px;margin-bottom:8px;min-height:56px;width:100%;text-align:left;color:inherit;font-size:15px;}
.lrow.off{background:#F7F4E8;color:#9C9584;}
.lrow.off .dbk{background:#EFEADA;}
.lrow.off .dbk .dd{color:#9C9584;}
.lrow .mid{flex:1;min-width:0;}
.lrow .t{font-weight:800;font-size:14.5px;white-space:normal;line-height:1.35;}
.lrow .m{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:normal;line-height:1.4;}
.lrow .m.dgr{color:var(--danger);font-weight:800;}
.lrow .rt{display:flex;align-items:center;gap:6px;flex:none;}
.lrow.tap::after{content:'\203A';color:#C9BF95;font-size:18px;flex:none;line-height:1;}
.hero{border:2px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--brand-deep);}
.hero .dbk{background:var(--brand);}
.hero .t{font-size:16px;}

/* ---------- mono gauge ---------- */
.gauge{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700;}
.gauge .g{display:inline-flex;align-items:center;gap:5px;}
.gauge .dots{display:inline-flex;gap:3px;}
.gd{width:9px;height:9px;border-radius:99px;background:var(--line);display:inline-block;}
.gd.on{background:var(--purple);}
.gauge .n{color:var(--muted);font-variant-numeric:tabular-nums;}

/* ---------- calendar ---------- */
.cal{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
.cal .cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
.cal .dw{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:800;}
.cal .dw.sun{color:var(--danger);} .cal .dw.sat{color:var(--sky-ink);}
.cell{border:1px solid transparent;border-radius:8px;min-height:44px;min-width:0;padding:3px 2px 2px;background:#fff;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;}
.cell.has{border-color:var(--border);}
.cell.tap{cursor:pointer;}
.cell.on{background:var(--brand);border-color:var(--ink);font-weight:900;}
.cell.today{outline:2px solid var(--ink);outline-offset:-2px;}
.cell .dots{display:flex;gap:2px;justify-content:center;margin-top:3px;flex-wrap:wrap;}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block;}
.dot.reg{background:var(--type-online);} .dot.sgl{background:var(--type-onsite);} .dot.mono{background:var(--type-private);}
.cell .xx{font-size:9.5px;color:var(--muted);display:block;line-height:1.2;}
.cell.empty{background:transparent;border-color:transparent;}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:10px;}
label.f span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:800;}
label.f input,label.f select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);}
label.f input:focus,label.f select:focus{outline:2px solid var(--brand-deep);outline-offset:1px;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:0;}
.kv b{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;}
.kv span{color:var(--muted);font-size:12.5px;white-space:nowrap;}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:2px solid var(--ink);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.bnav button{flex:1;border:0;background:none;padding:7px 2px 9px;color:var(--muted);font-size:10.5px;font-weight:800;min-height:56px;}
.bnav button .ic{display:block;font-size:19px;line-height:1.25;}
.bnav button.on{color:var(--ink);box-shadow:inset 0 -4px 0 var(--brand-deep);}
body.nonav .bnav{display:none;}
body.nonav .app{padding-bottom:12px;}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;width:calc(100% - 32px);max-width:440px;pointer-events:none;}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;margin-top:8px;box-shadow:0 6px 18px rgba(0,0,0,.22);}

/* ---------- bottom sheet ---------- */
#modal{position:fixed;inset:0;z-index:70;background:rgba(34,34,34,.45);display:none;align-items:flex-end;justify-content:center;}
#modal.on{display:flex;}
.mbox{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:8px 16px 18px;max-height:88vh;overflow-y:auto;border-top:3px solid var(--brand-deep);}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px;}
.mbox h4{margin:0 0 10px;font-size:17px;font-weight:900;color:var(--ink);}
.mbox .mbody{font-size:13.5px;}
.mbox .macts{display:flex;gap:8px;margin-top:16px;}
.mbox .macts .btn{flex:1;}
.mbox ul{margin:0;padding-left:18px;}
.mbox ul li{margin-bottom:6px;}
.line{display:flex;align-items:center;gap:7px;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;}
.line.ok{background:var(--success-soft);color:#2E6B23;}
.line.bad{background:var(--danger-soft);color:var(--danger);}
.line.info{background:var(--brand-soft);color:var(--ink);font-weight:700;}
details{font-size:12.5px;}
details summary{color:var(--ink);font-weight:800;cursor:pointer;padding:4px 0;list-style:none;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--brand-deep);}
details summary::-webkit-details-marker{display:none;}
details .cm{color:var(--muted);padding:2px 0 4px;}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--brand-deep);}
.sk{display:grid;grid-template-columns:78px 1fr 56px;gap:8px;align-items:center;font-size:11.5px;margin-bottom:7px;}
.sk .lb{font-weight:900;color:var(--ink);}
.sk .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;}

/* ================= v6 で足したもの ================= */
/* S-05-1 / S-05-3: 級チップ（先頭・大きめ・級カラーの地色） */
.lv{display:inline-flex;align-items:center;border-radius:9px;padding:3px 9px;font-size:13px;font-weight:900;line-height:1.25;white-space:nowrap;border:1.5px solid currentColor;}
.lv.big{font-size:15px;padding:4px 11px;}
.lv.sm{font-size:11px;padding:2px 7px;font-weight:800;}
.lv-5{background:var(--lv-5-soft);color:var(--lv-5);}
.lv-4{background:var(--lv-4-soft);color:var(--lv-4);}
.lv-3{background:var(--lv-3-soft);color:var(--lv-3);}
.lv-j2{background:var(--lv-j2-soft);color:var(--lv-j2);}
.lv-j2p{background:var(--lv-j2p-soft);color:var(--lv-j2p);}
.lv-2{background:var(--lv-2-soft);color:var(--lv-2);}
.lv-p1{background:var(--lv-p1-soft);color:var(--lv-p1);}
.lv-ot{background:var(--lv-ot-soft);color:var(--lv-ot);}

/* S-05-2 / S-01-5: 月カレンダーの枠チップ */
.cell{min-height:56px;}
.cchips{display:flex;flex-direction:column;gap:2px;margin-top:2px;min-width:0;}
.cchip{display:block;border-radius:5px;padding:1px 3px;font-size:9px;font-weight:800;line-height:1.35;
  white-space:normal;word-break:break-word;overflow-wrap:anywhere;border:1px solid currentColor;text-align:left;}
.cchip.booked{color:#fff;border-color:transparent;font-weight:900;}
.cchip.booked.lv-5{background:var(--lv-5);} .cchip.booked.lv-4{background:var(--lv-4);}
.cchip.booked.lv-3{background:var(--lv-3);} .cchip.booked.lv-j2{background:var(--lv-j2);}
.cchip.booked.lv-j2p{background:var(--lv-j2p);} .cchip.booked.lv-2{background:var(--lv-2);}
.cchip.booked.lv-p1{background:var(--lv-p1);} .cchip.booked.lv-ot{background:var(--lv-ot);}

/* 要相談の注記バー（田中さんと玲奈さんの相談中） */
.talk{display:flex;align-items:flex-start;gap:7px;background:#FFF6CC;border:1px solid var(--brand-deep);
  border-left:5px solid var(--brand-deep);border-radius:8px;padding:7px 10px;margin:8px 0;
  font-size:11.5px;font-weight:700;color:#6B5600;line-height:1.5;}
.talk .tk{flex:none;font-weight:900;}

/* S-07-1 / S-12-1: 月見出しと月送り */
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;
  border:1px solid var(--border);border-radius:12px;padding:6px 8px;margin-bottom:10px;}
.mbar b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;}
.mbar button{min-width:40px;min-height:36px;border-radius:999px;border:2px solid var(--ink);
  background:#fff;color:var(--ink);font-weight:900;font-size:14px;line-height:1;}

/* S-01-8 / S-12-2: マンツーマン利用状況を縦積みにする */
.gauge.stack{flex-direction:column;align-items:stretch;gap:8px;}
.gauge.stack .g{justify-content:flex-start;}
.gauge.stack .g .nm{min-width:96px;font-weight:800;font-size:12.5px;}

/* S-08-1: コピー付きの行 */
.cprow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--border);}
.cprow .ck{color:var(--muted);font-size:12px;flex:none;min-width:88px;font-weight:800;}
.cprow .cv{flex:1;min-width:0;font-size:12.5px;font-weight:800;word-break:break-all;}
.cprow .cb{flex:none;min-height:32px;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-size:11.5px;font-weight:800;}

/* S-19-1: 振込先の口座ブロック */
.bank{border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:8px;background:#fff;}
.bank h5{margin:0 0 5px;font-size:12.5px;font-weight:900;}
.steps{counter-reset:st;margin:10px 0 0;padding:0;list-style:none;}
.steps li{counter-increment:st;position:relative;padding-left:26px;margin-bottom:6px;font-size:12.5px;}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:19px;height:19px;border-radius:999px;
  background:var(--brand);border:1.5px solid var(--ink);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}

/* S-11-1: 未入金バナー */
.banner.dgr{background:var(--danger-soft);border-color:var(--danger);}
.banner.dgr .bt{color:var(--danger);}

/* 小さい画面でも横に溢れさせない */
@media (max-width:400px){
  .lrow{gap:8px;padding:9px 8px;}

    if(reservations[i].childId===childId && reservations[i].lessonId===lessonId) return reservations[i];
  }
  return null;
}
function resById(rid){
  for(var i=0;i<reservations.length;i++){ if(reservations[i].id===rid) return reservations[i]; }
  return null;
}
function plannedCost(childId){
  var t = 0;
  reservations.forEach(function(r){
    if(r.childId === childId && r.status === 'booked') t += TYPE[LESSONS[r.lessonId].type].cost;
  });
  return t;
}
function anyChildRes(lessonId){
  for(var i=0;i<reservations.length;i++){
    if(reservations[i].lessonId===lessonId && reservations[i].status==='booked') return reservations[i];
  }
  return null;
}

function ticketState(n){return n>=4 ? 'ok' : (n>=2 ? 'mid' : 'low');}

/* 日付ブロック（曜日小 + 日大） */
function dbk(dateStr, big){
  var d = ymd(dateStr), w = d.getDay();
  return '<div class="dbk'+(w===6?' sat':(w===0?' sun':''))+(big?' lg':'')+'">'
    + '<div class="wd">'+WDJ[w]+'</div><div class="dd">'+d.getDate()+'</div></div>';
}
function dbkFromDt(dt){
  var d = ymd(dt.slice(0,10).replace(/\//g,'-'));
  return '<div class="dbk"><div class="wd">'+(d.getMonth()+1)+'月</div><div class="dd">'+d.getDate()+'</div></div>';
}
/* S-16-1: 履歴の日付に曜日を足す（例「8/30（土）」） */
function histDate(dt){
  var d = ymd(dt.slice(0,10).replace(/\//g,'-'));
  return (d.getMonth()+1)+'/'+d.getDate()+'（'+WDJ[d.getDay()]+'）';
}

/* S-01-1: パンチカードは購入した束（10／20／30回）の枠数で描く */
function punchCard(tickets, planned, bundle){
  var s = ticketState(tickets);
  var slots = bundle || 10;
  var pos = Math.max(0, tickets);
  var shown = Math.min(slots, pos);
  var hold = Math.min(shown, planned);
  var cells = '';
  for(var i=0;i<slots;i++){
    if(i < shown - hold) cells += '<span class="pu on"></span>';
    else if(i < shown)   cells += '<span class="pu hold"></span>';
    else                 cells += '<span class="pu"></span>';
  }
  var cols = slots > 10 ? 10 : slots;
  return '<div class="pcard"><div class="punch" data-s="'+s+'" style="grid-template-columns:repeat('+cols+',1fr)">'+cells+'</div>'
    + (pos>slots ? '<span class="plus">+'+(pos-slots)+'</span>' : '') + '</div>';
}
/* S-01-2: 受講済み／予約済み／残り の 3 値 */
function ticketLine(c, planned){
  return '<div class="tiny muted mt10">受講済み <b>'+c.used+'</b> ・ 予約済み <b>'+planned+'</b> ・ 残り <b>'+c.tickets+'</b></div>';
}

function minusNote(c){
  if(c.tickets >= 0) return '';
  return '<div class="line bad mt6">🎟 マイナス'+(-c.tickets)+'回</div>'
    + '<div class="tiny mt6" style="color:var(--danger);font-weight:700">'+esc(MINUS_NOTE)+'</div>';
}

function toast(msg){
  var w = document.getElementById('toast');
  var el = document.createElement('div');

  w.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3600);

var modalOk = null;
function openModal(o){
  document.getElementById('mTitle').textContent = o.title;
  document.getElementById('mBody').innerHTML = o.body;
  var acts = document.getElementById('mActs');
  acts.innerHTML = '';
  if(o.cancelText !== null){
    var b1 = document.createElement('button');
    b1.className='btn'; b1.textContent = o.cancelText || '閉じる';
    b1.onclick = closeModal; acts.appendChild(b1);
  }
  if(o.okText){
    var b2 = document.createElement('button');
    b2.className='btn ' + (o.okClass || 'pri'); b2.textContent = o.okText;
    b2.onclick = function(){ var f = modalOk; closeModal(); if(f) f(); };
    acts.appendChild(b2);
  }
  modalOk = o.onOk || null;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); modalOk = null; }

function shiftMonth(key, delta){
  var p = state[key].split('-'), y = +p[0], m = +p[1] + delta;
  while(m < 1){ m += 12; y -= 1; } while(m > 12){ m -= 12; y += 1; }
  state[key] = y + '-' + pad2(m);
  state.calDate = null; state.resCalDate = null; render();
}

  var p = state[key].split('-');
  return '<div class="mbar"><button onclick="shiftMonth(\''+key+'\',-1)" aria-label="前の月">◀</button>'
    + '<b>'+p[0]+'年'+(+p[1])+'月</b>'
    + '<button onclick="shiftMonth(\''+key+'\',1)" aria-label="次の月">▶</button></div>';
}

  return '<span class="chip c-ok">✅ 予約済み</span>';

function renderHome(){
  var c = cur();
  var mine = reservations.filter(function(r){return r.childId===c.id;})
    .map(function(r){return {r:r, l:LESSONS[r.lessonId]};})
    .sort(function(a,b){return sortKey(a.l) < sortKey(b.l) ? -1 : 1;});

  var planned = plannedCost(c.id);
  var s = ticketState(c.tickets);

  var h = '';
  h += unpaidBanner(c);
  if(c.tickets >= 0 && c.tickets <= 1) h += transferBanner();

  h += '<div class="card tkt">'
    + '<div class="spread" style="margin-bottom:10px">'
    + '<div class="small" style="font-weight:800">🎟 チケット</div>'
    + '<div><span class="pnum" data-s="'+s+'">'+c.tickets+'</span><span class="punit">回</span></div></div>'
    /* S-01-1: 購入済み枚数も出す */
    + '<div class="tiny mt6" style="font-weight:800">受講済み '+c.used+' / '+c.bundle+'回（'+c.bundle+'回券）</div>'
    + punchCard(c.tickets, planned, c.bundle)
    + ticketLine(c, planned)
    + minusNote(c)
    + '</div>';

  if(mine.length){
    var n0 = mine[0];
    var meta = n0.r.status==='waiting'
      ? '空席が出たらメール通知'
      : (expired(n0.l) ? expiredText(n0.l)
                       : fmtDlS(deadlineOf(n0.l))+' タイ時間 までキャンセル無料');
    var metaCls = (n0.r.status==='booked' && expired(n0.l)) ? ' dgr' : '';
    h += '<h3 class="sub">📅 次のレッスン</h3>'
      + '<button class="lrow hero tap" onclick="resSheet(\''+n0.r.id+'\')">'
      + dbk(n0.l.date, true)
      + '<div class="mid">'+(n0.l.level ? lvChip(n0.l.level,'sm')+' ' : '')
      + '<span class="t" style="display:inline">'+thai(n0.l.start)+' '+esc(n0.l.title)+' '+icon(n0.l.type)+'</span>'
      + '<div class="m'+metaCls+'">'+esc(meta)+'</div></div>'
      + statusChip(n0.r) + '</button>';
  } else {
    h += '<h3 class="sub">📅 次のレッスン</h3><div class="card tight"><div class="small muted">予約なし</div></div>';
  }

  var rest = mine.slice(1);
  h += '<div class="subrow"><h3 class="sub">このあと '+rest.length+'</h3>'
    + '<button class="more" onclick="go(\'screen-reservations\')">すべて ›</button></div>';
  if(!rest.length){
    h += '<div class="card tight"><div class="small muted">なし</div></div>';
  } else {
    h += rest.slice(0,3).map(function(x){
      return '<button class="lrow tap" onclick="resSheet(\''+x.r.id+'\')">'+dbk(x.l.date)
        + '<div class="mid">'+(x.l.level ? lvChip(x.l.level,'sm')+' ' : '')
        + '<span class="t" style="display:inline">'+thai(x.l.start)+' '+esc(x.l.title)+' '+icon(x.l.type)+'</span></div>'
        + statusChip(x.r) + '</button>';
    }).join('');
  }

  /* S-01-7: 生徒側の「個別」はすべて「マンツーマン」 */
  h += '<h3 class="sub">👤 マンツーマンレッスン</h3>'
    + '<div class="card tight">' + monoGauge(c) + '</div>';

  h += '<button class="btn pri block mt10" onclick="go(\'screen-lessons\')">＋ レッスンを予約する</button>';

  document.getElementById('homeBody').innerHTML = h;
}

      + '<label class="f"><span>受験級</span><select>'
      + LEVELS.map(function(lv){return '<option'+(lv===c.level?' selected':'')+'>'+esc(lv)+'</option>';}).join('')
      + '</select></label>'
      + '<button class="btn pri block" onclick="toast(\''+esc(c.short)+' さんの情報を保存しました（モック）\')">保存</button></div>';
  });

  if(state.addSibling){
    h += '<div class="card" style="border-color:var(--ink);border-width:2px"><h3 class="sub" style="margin-top:0">兄弟・姉妹を追加</h3>'
      + nameFields('', '', '例: 佐藤', '例: 葵')
      + romanFields('', '', 'SATO', 'AOI')
      + '<label class="f"><span>生年月日</span><input type="date"></label>'
      + schoolFields('', '◯年生', 2)
      + '<label class="f"><span>受験級</span><select>'+LEVELS.map(function(lv){return '<option>'+esc(lv)+'</option>';}).join('')+'</select></label>'
      + '<div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="state.addSibling=false;render()">やめる</button>'
      + '<button class="btn pri" style="flex:1" onclick="state.addSibling=false;render();toast(\'モック画面のため登録されません\')">追加する</button></div></div>';
  } else {
    h += '<button class="btn block" onclick="state.addSibling=true;render()">＋ 兄弟・姉妹を追加</button>';
  }
  h += '<button class="btn block mt10" onclick="go(\'screen-home\')">ホームに戻る</button>';
  document.getElementById('accountBody').innerHTML = h;
}

/* =========================================================
   Render: レッスン一覧
   ========================================================= */
function renderLessons(){
  var ts = document.querySelectorAll('#typeSeg button');
  for(var i=0;i<ts.length;i++) ts[i].classList.toggle('on', ts[i].getAttribute('data-t')===state.lessonType);
  var vs = document.querySelectorAll('#viewSeg button');
  for(var j=0;j<vs.length;j++) vs[j].classList.toggle('on', vs[j].getAttribute('data-v')===state.lessonView);

  var body = document.getElementById('lessonBody');
  if(state.lessonView === 'cal'){ body.innerHTML = renderCalendar(); return; }
  if(state.lessonType === 'regular') body.innerHTML = renderRegular();
  else if(state.lessonType === 'single') body.innerHTML = renderSingle();
  else body.innerHTML = renderMono();
}

function lessonsOfType(t){
  var out = [];
  for(var k in LESSONS){ if(LESSONS[k].type === t) out.push(LESSONS[k]); }
  out.sort(function(a,b){return sortKey(a) < sortKey(b) ? -1 : 1;});
  return out;
}
function bookBtn(id, label, cls){
  return '<button class="btn '+(cls||'pri')+' sm" onclick="startBook(\''+id+'\')">'+(label||'予約する')+'</button>';
}
/* A-06-3: 受付開始前は押せないボタンと文言を出す */
function notOpenBtn(l){
  return '<span class="chip c-off">受付前</span>'
    + '<button class="btn sm" disabled>予約する</button>';
}

/* --- 定期オンライン --- */
/* S-05-1: 級チップを先頭・大きめに置く。S-06-1: 時刻にタイ時間を付ける */
function rowHead(l, timeLabel){
  return '<div class="mid">'
    + (l.level ? '<div style="margin-bottom:2px">'+lvChip(l.level)+'</div>' : '')
    + '<div class="t">'+(timeLabel || thai(l.start))+' '+esc(l.title)+' '+icon(l.type)+'</div></div>';
}
function regularRow(l, c){
  if(l.closed){
    return '<div class="lrow off">'+dbk(l.date) + rowHead(l)
      + '<span class="chip c-off">🚫 休校</span></div>';
  }
  var r = resFor(c.id, l.id);
  var rt;
  if(r) rt = '<span class="chip c-ok">✅ 予約済み</span>';
  else if(notOpenYet(l)) rt = notOpenBtn(l);
  else rt = bookBtn(l.id);
  return '<div class="lrow">'+dbk(l.date) + rowHead(l)
    + '<div class="rt">'+rt+'</div></div>'
    + (notOpenYet(l) ? '<div class="tiny muted" style="margin:-4px 0 8px 50px">'+esc(openAtText(l))+'</div>' : '');
}
function renderRegular(){
  var c = cur();
  var myClass = classOf(c.classId);
  var h = '<h3 class="sub">'+esc(myClass.level)+'クラス ／ '+myClass.wd+' '+myClass.time+'</h3>';
  h += myClass.dates.map(function(d){ return regularRow(LESSONS['reg-'+myClass.id+'-'+d], c); }).join('');
  h += '<button class="more mt6" onclick="toggleOther()">'+(state.showOther?'他の級を閉じる ›':'他の級も見る ›')+'</button>';
  if(state.showOther){
    CLASSES.forEach(function(cl){
      if(cl.id === myClass.id) return;
      h += '<h3 class="sub">'+esc(cl.level)+'クラス ／ '+cl.wd+' '+cl.time+'</h3>';
      h += cl.dates.map(function(d){ return regularRow(LESSONS['reg-'+cl.id+'-'+d], c); }).join('');
    });
  }
  return h;
}

/* --- 対面単発 --- */
function singleRow(l, c){
  var r = resFor(c.id, l.id);
  var free = l.cap - l.booked;
  var rt;
  if(r && r.status === 'booked') rt = '<span class="chip c-ok">✅ 予約済み</span>';
  else if(r && r.status === 'waiting') rt = '<span class="chip c-wait">⏳ キャンセル待ち '+r.waitPos+'番目</span>';
  else if(notOpenYet(l)) rt = notOpenBtn(l);
  /* S-09-1: 「待つ」→「キャンセル待ちをする」 */
  else if(free <= 0) rt = '<span class="chip c-off">満席</span><button class="btn sm" onclick="startWait(\''+l.id+'\')">キャンセル待ちをする</button>';
  else rt = '<span class="chip c-free">空き '+free+'</span>'+bookBtn(l.id);
  return '<div class="lrow">'+dbk(l.date) + rowHead(l)
    + '<div class="rt">'+rt+'</div></div>'
    + (notOpenYet(l) ? '<div class="tiny muted" style="margin:-4px 0 8px 50px">'+esc(openAtText(l))+'</div>' : '');
}
function renderSingle(){
  var c = cur();
  /* S-07-1: 月見出しと前後の月送り */
  var h = monthBar('singleMonth');
  var list = lessonsOfType('single').filter(function(l){ return inMonth(l.date, 'singleMonth'); });
  h += list.length ? list.map(function(l){ return singleRow(l, c); }).join('')
                   : '<div class="card tight"><div class="small muted">この月の対面クラスはありません</div></div>';
  return h;
}

/* --- マンツーマン --- */
/* S-12-4: 枠に種別は持たせない（種別は予約確認で選ぶ） */
function monoRow(l, c){
  var r = resFor(c.id, l.id);
  var otherRes = anyChildRes(l.id);
  var rt, off = false;
  if(r){ rt = '<span class="chip c-ok">✅ 予約済み（'+esc(MONO_NAME[monoKindOf(r)])+'）</span>'; }
  else if(l.other || (otherRes && otherRes.childId !== c.id)){ rt = '<span class="chip c-off">満席</span>'; off = true; }
  else if(monoBothFull(c)){ rt = '<span class="chip c-off">上限に達しています</span>'; off = true; }
  else if(notOpenYet(l)){ rt = notOpenBtn(l); }
  else { rt = bookBtn(l.id); }
  return '<div class="lrow'+(off?' off':'')+'">'+dbk(l.date)
    + '<div class="mid"><div class="t">'+thai(l.time)+' マンツーマン 👤</div></div>'
    + '<div class="rt">'+rt+'</div></div>';
}
function renderMono(){
  var c = cur();
  var h = '<div class="card tight">'+monoGauge(c, true)+'</div>';
  /* S-12-1: 対象の年月を出す */
  h += monthBar('monoMonth');
  /* S-12-3: 「W 書く」「S 話す」→ 全角表記 */
  h += '<div class="seg sm" style="margin-bottom:10px">'
    + '<button class="'+(state.monoFilter==='all'?'on':'')+'" onclick="setMonoFilter(\'all\')">すべて</button>'
    + '<button class="'+(state.monoFilter==='W'?'on':'')+'" onclick="setMonoFilter(\'W\')">ライティング</button>'
    + '<button class="'+(state.monoFilter==='S'?'on':'')+'" onclick="setMonoFilter(\'S\')">スピーキング</button></div>';
  if(state.monoFilter !== 'all'){
    h += '<div class="tiny muted" style="margin:-4px 0 8px">枠に種別はありません。'
      + esc(MONO_NAME[state.monoFilter])+'の残り回数だけを上に表示しています。</div>';
  }
  var list = lessonsOfType('mono').filter(function(l){ return inMonth(l.date, 'monoMonth'); });
  h += list.length ? list.map(function(l){return monoRow(l, c);}).join('')
                   : '<div class="card tight"><div class="small muted">この月のマンツーマン枠はありません</div></div>';
  return h;
}

/* --- カレンダー ---
   S-05-2: 丸印をやめ「準2級 17:00-18:00」の色つきチップを置く
   S-01-5: 受講中の級の枠はすべて薄いチップ、予約済みだけ濃色＋「予約済み」 */
function calChip(l, booked){
  /* S-05-2: 級と開始時刻を出す。S-01-5: 予約済みだけ濃色にして「予約済み」と書く */
  var lab = (l.level ? l.level + ' ' : '') + l.start + (booked ? ' 予約済み' : '');
  return '<span class="cchip '+lvCls(l.level || 'その他')+(booked?' booked':'')+'">'+esc(lab)+'</span>';
}
function monthGrid(opt){
  /* opt: {ym, byDate, chipOf, selected, onPick, legend, todayYmd} */
  var p = opt.ym.split('-'), y = +p[0], m = +p[1];
  var first = new Date(y, m-1, 1).getDay();
  var days = new Date(y, m, 0).getDate();
  var h = '<div class="cal"><div class="spread" style="margin-bottom:6px"><b>'+y+'年 '+m+'月</b>'
    + '<span class="tiny muted">'+(opt.legend||'')+'</span></div><div class="cg">';
  WDJ.forEach(function(w,i){ h += '<div class="dw'+(i===0?' sun':(i===6?' sat':''))+'">'+w+'</div>'; });
  for(var i=0;i<first;i++) h += '<div class="cell empty"></div>';
  for(var d=1; d<=days; d++){
    var ds = y + '-' + pad2(m) + '-' + pad2(d);
    var ls = opt.byDate[ds] || [];
    var closed = CLOSED_DAYS.indexOf(ds) >= 0;
    var cls = 'cell' + (ls.length?' has tap':'') + (opt.selected===ds?' on':'') + (ds===opt.todayYmd?' today':'');
    h += '<div class="'+cls+'"'+(ls.length?(' onclick="'+opt.onPick+'(\''+ds+'\')"'):'')+'>'
      + '<div>'+d+'</div>'
      + (closed ? '<span class="xx">休校</span>' : '')
      + (ls.length ? ('<div class="cchips">'+ls.map(opt.chipOf).join('')+'</div>') : '')
      + '</div>';
  }
  return h + '</div>';
}
function renderCalendar(){
  var c = cur();
  var byDate = {};
  lessonsOfType(state.lessonType).forEach(function(l){
    if(l.date.indexOf('2026-09-') !== 0) return;
    if(state.lessonType === 'regular'){
      var isMine = (l.classId === c.classId);
      if(!state.showOther && !isMine) return;
    }
    (byDate[l.date] = byDate[l.date] || []).push(l);
  });

  var h = monthGrid({
    ym:'2026-09', byDate:byDate, selected:state.calDate, onPick:'pickDay', todayYmd:'2026-09-01',
    legend: icon(state.lessonType)+' '+TYPE[state.lessonType].label,
    chipOf: function(l){ return calChip(l, !!resFor(c.id, l.id)); }
  });
  if(state.lessonType==='regular'){
    h += '<button class="more mt6" onclick="toggleOther()">'+(state.showOther?esc(c.level)+'クラスのみ ›':'他の級も表示 ›')+'</button>';
  }
  h += '</div>';

  if(state.calDate){
    var ls2 = byDate[state.calDate] || [];
    h += '<div class="subrow"><h3 class="sub">'+shortMd(state.calDate)+'（'+realWd(state.calDate)+'）</h3>'
      + '<button class="more" onclick="state.calDate=null;render()">解除 ×</button></div>';
    h += ls2.map(function(l){
      if(l.type==='regular') return regularRow(l, c);
      if(l.type==='single') return singleRow(l, c);
      return monoRow(l, c);
    }).join('') || '<div class="card tight"><div class="small muted">レッスンなし</div></div>';
  }
  return h;
}
function pickDay(ds){ state.calDate = ds; render(); }
function pickResDay(ds){ state.resCalDate = ds; render(); }

/* =========================================================
   Render: 予約確認
   ========================================================= */
function startBook(lessonId){
  state.pending = {lessonId:lessonId, mode:'book', childId:state.childId, kind:null, eligible:false};
  go('screen-confirm');
}
function startWait(lessonId){
  state.pending = {lessonId:lessonId, mode:'wait', childId:state.childId, kind:null, eligible:false};
  go('screen-confirm');
}
function setPendingChild(id){ state.pending.childId = id; render(); }
/* S-12-4: マンツーマンは予約確認でライティング／スピーキングを選ぶ */
function setPendingKind(k){ state.pending.kind = k; render(); }
/* A-17-3 案B（要相談）: 一次試験合格者のみの枠は、確認のチェックを挟む */
function toggleEligible(){ state.pending.eligible = !state.pending.eligible; render(); }
/* キャンセル待ちの流れ（S-13-2 / S-15-1 / S-10-3） */
var WAIT_FLOW = [
  '空席が出たら、待っている方 全員にメールでお知らせします',
  '先着で受け付けます（順番に繰り上がる形ではありません）',
  'キャンセル待ちの取消は、いつでもできます'
];
function waitFlowHtml(){
  return '<ul class="mt10">'+WAIT_FLOW.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
}

function renderConfirm(){
  var box = document.getElementById('confirmBody');
  if(!state.pending){
    box.innerHTML = '<div class="card tight"><div class="small muted">レッスンが選ばれていません</div></div>'
      + '<button class="btn pri block" onclick="go(\'screen-lessons\')">レッスン一覧へ</button>';
    return;
  }
  var l = LESSONS[state.pending.lessonId];
  var c = child(state.pending.childId);
  var isWait = state.pending.mode === 'wait';
  var cost = TYPE[l.type].cost;
  var planned = plannedCost(c.id);
  var avail = c.tickets - planned;
  /* S-11-1 案B（要相談）: 残数が足りなくても −10 回までは予約できる */
  var after = avail - cost;
  var shortage = !isWait && (after < 0);
  var blockedByMinus = !isWait && (after < -MINUS_ALLOW);
  var kind = state.pending.kind;
  var needKind = !isWait && (l.type === 'mono');
  var limitReached = needKind && kind && (c.mono[kind] >= MONO_LIMIT[kind]);
  var needEligible = !isWait && !!l.eligibleOnly;
  var dup = resFor(c.id, l.id);

  /* 誰の予約か（チップ選択） */
  var h = '<div class="avrow">'
    + children.map(function(ch){
        return '<button class="av'+(ch.id===c.id?' on':'')+'" onclick="setPendingChild(\''+ch.id+'\')">'
          + '<span class="ini"></span>'+esc(ch.short)+'</button>';
      }).join('')
    + '</div>';

  h += '<div class="card"><div class="lrow" style="border:0;padding:0;margin:0;min-height:0">'
    + dbk(l.date, true)
    + '<div class="mid">'+(l.level ? '<div style="margin-bottom:2px">'+lvChip(l.level)+'</div>' : '')
    + '<div class="t" style="font-size:16px">'+thai(l.time || l.start)+' '+esc(l.title)+' '+icon(l.type)+'</div>'
    + '<div class="m">'+esc(l.place)+'</div></div>'
    + (isWait ? '<span class="chip c-wait">⏳ キャンセル待ち</span>' : '')+'</div>';

  /* S-12-4: 種別の選択をここに置く */
  if(needKind){
    h += '<div class="hr"></div><div class="small" style="font-weight:800;margin-bottom:6px">レッスンの種別を選んでください</div>'
      + '<div class="seg sm">'
      + '<button class="'+(kind==='W'?'on':'')+'" onclick="setPendingKind(\'W\')">ライティング</button>'
      + '<button class="'+(kind==='S'?'on':'')+'" onclick="setPendingKind(\'S\')">スピーキング</button></div>'
      + '<div class="tiny muted mt6">残り ライティング '+(MONO_LIMIT.W-c.mono.W)+' 回 ・ スピーキング '+(MONO_LIMIT.S-c.mono.S)+' 回</div>';
  }

  if(isWait){
    h += '<div class="line info mt10">🎟 消費なし ・ 現在 '+l.wait+'人待ち</div>'
      + '<div class="line ok mt6">✉️ 空席が出たらメールでお知らせ</div>'
      + waitFlowHtml();
  } else if(blockedByMinus){
    h += '<div class="line bad mt10">🎟 チケットのマイナスが '+MINUS_ALLOW+' 回を超えるため、この予約はお取りできません</div>';
  } else if(shortage){
    /* S-11-1 案B（要相談）: 足りなくても予約できる。未入金として表示する */
    h += '<div class="line bad mt10">🎟 チケットが足りませんが予約できます（未入金 '+(-after)+' 回）</div>'
      + '<div class="line ok mt6">⏰ '+fmtDl(deadlineOf(l))+' タイ時間 までキャンセル無料</div>';
  } else {
    h += '<div class="line info mt10">🎟 −'+cost+'  →  残り '+c.tickets+'（使える '+after+'）</div>'
      + '<div class="line ok mt6">⏰ '+fmtDl(deadlineOf(l))+' タイ時間 までキャンセル無料</div>';
  }
  if(dup){
    h += '<div class="line bad mt6">⚠️ '+esc(c.short)+' さんは登録済み</div>';
  } else if(limitReached){
    h += '<div class="line bad mt6">⚠️ '+MONO_NAME[kind]+'は上限 '+MONO_LIMIT[kind]+' 回</div>';
  }
  h += '</div>';

  /* A-17-3 案B（要相談）: 一次試験合格者のみの枠 */
  if(needEligible){
    h += '<div class="card" style="border-color:var(--orange);border-width:2px">'
      + '<div class="line bad">⚠️ この枠は一次試験の合格者のみご予約いただけます</div>'
      + '<label class="f mt10" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:0">'
      + '<input type="checkbox" style="width:22px;min-height:22px;margin-top:2px"'+(state.pending.eligible?' checked':'')+' onclick="toggleEligible()">'
      + '<span style="margin:0;font-size:13px;color:var(--ink);font-weight:700">一次試験に合格していることを確認しました</span></label>'
      + '<div class="talk"><span class="tk">ご相談中</span><span>合否をシステムで自動判定するか、この自己申告で進めるかは相談中です（A-17-3）。</span></div>'
      + '</div>';
  }

  var disabled = (dup || blockedByMinus || limitReached || (needKind && !kind) || (needEligible && !state.pending.eligible)) ? ' disabled' : '';
  h += '<button class="btn '+(isWait?'warn':'pri')+' block"'+disabled+' onclick="doConfirm()">'
    /* S-10-2: 「キャンセル待ちに入る」→「キャンセル待ちをする」 */
    + (isWait ? 'キャンセル待ちをする' : '予約を確定する') + '</button>'
    + (needKind && !kind ? '<div class="tiny muted mt6" style="text-align:center">種別を選ぶと予約できます</div>' : '')
    + '<button class="btn block mt10" onclick="go(\'screen-lessons\')">戻る</button>';

  if(shortage && !blockedByMinus){
    h += '<div class="talk"><span class="tk">ご相談中</span><span>チケットが足りないときに予約を通すかどうか（何回分まで許すか）は、いま田中と相談しています（S-11-1）。</span></div>';
  }

  box.innerHTML = h;
}

function doConfirm(){
  var l = LESSONS[state.pending.lessonId];
  var c = child(state.pending.childId);
  var isWait = state.pending.mode === 'wait';
  state.childId = c.id;

  var kind = state.pending.kind;

  if(isWait){
    l.wait += 1;
    reservations.push({id:'rv'+(seq++), childId:c.id, lessonId:l.id, status:'waiting', waitPos:l.wait});
    state.pending = null;
    openModal({title:'キャンセル待ちをしました',
      /* S-10-1: 対象の年月を出す */
      body:'<div class="tiny muted">'+ymLabel(l.date)+'</div>'
        + '<div class="line info">'+esc(c.short)+' ／ '+md(l.date)+'（'+realWd(l.date)+'） '+thai(l.start)+' ／ '+l.wait+'番目</div>'
        /* S-13-2: 空席が出たときの流れを 3 行で書く */
        + '<div class="small mt10" style="font-weight:800">空席が出たときの流れ</div>'
        + waitFlowHtml()
        + '<div class="tiny muted mt6">お知らせは、ご登録のメールアドレス宛にお送りします（モック）</div>',
      okText:'予約一覧', cancelText:null,
      onOk:function(){ go('screen-reservations'); }});
    toast('キャンセル待ちに登録しました');
    return;
  }

  if(l.type === 'single') l.booked += 1;
  if(l.type === 'mono' && kind) c.mono[kind] += 1;
  reservations.push({id:'rv'+(seq++), childId:c.id, lessonId:l.id, status:'booked', kind:kind});
  state.pending = null;
  openModal({title:'予約しました',
    /* S-10-1: 対象の年月を出す */
    body:'<div class="tiny muted">'+ymLabel(l.date)+'</div>'
      + '<div class="line info">'+esc(c.short)+' ／ '+md(l.date)+'（'+realWd(l.date)+'） '+thai(l.start)+' ／ '+esc(l.title)
      + (kind ? '（'+esc(MONO_NAME[kind])+'）' : '')+'</div>'
      + '<div class="line ok mt6">⏰ '+fmtDl(deadlineOf(l))+' タイ時間 までキャンセル無料</div>'
      /* S-14-1: 宛先を明記する */
      + '<div class="tiny muted mt6">確認メールを、ご登録のメールアドレス宛に送信しました（モック）</div>',
    okText:'予約一覧', cancelText:null,
    onOk:function(){ go('screen-reservations'); }});
  toast('予約が完了しました');
}
/* S-10-1: 対象の年月 */
function ymLabel(dateStr){ var d = ymd(dateStr); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'; }

/* =========================================================
   Render: 予約一覧
   ========================================================= */
function resRow(x){
  var l = x.l, r = x.r;
  var ex = (r.status==='booked') && expired(l);
  return '<button class="lrow tap" onclick="resSheet(\''+r.id+'\')">'+dbk(l.date)
    + '<div class="mid">'+(l.level ? '<div style="margin-bottom:2px">'+lvChip(l.level,'sm')+'</div>' : '')
    + '<div class="t">'+thai(l.start)+' '+esc(l.title)+' '+icon(l.type)+'</div>'
    /* S-02-1: 「キャンセル不可」ではなく期限超過の意味を書く */
    + (ex ? '<div class="m dgr">'+esc(expiredText(l))+'</div>' : '')+'</div>'
    + statusChip(r) + '</button>';
}
function renderReservations(){
  var c = cur();
  var mine = reservations.filter(function(r){return r.childId===c.id;})
    .map(function(r){return {r:r, l:LESSONS[r.lessonId]};})
    .sort(function(a,b){return sortKey(a.l) < sortKey(b.l) ? -1 : 1;});

  var vs = document.querySelectorAll('#resViewSeg button');
  for(var i=0;i<vs.length;i++) vs[i].classList.toggle('on', vs[i].getAttribute('data-rv')===state.resView);

  var h = '';
  if(!mine.length){
    h = '<div class="card tight"><div class="small muted">今後の予約なし</div></div>'
      + '<button class="btn pri block" onclick="go(\'screen-lessons\')">＋ レッスンを予約する</button>';
    document.getElementById('resBody').innerHTML = h; return;
  }

  if(state.resView === 'cal'){
    /* S-01-3: 予約する画面の月カレンダー部品をそのまま流用する */
    var byDate = {};
    mine.forEach(function(x){ (byDate[x.l.date] = byDate[x.l.date] || []).push(x); });
    h += monthGrid({
      ym:'2026-09', byDate:byDate, selected:state.resCalDate, onPick:'pickResDay', todayYmd:'2026-09-01',
      legend:'予約とキャンセル待ち',
      chipOf: function(x){
        if(x.r.status === 'waiting'){
          return '<span class="cchip lv-ot">⏳ 待ち '+x.r.waitPos+'番目</span>';
        }
        return calChip(x.l, true);
      }
    }) + '</div>';
    if(state.resCalDate){
      var day = byDate[state.resCalDate] || [];
      h += '<div class="subrow"><h3 class="sub">'+shortMd(state.resCalDate)+'（'+realWd(state.resCalDate)+'）</h3>'
        + '<button class="more" onclick="state.resCalDate=null;render()">解除 ×</button></div>';
      h += day.map(resRow).join('');
    }
  } else {
    h += mine.map(resRow).join('');
  }
  h += '<button class="btn pri block mt10" onclick="go(\'screen-lessons\')">＋ レッスンを予約する</button>';
  document.getElementById('resBody').innerHTML = h;
}

/* 予約詳細シート */
/* S-08-1: Zoom は URL・ミーティングID・パスワードの 3 項目をコピーボタン付きで出す */
function copyRow(k, v){
  return '<div class="cprow"><span class="ck">'+esc(k)+'</span><span class="cv">'+esc(v)+'</span>'
    + '<button class="cb" onclick="copyVal(\''+esc(v).replace(/'/g,"\\'")+'\')">コピー</button></div>';
}
function copyVal(v){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(function(){ toast('コピーしました'); },
      function(){ toast('コピーできませんでした'); });
  } else { toast('コピーしました（モック）'); }
}
function resSheet(rid){
  var r = resById(rid); if(!r) return;
  var l = LESSONS[r.lessonId], c = child(r.childId);
  /* S-13-1: レッスン日とキャンセル期限にタイ時間を付ける */
  var body = '<div class="line info">'+esc(c.short)+' ／ '+md(l.date)+'（'+realWd(l.date)+'） '+thai(l.time)+'</div>';
  body += '<div class="kv mt10"><span>レッスン</span><b>'+icon(l.type)+' '+esc(l.title)
    + (l.type==='mono' ? '（'+esc(MONO_NAME[monoKindOf(r)])+'）' : '')+'</b></div>'
    + (l.level ? '<div class="kv"><span>級</span><b>'+lvChip(l.level,'sm')+'</b></div>' : '')
    + '<div class="kv"><span>場所</span><b>'+esc(l.place)+'</b></div>';
  if(l.url){
    body += '<div class="small mt10" style="font-weight:800">Zoom の参加情報</div>'
      + copyRow('参加URL', l.url)
      + copyRow('ミーティングID', ZOOM_ID)
      + copyRow('パスワード', ZOOM_PW);
  }
  body += '<div class="kv mt10"><span>キャンセル期限</span><b'+((r.status==='booked'&&expired(l))?' style="color:var(--danger)"':'')+'>'
    + fmtDl(deadlineOf(l))+' タイ時間</b></div>'
    + (r.status==='waiting' ? '<div class="kv"><span>順番</span><b>'+r.waitPos+'番目</b></div>' : '');
  if(r.status==='booked' && expired(l)){
    body += '<div class="line bad mt6">'+esc(expiredText(l))+'</div>';
  }
  /* S-15-1: キャンセル待ちの詳細にも同じ 3 行を置く */
  if(r.status==='waiting'){
    body += '<div class="small mt10" style="font-weight:800">空席が出たときの流れ</div>' + waitFlowHtml();
  }
  openModal({title: r.status==='waiting' ? 'キャンセル待ち' : '予約の詳細',
    body: body,
    okText: r.status==='waiting' ? '待ちを取消' : 'キャンセルする', okClass:'dgr', cancelText:'閉じる',
    onOk:function(){ askCancel(rid); }});
}

function askCancel(rid){
  var r = resById(rid); if(!r) return;
  var l = LESSONS[r.lessonId], c = child(r.childId), cost = TYPE[l.type].cost;

  if(r.status === 'waiting'){
    openModal({title:'キャンセル待ちを取消',
      body:'<div class="line info">'+esc(c.short)+' ／ '+shortMd(l.date)+' '+l.start+'</div>'
        + '<div class="line ok mt6">✓ チケット消費なし</div>',
      okText:'取り消す', okClass:'dgrf', cancelText:'やめる',
      onOk:function(){ doCancel(rid); }});
    return;
  }
  var ex = expired(l);
  var body = '<div class="line info">'+esc(c.short)+' ／ '+shortMd(l.date)+' '+l.start+' ／ '+esc(l.title)+'</div>'
    + (ex ? '<div class="line bad mt6">⚠️ '+esc(expiredText(l))+'</div>'
          : '<div class="line ok mt6">✓ チケット消費なし</div>');
  openModal({title:'予約をキャンセル', body:body,
    okText:'キャンセルする', okClass:'dgrf', cancelText:'やめる',
    onOk:function(){ doCancel(rid); }});
}

function doCancel(rid){
  var idx = -1;
  for(var i=0;i<reservations.length;i++){ if(reservations[i].id===rid) idx = i; }
  if(idx < 0) return;
  var r = reservations[idx];
  var l = LESSONS[r.lessonId], c = child(r.childId), cost = TYPE[l.type].cost;
  var wasWaiting = (r.status === 'waiting');
  reservations.splice(idx, 1);

  if(wasWaiting){
    l.wait = Math.max(0, l.wait - 1);
    toast('キャンセル待ちを取り消しました');
    render();
    return;
  }

  if(l.type === 'single') l.booked = Math.max(0, l.booked - 1);
  if(l.type === 'mono'){ var mk = monoKindOf(r); c.mono[mk] = Math.max(0, c.mono[mk] - 1); }

  var ex = expired(l);
  var hist = lessonHistory[c.id] || (lessonHistory[c.id] = []);
  if(ex){
    /* S-11-1 案B（要相談）: 残数はマイナスまで落ちる */
    c.tickets = c.tickets - cost;
    c.used += cost;
    ticketHistory[c.id].unshift({dt:nowStamp(), text:'期限超過キャンセル（'+l.title+' '+shortMd(l.date)+'）', d:-cost, bal:c.tickets});
    hist.unshift({dt:l.date.replace(/-/g,'/')+' '+l.start, type:l.type, title:l.title,
      status:'キャンセル（期限超過）', sc:'b-cx', note:'キャンセル日時: '+nowStamp()+' ／ チケット'+cost+'回分を消費', score:''});
    toast('キャンセルしました（🎟 −'+cost+'）');
  } else {
    hist.unshift({dt:l.date.replace(/-/g,'/')+' '+l.start, type:l.type, title:l.title,
      status:'キャンセル（期限内）', sc:'b-cx', note:'キャンセル日時: '+nowStamp()+' ／ チケット消費なし', score:''});
    toast('キャンセルしました（🎟 消費なし）');
  }
  render();
}

/* =========================================================
   Render: 履歴
   ========================================================= */
function histChip(status){
  if(status === '受講済') return '<span class="chip c-free">✅ 受講</span>';
  if(status === '欠席')   return '<span class="chip c-dgr">✗ 欠席</span>';
  return '<span class="chip c-off">↩ 取消</span>';
}
function renderHistory(){
  var hs = document.querySelectorAll('#histSeg button');
  for(var i=0;i<hs.length;i++) hs[i].classList.toggle('on', hs[i].getAttribute('data-h')===state.histTab);
  var c = cur();
  var box = document.getElementById('histBody');

  if(state.histTab === 'lessons'){
    var list = lessonHistory[c.id] || [];
    box.innerHTML = list.length ? list.map(function(e){
      var t = e.dt.slice(11);
      var isMono = (e.type === 'mono');
      var h2 = '<div class="lrow" style="align-items:flex-start">'+dbkFromDt(e.dt)
        + '<div class="mid"><div class="t">'+histDate(e.dt)+' '+esc(thai(t))+'</div>'
        + '<div class="t" style="font-weight:700">'+esc(e.title)+' '+icon(e.type)+'</div>';
      /* S-16-4: マンツーマンの行は生徒側に評価を出さない */
      if(e.score && !isMono) h2 += '<div class="m" style="color:var(--purple);font-weight:700">'+esc(e.score)+'</div>';
      /* S-16-3: 「詳細」→「取り組んだ内容」、「コメント」→「講師コメント」 */
      if(e.did && e.did.length){
        h2 += '<details><summary>取り組んだ内容 ›</summary><div class="cm">'+esc(e.did.join(' ／ '))+'</div></details>';
      }
      if(e.note && !isMono){
        h2 += '<details><summary>'+(e.status==='受講済'?'講師コメント':'記録')+' ›</summary><div class="cm">'+esc(e.note)+'</div></details>';
      }
      if(e.note && isMono && e.status!=='受講済'){
        h2 += '<details><summary>記録 ›</summary><div class="cm">'+esc(e.note)+'</div></details>';
      }
      return h2 + '</div>' + histChip(e.status) + '</div>';
    }).join('') : '<div class="card tight"><div class="small muted">記録なし</div></div>';
    return;
  }

  if(state.histTab === 'tickets'){
    var t2 = ticketHistory[c.id] || [];
    var s = ticketState(c.tickets);
    var planned = plannedCost(c.id);
    var h = '<div class="card tkt">'
      + '<div class="spread" style="margin-bottom:10px"><div class="small" style="font-weight:800">🎟 チケット</div>'
      + '<div><span class="pnum" data-s="'+s+'">'+(c.tickets<0?'マイナス'+(-c.tickets):c.tickets)+'</span>'
      + '<span class="punit">回</span></div></div>'
      + '<div class="tiny mt6" style="font-weight:800">受講済み '+c.used+' / '+c.bundle+'回（'+c.bundle+'回券）</div>'
      + punchCard(c.tickets, planned, c.bundle)
      + ticketLine(c, planned)
      + minusNote(c) + '</div>';
    h += unpaidBanner(c);
    if(c.tickets >= 0 && c.tickets <= 1) h += transferBanner();
    h += t2.map(function(e){
      /* S-18-1: 残数がマイナスのときは「マイナス N 回」と書く */
      var bal = e.bal < 0 ? 'マイナス'+(-e.bal)+'回' : '残 '+e.bal;
      return '<div class="lrow" style="min-height:48px">'+dbkFromDt(e.dt)
        + '<div class="mid"><div class="t" style="font-weight:600;font-size:13px">'+esc(e.text)+'</div></div>'
        + '<div class="rt"><span class="chip '+(e.d>0?'c-free':'c-dgr')+'">'+(e.d>0?'+':'−')+Math.abs(e.d)+'</span>'
        + '<span class="tiny '+(e.bal<0?'':'muted')+'" style="'+(e.bal<0?'color:var(--danger);font-weight:800':'')+'">'+bal+'</span></div></div>';
    }).join('');
    box.innerHTML = h;
    return;
  }

  var er = eikenResults[c.id] || [];
  /* S-17-1: 保護者が結果を登録できるようにする */
  var h3 = '<button class="btn pri block" onclick="eikenInputSheet()">＋ 結果を入力する</button><div class="mt10"></div>';
  h3 += er.length ? er.map(function(e){
    return '<div class="card">'
      /* S-17-2: 年度と回を出す */
      + '<div class="tiny muted">'+esc(e.year)+' '+esc(e.round)+'</div>'
      + '<div class="spread" style="margin-top:2px"><div><div style="font-size:26px;font-weight:800;line-height:1.1">'+esc(e.level)+'</div>'
      + '<div class="tiny muted">'+md(e.date)+' 受験</div></div>'
      + '<span class="chip '+(e.pass==='合格'?'c-free':'c-dgr')+'" style="font-size:14px;padding:6px 14px">'+esc(e.pass)+'</span></div>'
      + '<div class="hr"></div>'
      /* S-01-8 と同じ方針で、R/L/W/S も文字に開く */
      + skillBar('リーディング', e.r) + skillBar('リスニング', e.l)
      + skillBar('ライティング', e.w) + skillBar('スピーキング', e.s)
      + '<div class="kv mt6"><span>CSE</span><b>'+esc(e.cse)+'</b></div>'
      + '<div class="kv"><span>入力</span><b>'+esc(e.by)+'</b></div>'
      + '</div>';
  }).join('') : '<div class="card tight"><div class="small muted">記録なし</div></div>';
  box.innerHTML = h3;
}
/* S-17-1 / A-16-1（種別プルダウンまで）: 結果の入力シート */
function eikenInputSheet(){
  var y = '';
  for(var i=2026;i>=2022;i--) y += '<option>'+i+'年度</option>';
  openModal({title:'英検の結果を入力する',
    body:'<label class="f"><span>試験の種類</span><select onchange="toast(\'英検以外の入力欄は、お申し込みが決まってから作ります（モック）\')">'
        + '<option>英検</option><option>IELTS</option><option>TOEFL iBT</option><option>TOEIC</option></select></label>'
      + '<div class="tiny muted" style="margin:-4px 0 10px">英検以外（IELTS・TOEFL・TOEIC）は今回の範囲外です。プルダウンだけ置いています（A-16-1）。</div>'
      + '<div style="display:flex;gap:8px">'
      + '<label class="f" style="flex:1"><span>年度</span><select>'+y+'</select></label>'
      + '<label class="f" style="flex:1"><span>回</span><select>'
      + EIKEN_ROUNDS.map(function(r){return '<option>'+esc(r)+'</option>';}).join('')+'</select></label></div>'
      + '<label class="f"><span>受験日</span><input type="date" value="2026-10-11"></label>'
      + '<label class="f"><span>級</span><select>'
      + LEVELS.map(function(lv){return '<option>'+esc(lv)+'</option>';}).join('')+'</select></label>'
      + '<label class="f"><span>合否</span><select><option>合格</option><option>不合格</option><option>一次合格（二次待ち）</option></select></label>'
      + '<div style="display:flex;gap:8px">'
      + '<label class="f" style="flex:1"><span>リーディング</span><input placeholder="例: 22 / 30"></label>'
      + '<label class="f" style="flex:1"><span>リスニング</span><input placeholder="例: 24 / 30"></label></div>'
      + '<div style="display:flex;gap:8px">'
      + '<label class="f" style="flex:1"><span>ライティング</span><input placeholder="例: 12 / 16"></label>'
      + '<label class="f" style="flex:1"><span>スピーキング</span><input placeholder="例: 25 / 33"></label></div>'
      + '<label class="f"><span>CSE スコア</span><input placeholder="例: 1610"></label>'
      + '<div class="tiny muted">保護者が入力した結果は「保護者入力」として管理者側にも表示されます。</div>',
    okText:'登録する', cancelText:'やめる',
    onOk:function(){ toast('モック画面のため登録されません'); }});
}
function skillBar(label, val){
  var p = val.split('/');
  var a = parseInt(p[0],10) || 0, b = parseInt(p[1],10) || 1;
  var pct = Math.max(0, Math.min(100, Math.round(a/b*100)));
  return '<div class="sk"><span class="lb">'+label+'</span>'
    + '<span class="bar"><i style="width:'+pct+'%"></i></span>'
    + '<span class="vv">'+esc(val)+'</span></div>';
}

   init

document.getElementById('hdWho').textContent = parent.name;
go('screen-login');
